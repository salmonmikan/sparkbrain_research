name: h7-formal-r5-one-way-readiness

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - research/main-h7-r5-oneway-controller-r98
    paths:
      - .github/workflows/h7-formal-r5-one-way-readiness.yml

permissions:
  contents: read

env:
  H7_SOURCE_BRANCH: research/main-h7-formal-r5-runtime-identity-r88-cycle12
  H7_SOURCE_SHA: 2f30b93f8f3cf226ef55ed5af7e341089d2c3c80
  ANALYST_BRANCH: ops/evidence-analyst-handoff
  ANALYST_SHA: df2e59996409211a2b104918e01a7f61d0eb3c80
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  nonresult-readiness:
    name: NON_RESULT H7 R5 one-way readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout controller registration commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          path: controller

      - name: Re-fetch exact authority and fail closed on supersession
        working-directory: controller
        shell: bash
        run: |
          set -euo pipefail
          source_line="$(git ls-remote origin "refs/heads/${H7_SOURCE_BRANCH}")"
          analyst_line="$(git ls-remote origin "refs/heads/${ANALYST_BRANCH}")"
          test "${source_line%%$'\t'*}" = "${H7_SOURCE_SHA}"
          test "${analyst_line%%$'\t'*}" = "${ANALYST_SHA}"

      - name: Assert fresh H7 one-way namespaces remain untouched
        working-directory: controller
        shell: bash
        run: |
          set -euo pipefail
          for pattern in \
            'refs/heads/control/h7*' \
            'refs/heads/preserve/h7*' \
            'refs/tags/formal/h7*' \
            'refs/tags/sealed/h7*' \
            'refs/tags/freeze/h7*'
          do
            if git ls-remote --exit-code origin "${pattern}" >/tmp/h7-ref-match 2>/dev/null; then
              echo "H7 one-way namespace collision: ${pattern}" >&2
              cat /tmp/h7-ref-match >&2
              exit 1
            fi
          done

      - name: Checkout exact H7 scientific source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2f30b93f8f3cf226ef55ed5af7e341089d2c3c80
          fetch-depth: 0
          path: science

      - name: Set up exact scientific Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false

      - name: Validate exact R5 contract and fixed scientific blobs
        working-directory: science
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${H7_SOURCE_SHA}"
          test "$(git hash-object src/sparkbrain/learned/h7_formal_r3_executor.py)" = "f323df048f5479cc80ba4c129a40b0957503180b"
          test "$(git hash-object src/sparkbrain/learned/h7_formal_r3.py)" = "9bde5379542ecca84157e82868abe679e0099e31"
          test "$(git hash-object src/sparkbrain/learned/h7_formal_r3_integrity.py)" = "37c9c46febba1baba5580ed1aa803dcc483bef66"
          test "$(git hash-object src/sparkbrain/learned/h7_formal_r1.py)" = "dd189f48b1a54bf08921c63d0f0ba3dbfc5c56a9"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          contract = json.loads(Path("artifacts/formal_h7_r5/resource_contract.json").read_text())
          assert contract["schema_version"] == 2
          assert contract["contract_id"] == "H7-FORMAL-R5-CONTENT-ADDRESSED-RUNTIME-IDENTITY-V1"
          assert contract["development_phase"] == "RESULT_EXPOSED_DEVELOPMENT"
          assert contract["authorized_cycle"] == 12
          assert contract["claim_ceiling"] == "MECHANISM"
          assert all(value is False for value in contract["one_way_hard_stop"].values())
          scientific = contract["scientific_runtime_identity"]
          checks = {
              "artifacts/formal_h7_r4/scientific-runtime.lock": scientific["package_lock"]["sha256"],
              "artifacts/formal_h7_r4/scientific-runtime-manifest.json": scientific["package_manifest"]["sha256"],
              "artifacts/formal_h7_r4/scientific-runtime.versions": scientific["package_versions"]["sha256"],
          }
          for path, expected in checks.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              assert actual == expected, (path, actual, expected)
          PY

      - name: Recreate locked scientific runtime
        working-directory: science
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .h7-r5-scientific
          .h7-r5-scientific/bin/python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --no-deps \
            -r artifacts/formal_h7_r4/scientific-runtime.lock

      - name: Re-run exact NON_RESULT R5 preidentity validation
        working-directory: science
        env:
          PYTHONPATH: ${{ github.workspace }}/science/src
        shell: bash
        run: .h7-r5-scientific/bin/python scripts/preflight_h7_formal_r5_cycle12.py

      - name: Assert protected sidecar handoff capability exists without exposing it
        env:
          H7_R5_SIDECAR_PASSPHRASE: ${{ secrets.H7_R5_SIDECAR_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${H7_R5_SIDECAR_PASSPHRASE:-}" ]; then
            echo 'Missing H7_R5_SIDECAR_PASSPHRASE; refusing to arm FORMAL.' >&2
            exit 1
          fi
          if [ "${#H7_R5_SIDECAR_PASSPHRASE}" -lt 32 ]; then
            echo 'H7_R5_SIDECAR_PASSPHRASE is too short; refusing to arm FORMAL.' >&2
            exit 1
          fi
          echo 'Protected sidecar handoff capability present (value concealed).'

      - name: Assert readiness gate remains strictly non-result-bearing
        working-directory: science
        shell: bash
        run: |
          set -euo pipefail
          test ! -e artifacts/formal_h7_r5/FORMAL_IDENTITY.json
          test ! -e artifacts/formal_h7_r5/STARTED.json
          test ! -e artifacts/formal_h7_r5/official_prediction_raw.jsonl
          test ! -e artifacts/formal_h7_r5/official_score.json
          echo 'H7_R5_ONE_WAY_READINESS_NON_RESULT_OK'
