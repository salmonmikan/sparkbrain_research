name: sub-v05-assembly-unit-causal-selectivity-dev

on:
  push:
    branches:
      - research/exploratory-sub-assembly-unit-causal-selectivity-20260921
    paths:
      - analysis/discovery/sub-v05-assembly-unit-causal-selectivity-20260921/run_diagnostic.py
      - .github/workflows/sub-v05-assembly-unit-causal-selectivity-dev.yml

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,learned,spiking]"
      - name: Run bounded DEV diagnostic
        run: |
          python analysis/discovery/sub-v05-assembly-unit-causal-selectivity-20260921/run_diagnostic.py --output /tmp/sub-result.json
          cat /tmp/sub-result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: sub-v05-assembly-unit-causal-selectivity-result-${{ github.sha }}
          path: /tmp/sub-result.json
          if-no-files-found: error
