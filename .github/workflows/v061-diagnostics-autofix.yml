name: v061-diagnostics-autofix

on:
  push:
    branches:
      - v061-candidate-003-failure-diagnostics-work
    paths:
      - ".github/workflows/v061-diagnostics-autofix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v061-candidate-003-failure-diagnostics-work
          fetch-depth: 1
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Wrap long report header
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/run_v061_failure_diagnostics.py")
          text = path.read_text(encoding="utf-8")
          old = '        "| Pattern | Storage match | Exact expression | Contains expected | Storage failures | Expression failures |",\n'
          new = (
              '        "| Pattern | Storage match | Exact expression | Contains expected | "\n'
              '        "Storage failures | Expression failures |",\n'
          )
          if text.count(old) != 1:
              raise SystemExit("diagnostic report header did not match once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Apply Ruff fixes
        run: |
          python -m pip install "ruff>=0.9"
          python -m ruff check --fix \
            src/sparkbrain/evaluation/v061_diagnostic_worlds.py \
            src/sparkbrain/evaluation/v061_lag_diagnostics.py \
            src/sparkbrain/evaluation/v061_relation_diagnostics.py \
            tests/v06/test_v061_failure_diagnostics.py \
            scripts/run_v061_failure_diagnostics.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/sparkbrain/evaluation/v061_diagnostic_worlds.py \
            src/sparkbrain/evaluation/v061_lag_diagnostics.py \
            src/sparkbrain/evaluation/v061_relation_diagnostics.py \
            tests/v06/test_v061_failure_diagnostics.py \
            scripts/run_v061_failure_diagnostics.py
          git commit -m "style(v061): normalize failure diagnostic sources [skip ci]"
          git push origin HEAD:v061-candidate-003-failure-diagnostics-work
