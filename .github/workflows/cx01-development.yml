name: cx01-development

on:
  push:
    branches:
      - research/cx01-comparator-extension
      - research/cx01-g6-vomm
      - research/cx01-g7-htm
      - research/cx01-g8-stm
    paths:
      - "src/sparkbrain/comparison/cx01/**"
      - "tests/cx01/**"
      - "docs/CX01_*.md"
      - ".github/workflows/cx01-development.yml"
  pull_request:
    paths:
      - "src/sparkbrain/comparison/cx01/**"
      - "tests/cx01/**"
      - "docs/CX01_*.md"
      - ".github/workflows/cx01-development.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    strategy:
      matrix:
        python-version: ["3.11.16", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff CX01
        run: python -m ruff check src/sparkbrain/comparison/cx01 tests/cx01
      - name: CX01 tests
        run: python -m pytest -q tests/cx01
      - name: Execute development-only comparator matrix
        if: matrix.python-version == '3.11.16'
        run: >-
          python -m sparkbrain.comparison.cx01.development_artifacts
          --output-dir /tmp/cx01-development
      - name: Print audited development summary
        if: matrix.python-version == '3.11.16'
        run: cat /tmp/cx01-development/development_summary.json
      - name: Upload development-only matrix
        if: matrix.python-version == '3.11.16'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cx01-development-${{ github.sha }}
          path: /tmp/cx01-development
          if-no-files-found: error

# Development validation only. This workflow never constructs or executes a
# formal held-out CX01 candidate and has no permission to publish evidence.
