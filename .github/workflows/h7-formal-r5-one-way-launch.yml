name: h7-formal-r5-one-way-launch
run-name: H7 R5 one-way FORMAL launch

# FRESH_ANALYST_REQUIRED_BEFORE_START
# This workflow is intentionally dormant until a fresh Analyst explicitly binds
# this exact controller SHA and authorizes one fresh identity. R105 itself cannot
# pass the controller's prepare-identity gate.
on:
  push:
    tags:
      - launch/h7-r5-*

permissions:
  contents: write

env:
  H7_SOURCE_SHA: 2f30b93f8f3cf226ef55ed5af7e341089d2c3c80
  H7_SOURCE_BRANCH: research/main-h7-formal-r5-runtime-identity-r88-cycle12
  ANALYST_BRANCH: ops/evidence-analyst-handoff
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  start:
    name: Bind fresh identity and START exactly once
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      identity_id: ${{ steps.identity.outputs.identity_id }}
      control_ref: ${{ steps.identity.outputs.control_ref }}
      controller_sha: ${{ steps.identity.outputs.controller_sha }}
      analyst_sha: ${{ steps.authority.outputs.analyst_sha }}
    steps:
      - name: Checkout exact controller tag target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          path: controller

      - name: Assert launch tag target is the exact controller commit
        id: controller
        working-directory: controller
        shell: bash
        run: |
          set -euo pipefail
          controller_sha="$(git rev-parse HEAD)"
          test "${controller_sha}" = "${GITHUB_SHA}"
          echo "controller_sha=${controller_sha}" >> "${GITHUB_OUTPUT}"

      - name: Fetch fresh Evidence Analyst state
        id: authority
        working-directory: controller
        shell: bash
        run: |
          set -euo pipefail
          analyst_sha="$(git ls-remote origin refs/heads/${ANALYST_BRANCH} | cut -f1)"
          test -n "${analyst_sha}"
          git fetch --no-tags origin "${analyst_sha}"
          git show "${analyst_sha}:analysis/orchestrator/state.json" > "${RUNNER_TEMP}/analyst-state.json"
          echo "analyst_sha=${analyst_sha}" >> "${GITHUB_OUTPUT}"

      - name: Assert H7 one-way namespaces are unused
        working-directory: controller
        shell: bash
        run: |
          set -euo pipefail
          for pattern in \
            'refs/heads/control/h7*' \
            'refs/heads/preserve/h7*' \
            'refs/tags/formal/h7*' \
            'refs/tags/sealed/h7*' \
            'refs/tags/freeze/h7*'
          do
            if git ls-remote --exit-code origin "${pattern}" >/tmp/h7-ref-match 2>/dev/null; then
              echo "H7 one-way namespace collision: ${pattern}" >&2
              cat /tmp/h7-ref-match >&2
              exit 1
            fi
          done

      - name: Checkout exact frozen H7 science
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2f30b93f8f3cf226ef55ed5af7e341089d2c3c80
          fetch-depth: 0
          path: science

      - name: Set up exact scientific Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false

      - name: Recreate locked scientific runtime and preflight before identity
        working-directory: science
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/science/src
        run: |
          set -euo pipefail
          python -m venv .h7-r5-scientific
          .h7-r5-scientific/bin/python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --no-deps \
            -r artifacts/formal_h7_r4/scientific-runtime.lock
          GITHUB_WORKSPACE="${GITHUB_WORKSPACE}/science" \
            .h7-r5-scientific/bin/python scripts/preflight_h7_formal_r5_cycle12.py

      - name: Materialize fresh identity, encrypted protected plan, and STARTED locally
        id: identity
        env:
          H7_R5_SIDECAR_PASSPHRASE: ${{ secrets.H7_R5_SIDECAR_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/h7-control"
          mkdir -p "${out}"
          python controller/scripts/h7_formal_r5_one_way_controller.py prepare-identity \
            --controller-root controller \
            --science-root science \
            --analyst-state "${RUNNER_TEMP}/analyst-state.json" \
            --analyst-commit "${{ steps.authority.outputs.analyst_sha }}" \
            --output-dir "${out}" > "${RUNNER_TEMP}/identity-summary.json"
          identity_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["identity_id"])' "${RUNNER_TEMP}/identity-summary.json")"
          control_ref="control/h7-r5-${identity_id}-started"
          echo "identity_id=${identity_id}" >> "${GITHUB_OUTPUT}"
          echo "control_ref=${control_ref}" >> "${GITHUB_OUTPUT}"
          echo "controller_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Atomically create STARTED control ref
        working-directory: controller
        shell: bash
        run: |
          set -euo pipefail
          current_analyst_sha="$(git ls-remote origin refs/heads/${ANALYST_BRANCH} | cut -f1)"
          test "${current_analyst_sha}" = "${{ steps.authority.outputs.analyst_sha }}"
          control_ref="${{ steps.identity.outputs.control_ref }}"
          if git ls-remote --exit-code origin "refs/heads/${control_ref}" >/dev/null 2>&1; then
            echo "control ref collision: ${control_ref}" >&2
            exit 1
          fi
          worktree="${RUNNER_TEMP}/control-worktree"
          git worktree add --detach "${worktree}" "${GITHUB_SHA}"
          mkdir -p "${worktree}/artifacts/formal_h7_r5/active"
          cp "${RUNNER_TEMP}/h7-control/FORMAL_IDENTITY.json" "${worktree}/artifacts/formal_h7_r5/active/FORMAL_IDENTITY.json"
          cp "${RUNNER_TEMP}/h7-control/STARTED.json" "${worktree}/artifacts/formal_h7_r5/active/STARTED.json"
          cp "${RUNNER_TEMP}/h7-control/evaluation_payload.enc" "${worktree}/artifacts/formal_h7_r5/active/evaluation_payload.enc"
          git -C "${worktree}" add artifacts/formal_h7_r5/active
          git -C "${worktree}" -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "h7 formal r5: create fresh identity and STARTED"
          started_sha="$(git -C "${worktree}" rev-parse HEAD)"
          git push origin "${started_sha}:refs/heads/${control_ref}"

  predict-and-preserve:
    name: Produce target-blind raw and preserve before target access
    needs: start
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      preserve_ref: ${{ steps.refs.outputs.preserve_ref }}
      freeze_tag: ${{ steps.refs.outputs.freeze_tag }}
      preserve_sha: ${{ steps.persist.outputs.preserve_sha }}
    steps:
      - name: Checkout exact controller source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.start.outputs.controller_sha }}
          fetch-depth: 0
          path: controller

      - name: Checkout exact frozen H7 science
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2f30b93f8f3cf226ef55ed5af7e341089d2c3c80
          fetch-depth: 0
          path: science

      - name: Checkout exact STARTED control ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.start.outputs.control_ref }}
          fetch-depth: 0
          path: control

      - name: Set up exact scientific Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false

      - name: Recreate locked runtime
        working-directory: science
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .h7-r5-scientific
          .h7-r5-scientific/bin/python -m pip install \
            --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps \
            -r artifacts/formal_h7_r4/scientific-runtime.lock

      - name: Produce target-blind raw only after STARTED
        env:
          H7_R5_SIDECAR_PASSPHRASE: ${{ secrets.H7_R5_SIDECAR_PASSPHRASE }}
          PYTHONPATH: ${{ github.workspace }}/science/src
        shell: bash
        run: |
          set -euo pipefail
          identity_dir="${GITHUB_WORKSPACE}/control/artifacts/formal_h7_r5/active"
          raw="${RUNNER_TEMP}/official_prediction_raw.jsonl"
          science/.h7-r5-scientific/bin/python controller/scripts/h7_formal_r5_one_way_controller.py predict-raw \
            --science-root science --identity-dir "${identity_dir}" --raw-path "${raw}"
          science/.h7-r5-scientific/bin/python controller/scripts/h7_formal_r5_one_way_controller.py preserve-raw \
            --science-root science --raw-path "${raw}" --preserve-dir "${RUNNER_TEMP}/preserve"

      - name: Define create-only preserve refs
        id: refs
        shell: bash
        run: |
          identity_id="${{ needs.start.outputs.identity_id }}"
          echo "preserve_ref=preserve/h7-r5-${identity_id}-raw" >> "${GITHUB_OUTPUT}"
          echo "freeze_tag=freeze/h7-r5-${identity_id}-raw" >> "${GITHUB_OUTPUT}"

      - name: Atomically persist raw before any target-side scoring
        id: persist
        working-directory: controller
        shell: bash
        run: |
          set -euo pipefail
          preserve_ref="${{ steps.refs.outputs.preserve_ref }}"
          freeze_tag="${{ steps.refs.outputs.freeze_tag }}"
          for ref in "refs/heads/${preserve_ref}" "refs/tags/${freeze_tag}"; do
            if git ls-remote --exit-code origin "${ref}" >/dev/null 2>&1; then
              echo "preserve collision: ${ref}" >&2
              exit 1
            fi
          done
          worktree="${RUNNER_TEMP}/preserve-worktree"
          started_sha="$(git -C "${GITHUB_WORKSPACE}/control" rev-parse HEAD)"
          git worktree add --detach "${worktree}" "${started_sha}"
          mkdir -p "${worktree}/artifacts/formal_h7_r5/preserved/${{ needs.start.outputs.identity_id }}"
          cp -a "${RUNNER_TEMP}/preserve/." "${worktree}/artifacts/formal_h7_r5/preserved/${{ needs.start.outputs.identity_id }}/"
          git -C "${worktree}" add artifacts/formal_h7_r5/preserved
          git -C "${worktree}" -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "h7 formal r5: preserve target-blind raw"
          preserve_sha="$(git -C "${worktree}" rev-parse HEAD)"
          git push origin "${preserve_sha}:refs/heads/${preserve_ref}"
          git push origin "${preserve_sha}:refs/tags/${freeze_tag}"
          echo "preserve_sha=${preserve_sha}" >> "${GITHUB_OUTPUT}"

  score-and-seal:
    name: Score only after remote raw preservation
    needs: [start, predict-and-preserve]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact controller source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.start.outputs.controller_sha }}
          fetch-depth: 0
          path: controller

      - name: Checkout exact frozen H7 science
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2f30b93f8f3cf226ef55ed5af7e341089d2c3c80
          fetch-depth: 0
          path: science

      - name: Checkout STARTED control ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.start.outputs.control_ref }}
          fetch-depth: 0
          path: control

      - name: Checkout remotely preserved raw
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.predict-and-preserve.outputs.preserve_ref }}
          fetch-depth: 0
          path: preserved

      - name: Verify freeze tag is the exact preserve commit
        working-directory: controller
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/${{ needs.predict-and-preserve.outputs.freeze_tag }}:refs/tags/${{ needs.predict-and-preserve.outputs.freeze_tag }}"
          test "$(git rev-parse 'refs/tags/${{ needs.predict-and-preserve.outputs.freeze_tag }}^{commit}')" = "${{ needs.predict-and-preserve.outputs.preserve_sha }}"
          test "$(git -C ../preserved rev-parse HEAD)" = "${{ needs.predict-and-preserve.outputs.preserve_sha }}"

      - name: Set up exact scientific Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false

      - name: Recreate locked runtime
        working-directory: science
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .h7-r5-scientific
          .h7-r5-scientific/bin/python -m pip install \
            --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps \
            -r artifacts/formal_h7_r4/scientific-runtime.lock

      - name: Score only after verified remote preserve
        env:
          H7_R5_SIDECAR_PASSPHRASE: ${{ secrets.H7_R5_SIDECAR_PASSPHRASE }}
          PYTHONPATH: ${{ github.workspace }}/science/src
        shell: bash
        run: |
          set -euo pipefail
          identity_id="${{ needs.start.outputs.identity_id }}"
          science/.h7-r5-scientific/bin/python controller/scripts/h7_formal_r5_one_way_controller.py score-after-preserve \
            --science-root science \
            --identity-dir "${GITHUB_WORKSPACE}/control/artifacts/formal_h7_r5/active" \
            --preserve-dir "${GITHUB_WORKSPACE}/preserved/artifacts/formal_h7_r5/preserved/${identity_id}" \
            --score-path "${RUNNER_TEMP}/official_score.json"

      - name: Create sealed/formal/evidence refs without clobber
        working-directory: controller
        shell: bash
        run: |
          set -euo pipefail
          identity_id="${{ needs.start.outputs.identity_id }}"
          formal_tag="formal/h7-r5-${identity_id}"
          sealed_tag="sealed/h7-r5-${identity_id}"
          evidence_tag="evidence/h7-r5-${identity_id}"
          for tag in "${formal_tag}" "${sealed_tag}" "${evidence_tag}"; do
            if git ls-remote --exit-code origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "final ref collision: ${tag}" >&2
              exit 1
            fi
          done
          worktree="${RUNNER_TEMP}/score-worktree"
          git worktree add --detach "${worktree}" "${{ needs.predict-and-preserve.outputs.preserve_sha }}"
          mkdir -p "${worktree}/artifacts/formal_h7_r5/scored/${identity_id}"
          cp "${RUNNER_TEMP}/official_score.json" "${worktree}/artifacts/formal_h7_r5/scored/${identity_id}/official_score.json"
          git -C "${worktree}" add artifacts/formal_h7_r5/scored
          git -C "${worktree}" -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "h7 formal r5: score after raw preserve"
          result_sha="$(git -C "${worktree}" rev-parse HEAD)"
          git push origin "${result_sha}:refs/tags/${formal_tag}"
          git push origin "${result_sha}:refs/tags/${sealed_tag}"
          git push origin "${result_sha}:refs/tags/${evidence_tag}"
