name: Temporary CX01 pre-start guard validation

on:
  push:
    branches:
      - "fix/cx01-audit-contract-v2-20260911"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cx01-audit-contract-v2-20260911
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,learned,spiking]"
      - name: Verify rejected-freeze commit guard
        shell: bash
        run: |
          expected="f2c5ead5afda7d731033d585511ea68dc066a162"
          git fetch origin "refs/heads/freeze/cx01-001:refs/remotes/origin/freeze/cx01-001"
          actual="$(git rev-parse refs/remotes/origin/freeze/cx01-001)"
          test "${actual}" = "${expected}"
      - name: Validate source-only candidate contracts
        run: |
          ruff check src/sparkbrain/comparison/cx01 tests/cx01
          pytest -q tests/cx01
          python - <<'PY'
          from sparkbrain.comparison.cx01.candidate import (
              CandidateSpec,
              build_candidate_grid,
              candidate_component_structure_audit,
              candidate_identifiability_audit,
              candidate_structure_audit,
          )

          candidate = CandidateSpec(
              generation_id="cx01-candidate-002",
              seeds=tuple(range(370110, 370120)),
          )
          candidate.require_formal()
          worlds = build_candidate_grid(candidate)
          assert len(worlds) == 60
          audits = (
              candidate_structure_audit(candidate),
              candidate_component_structure_audit(candidate),
              candidate_identifiability_audit(candidate),
          )
          assert all(row.get("passed") is True for row in audits)
          print("CX01 candidate-002 source-only contracts: PASS")
          PY
