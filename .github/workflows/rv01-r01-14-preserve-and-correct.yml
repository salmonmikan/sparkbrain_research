name: RV01 R01-14 Preserve Fixed Raw And Correct Reporting

on:
  push:
    branches:
      - "research/rv01-r01-14-traversal-dynamics"

permissions:
  actions: read
  contents: write

jobs:
  preserve-correct:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    env:
      ARTIFACT_ID: "10087415924"
      EXPECTED_ZIP_SHA256: "fb9e4f6ee01bb41ca0a733480683fafdf3f1d5d1b7e1d141681d241191d50bdd"
      EXPECTED_RESULT_SHA256: "4a214059cacc66d473776de7b46455c959ce0ac5c7089c6acfafbc9e0ef91e25"
      TARGET: artifacts/research/rv01/r01_14/development_result.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve fixed artifact and apply review-only corrections
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e "${TARGET}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/r01-14.zip
          echo "${EXPECTED_ZIP_SHA256}  /tmp/r01-14.zip" | sha256sum -c -
          mkdir -p /tmp/r01-14
          unzip -q /tmp/r01-14.zip -d /tmp/r01-14
          result="$(find /tmp/r01-14 -type f -name development_result.json -print -quit)"
          test -n "${result}"
          echo "${EXPECTED_RESULT_SHA256}  ${result}" | sha256sum -c -
          mkdir -p "$(dirname "${TARGET}")"
          cp "${result}" "${TARGET}"

          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("src/sparkbrain/research/rv01/traversal_dynamics.py")
          text = source.read_text(encoding="utf-8")
          old = '''    observed_area = sum(cumulative_distinct)\n    ideal_area = (\n        distinct * (distinct + 1) / 2\n        + distinct * (events - distinct)\n    )\n    normalized_auc = observed_area / ideal_area if ideal_area else 0.0\n'''
          new = '''    observed_area = sum(cumulative_distinct)\n    # Registered R01-14 definition: mean cumulative distinct fraction,\n    # normalized by the trace's final distinct count.\n    registered_area = events * distinct\n    normalized_auc = observed_area / registered_area if registered_area else 0.0\n'''
          if old not in text:
              raise SystemExit("expected traversal AUC implementation block not found")
          source.write_text(text.replace(old, new, 1), encoding="utf-8")

          manifest_path = Path("artifacts/research/rv01/r01_14/development_result_manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest.update(
              {
                  "execution_python_implementation": "CPython",
                  "execution_python_version": "3.11.15",
                  "portable_reexecution_claim": False,
                  "retained_raw_result_path": "artifacts/research/rv01/r01_14/development_result.json",
                  "normalized_discovery_auc_status": "historical-v1-invalid-unregistered-denominator",
              }
          )
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          result_doc = Path("docs/research/RV01_R01_14A_DEVELOPMENT_RESULT.md")
          result_text = result_doc.read_text(encoding="utf-8")
          marker = "## 2026-09-11 independent-review correction"
          if marker not in result_text:
              result_text += f'''\n\n{marker}\n\nThe fixed development raw artifact is preserved unchanged. Independent review found that the historical `normalized_discovery_auc` implementation used an ideal-discovery-curve denominator rather than the preregistered `events * final_distinct_count` denominator. Therefore every discovery-AUC value in the fixed R01-14A artifact is **invalid for the registered endpoint and must not be used as scientific evidence**. The implementation is corrected prospectively only; the historical raw JSON and suite hash are not rewritten and this candidate is not rerun.\n\nThe non-AUC observations based directly on event counts, distinct counts, revisit counts/rates, ordered retention, exact-route recovery and contamination remain descriptive fixed evidence subject to their existing development-only boundary. The development conclusion that interference specificity was not supported remains a retained negative result. Held-out R01-14 capability remains closed.\n\nThe fixed artifact is bound to CPython 3.11.15 and does not claim portable hash reproduction on other interpreters.\n'''
              result_doc.write_text(result_text, encoding="utf-8")

          ledger = Path("docs/RESULTS_LEDGER.md")
          ledger_text = ledger.read_text(encoding="utf-8")
          if "RV01 R01-14A traversal-dynamics development diagnosis" not in ledger_text:
              ledger_text += '''\n\n## 2026-09-11 — RV01 R01-14A traversal-dynamics development diagnosis\n\n- Status: development `completed`; interference-specific traversal hypothesis `not_supported`; held-out `not_executed`.\n- Fixed evidence: source `d0c828dda9faf1ff0d455adf02be4e9ef65030fb`; workflow `34308089316`; raw SHA-256 `4a214059cacc66d473776de7b46455c959ce0ac5c7089c6acfafbc9e0ef91e25`; retained locally at `artifacts/research/rv01/r01_14/development_result.json`.\n- Negative result: the equal-breadth traversal/event advantage was not interference-specific; the strongest signature also appeared in the disjoint reference family, so the registered interference-specific hypothesis is rejected at development.\n- Metric correction: the historical `normalized_discovery_auc` used an unregistered denominator and is invalid for the registered AUC endpoint. The raw artifact is preserved unchanged and is not rerun or rescored; future code uses the registered `events * final_distinct_count` denominator.\n- Boundary: event/revisit/distinct-count observations remain development-only descriptive evidence. No R01-14 held-out capability was executed, and no formal/frozen evidence is modified.\n'''
              ledger.write_text(ledger_text, encoding="utf-8")
          PY

          cat > docs/research/RV01_R01_14A_FIXED_EVIDENCE_ADDENDUM_20260911.md <<'EOF'
          # RV01 R01-14A fixed-evidence addendum — 2026-09-11

          Status: **APPEND_ONLY_PRESERVATION / REGISTERED-AUC INVALID / NO RERUN**

          The original development artifact is retained byte-for-byte from workflow run `34308089316` at `artifacts/research/rv01/r01_14/development_result.json` with SHA-256 `4a214059cacc66d473776de7b46455c959ce0ac5c7089c6acfafbc9e0ef91e25`. The artifact ZIP hash remains `fb9e4f6ee01bb41ca0a733480683fafdf3f1d5d1b7e1d141681d241191d50bdd`. No science was rerun while preserving it.

          Independent review found a preregistration mismatch in the historical `normalized_discovery_auc`: the implementation divided cumulative discovery by the ideal discovery curve, while the registered endpoint divides the mean cumulative distinct count by final distinct count, equivalently `sum(cumulative_distinct) / (events * final_distinct_count)`. Historical AUC values are therefore not accepted evidence for that registered endpoint. The code is corrected prospectively, but the fixed artifact is not regenerated.

          The fixed evidence is runtime-bound to CPython 3.11.15 and makes no byte/semantic-hash portability claim across other supported interpreters.

          The retained negative conclusion does not depend on the invalid AUC field: the traversal/event signature was not interference-specific and was strongest in the disjoint reference family. Held-out R01-14 capability remains closed and unexecuted.
          EOF
          sed -i 's/^          //' docs/research/RV01_R01_14A_FIXED_EVIDENCE_ADDENDUM_20260911.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "${TARGET}" \
            src/sparkbrain/research/rv01/traversal_dynamics.py \
            artifacts/research/rv01/r01_14/development_result_manifest.json \
            docs/research/RV01_R01_14A_DEVELOPMENT_RESULT.md \
            docs/research/RV01_R01_14A_FIXED_EVIDENCE_ADDENDUM_20260911.md \
            docs/RESULTS_LEDGER.md
          git commit -m "fix(rv01): preserve R01-14 raw and invalidate unregistered AUC"
          git push origin HEAD:research/rv01-r01-14-traversal-dynamics
