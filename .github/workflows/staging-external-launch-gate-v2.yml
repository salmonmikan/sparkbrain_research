name: staging-external-launch-gate-v2

on:
  push:
    branches: ["v06-capability-staging-20260830"]
    paths:
      - ".github/workflows/staging-external-launch-gate-v2.yml"
      - "src/sparkbrain/evaluation/v06_confirmatory_candidate_manifest.py"
      - "src/sparkbrain/evaluation/v06_confirmatory_external_control_package_v2.py"
      - "src/sparkbrain/evaluation/v06_confirmatory_external_launch_gate_v2.py"
      - "src/sparkbrain/evaluation/v06_confirmatory_freeze_bundle_v2.py"
      - "tests/v06/test_confirmatory_external_launch_gate_v2.py"

permissions:
  contents: read

jobs:
  launch-gate:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint detached launch gate
        run: >-
          python -m ruff check
          src/sparkbrain/evaluation/v06_confirmatory_external_control_package_v2.py
          src/sparkbrain/evaluation/v06_confirmatory_external_launch_gate_v2.py
          tests/v06/test_confirmatory_external_launch_gate_v2.py
      - name: Test exact detached launch gate and one-way claim
        run: python -m pytest -q tests/v06/test_confirmatory_external_launch_gate_v2.py

# Synthetic approved bundle only. Candidate-002 is never imported or executed.
