name: staging-comparator-isolation-fix

on:
  push:
    branches: ["v06-capability-staging-20260830"]
    paths: [".github/workflows/staging-comparator-isolation-fix.yml"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v06-capability-staging-20260830
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Remove Primary-runtime utility import from comparators
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/sparkbrain/evaluation/v06_confirmatory_heldout_comparators.py")
          source = path.read_text(encoding="utf-8")
          if "from sparkbrain.v06.foundation import digest\n" not in source:
              raise SystemExit("expected Primary-runtime digest import was not found")
          source = source.replace("import json\n", "import hashlib\nimport json\n", 1)
          source = source.replace("from sparkbrain.v06.foundation import digest\n", "")
          source = source.replace("digest(", "_digest(")
          anchor = "\n\ndef _unit(unit_id: int) -> str:\n"
          helper = '''

          def _digest(value: object) -> str:
              encoded = json.dumps(
                  value,
                  allow_nan=False,
                  ensure_ascii=False,
                  separators=(",", ":"),
                  sort_keys=True,
              ).encode("utf-8")
              return hashlib.sha256(encoded).hexdigest()
          '''
          if source.count(anchor) != 1:
              raise SystemExit("unexpected comparator helper anchor")
          source = source.replace(anchor, helper + anchor)
          path.write_text(source, encoding="utf-8")
          PY
      - name: Format and verify
        run: |
          python -m pip install "ruff>=0.9"
          python -m ruff check --fix src/sparkbrain/evaluation/v06_confirmatory_heldout_comparators.py
      - name: Commit isolation patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sparkbrain/evaluation/v06_confirmatory_heldout_comparators.py
          git commit -m "fix(v06): isolate comparators from Primary runtime utilities"
          git push origin HEAD:v06-capability-staging-20260830
