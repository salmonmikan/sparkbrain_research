name: staging-external-pipeline-static

on:
  push:
    branches: ["v06-capability-staging-20260830"]
    paths:
      - ".github/workflows/staging-external-pipeline-static.yml"
      - "src/sparkbrain/evaluation/v06_confirmatory_adapter_registry_v2.py"
      - "src/sparkbrain/evaluation/v06_confirmatory_external_launch_gate_v2.py"
      - "src/sparkbrain/evaluation/v06_confirmatory_execute_external_v2.py"
      - "src/sparkbrain/evaluation/v06_confirmatory_verify_external_raw_v2.py"
      - "src/sparkbrain/evaluation/v06_confirmatory_score_external_v2.py"
      - "src/sparkbrain/evaluation/v06_confirmatory_normalized_resource_v2.py"
      - "tests/v06/test_confirmatory_external_pipeline_static.py"

permissions:
  contents: read

jobs:
  static-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint final pipeline sources
        run: >-
          python -m ruff check
          src/sparkbrain/evaluation/v06_confirmatory_adapter_registry_v2.py
          src/sparkbrain/evaluation/v06_confirmatory_external_launch_gate_v2.py
          src/sparkbrain/evaluation/v06_confirmatory_execute_external_v2.py
          src/sparkbrain/evaluation/v06_confirmatory_verify_external_raw_v2.py
          src/sparkbrain/evaluation/v06_confirmatory_score_external_v2.py
          src/sparkbrain/evaluation/v06_confirmatory_normalized_resource_v2.py
          tests/v06/test_confirmatory_external_pipeline_static.py
      - name: Test gate-first and raw-first ordering without execution
        run: python -m pytest -q tests/v06/test_confirmatory_external_pipeline_static.py

# Static source/contract tests only. Candidate-002 is never imported or executed.
