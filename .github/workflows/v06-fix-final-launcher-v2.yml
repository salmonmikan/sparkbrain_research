name: v06-fix-final-launcher-v2

on:
  push:
    branches: ["v06-capability-staging-20260830"]
    paths:
      - ".github/workflows/v06-fix-final-launcher-v2.yml"

permissions:
  contents: write

jobs:
  patch-launcher:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v06-capability-staging-20260830
          fetch-depth: 0
      - name: Patch launcher without touching candidate/model/scoring code
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/v06-candidate-002-final-execution.yml')
          text = path.read_text(encoding='utf-8')
          old_marker = '.github/confirmatory/v06-candidate-002-execute.json'
          new_marker = '.github/confirmatory/v06-candidate-002-execute-v2.json'
          if text.count(old_marker) != 2:
              raise SystemExit(f'unexpected old marker count: {text.count(old_marker)}')
          text = text.replace(old_marker, new_marker)

          runner_expr = '$' + '{{ runner.temp }}'
          replacements = {
              f'{runner_expr}/sparkbrain-v06-build-source': '/tmp/sparkbrain-v06-build-source',
              f'{runner_expr}/sparkbrain-v06-candidate-002': '/tmp/sparkbrain-v06-candidate-002',
              f'{runner_expr}/sparkbrain-v06-candidate-002/final/control': '/tmp/sparkbrain-v06-candidate-002/final/control',
              f'{runner_expr}/sparkbrain-v06-candidate-002/final/raw': '/tmp/sparkbrain-v06-candidate-002/final/raw',
              f'{runner_expr}/sparkbrain-v06-candidate-002/final/analysis': '/tmp/sparkbrain-v06-candidate-002/final/analysis',
              f'{runner_expr}/sparkbrain-v06-candidate-002/reports': '/tmp/sparkbrain-v06-candidate-002/reports',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing launcher expression: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          report = Path('docs/V06_CANDIDATE_002_LAUNCHER_ATTEMPT_001.md')
          report.write_text(
              '# V06 Candidate-002 Launcher Attempt 001\n\n'
              'The first formal launcher run was created from marker commit '
              '`2addb3577539f1af97f0d50470526310d8540575` but GitHub Actions '
              'rejected the workflow before creating any job. `jobs=0`; no candidate '
              'world, capability adapter, raw record, resource measurement, or scorer executed.\n\n'
              'Cause: the workflow used the `runner` context inside `jobs.<job_id>.env`, '
              'where GitHub Actions does not make that context available.\n\n'
              'Recovery is limited to launcher infrastructure: replace those paths with '
              'fixed `/tmp` paths, remove the consumed v1 marker, and issue a fresh v2 marker '
              'against a new source SHA. Candidate generation, worlds, model code, adapters, '
              'thresholds, exclusions, schemas, schedule, resource policy, and scorer are not '
              'changed in response to candidate capability outcomes because no capability '
              'outcome was produced.\n',
              encoding='utf-8',
          )
          PY
          git rm -f .github/confirmatory/v06-candidate-002-execute.json
          git rm -f .github/workflows/v06-fix-final-launcher-v2.yml
      - name: Commit launcher-only recovery source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/v06-candidate-002-final-execution.yml \
                  docs/V06_CANDIDATE_002_LAUNCHER_ATTEMPT_001.md
          git commit -m "fix(v06): repair final launcher before candidate execution"
          git push origin HEAD:v06-capability-staging-20260830
