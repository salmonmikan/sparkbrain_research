name: CX01 Candidate-002 Source Stabilization Once

on:
  push:
    branches:
      - "research/cx01-candidate-002-prestart"

permissions:
  contents: write

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/cx01-candidate-002-prestart

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install fixed source
        run: python -m pip install -e ".[dev,learned,spiking]"

      - name: Apply mechanical lint fixes only
        run: |
          ruff check --fix \
            src/sparkbrain/comparison/cx01/formal_revision.py \
            src/sparkbrain/comparison/cx01/structural_components.py \
            src/sparkbrain/comparison/cx01/candidate.py \
            src/sparkbrain/comparison/cx01/prepare.py \
            tests/cx01/test_component_structural_overlap_audit.py \
            tests/cx01/test_prepare_seal.py
          ruff check src/sparkbrain/comparison/cx01 tests/cx01
          git diff --check

      - name: Validate CX01 before marking source stable
        run: pytest -q tests/cx01

      - name: Remove temporary patch workflows and mark source stable
        run: |
          rm -f .github/workflows/cx01-package-audit-shape-fix-once.yml
          rm -f .github/workflows/cx01-source-stabilize-once.yml
          cat > .cx01_candidate_002_source_stabilized <<'EOF'
          candidate_id=cx01-candidate-002
          seed_band=370110..370119
          comparator_outcomes_observed=false
          execution_seal_issued=false
          formal_started=false
          EOF
          git diff --check

      - name: Commit the exact stabilized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(cx01): stabilize candidate-002 pre-start source"
          git push origin HEAD:research/cx01-candidate-002-prestart
