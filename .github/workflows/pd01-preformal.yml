name: pd01-preformal

on:
  push:
    branches:
      - research/pd01-fading-memory-preformal-20260918
  pull_request:
    paths:
      - "research/pd01/**"
      - "src/sparkbrain/external_validation/fading_memory.py"
      - "scripts/check_pd01_preformal.py"
      - "tests/test_pd01_fading_memory_preformal.py"
      - ".github/workflows/pd01-preformal.yml"

jobs:
  preformal:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install local dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint pre-formal package
        run: >-
          python -m ruff check
          src/sparkbrain/external_validation/fading_memory.py
          scripts/check_pd01_preformal.py
          tests/test_pd01_fading_memory_preformal.py
      - name: Verify fail-closed pre-formal contract
        run: python scripts/check_pd01_preformal.py
      - name: Run synthetic-only pre-formal tests
        run: python -m pytest -q tests/test_pd01_fading_memory_preformal.py
