name: RV02 RD003 Frozen Development Execution

on:
  push:
    branches:
      - "ops/rv02-rd003-development-execution-20260911"

permissions:
  contents: read

env:
  FROZEN_SOURCE_SHA: 79a949568b2a9a8ee18c40e9b356c564422c0127
  OUTPUT_DIR: artifacts/research/rv02/rd003/development-run

jobs:
  execute-development-once:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact frozen development source
        uses: actions/checkout@v4
        with:
          ref: 79a949568b2a9a8ee18c40e9b356c564422c0127
          fetch-depth: 0

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${FROZEN_SOURCE_SHA}"
          test "$(git rev-parse origin/freeze/rv02-rd003-development-source)" = "${FROZEN_SOURCE_SHA}"
          test -f docs/research/RV02_RD003_ONLINE_HIDDEN_ELIGIBILITY_PREREG.md
          test -f scripts/run_rv02_rd003_online.py

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip

      - name: Install frozen package
        run: python -m pip install -e .

      - name: Execute fixed exposed-development matrix
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "${OUTPUT_DIR}"
          python scripts/run_rv02_rd003_online.py --output "${OUTPUT_DIR}"

      - name: Verify preserved bundle independently
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_rv02_rd003_online.py --verify "${OUTPUT_DIR}"

      - name: Record execution metadata and hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rv02-rd003-metadata
          cat > /tmp/rv02-rd003-metadata/execution_metadata.json <<EOF
          {
            "protocol": "rv02-rd003-online-hidden-eligibility-v1",
            "phase": "development",
            "frozen_source_git_sha": "${FROZEN_SOURCE_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "python_version": "$(python --version 2>&1)",
            "formal_execution_allowed": false,
            "held_out_capability_executed": false
          }
          EOF
          if [ -d "${OUTPUT_DIR}" ]; then
            find "${OUTPUT_DIR}" -maxdepth 1 -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > /tmp/rv02-rd003-metadata/output_sha256.txt
          fi

      - name: Upload raw development evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rv02-rd003-development-${{ github.run_id }}
          path: |
            artifacts/research/rv02/rd003/development-run
            /tmp/rv02-rd003-metadata
          if-no-files-found: error
          retention-days: 90
