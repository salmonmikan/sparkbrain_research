name: A01 Mechanism Discrimination

on:
  push:
    branches:
      - "research/v061-a01-mechanism-discrimination"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discriminate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev,learned,spiking]"

      - name: Static checks
        run: |
          ruff check src/sparkbrain/v061_a01/mechanism_discrimination.py
          ruff check scripts/run_v061_a01_mechanism_discrimination.py
          ruff check tests/v06/test_a01_mechanism_discrimination.py

      - name: Execute bound discriminator tests
        run: pytest -q tests/v06/test_a01_mechanism_discrimination.py

      - name: Generate immutable raw result candidate
        run: |
          mkdir -p artifacts/v061/a01
          python scripts/run_v061_a01_mechanism_discrimination.py \
            --source-sha "${GITHUB_SHA}" \
            --output artifacts/v061/a01/A01_MD_001.json \
            | tee artifacts/v061/a01/A01_MD_001.stdout.json
          sha256sum artifacts/v061/a01/A01_MD_001.json \
            | tee artifacts/v061/a01/A01_MD_001.sha256

      - name: Upload raw discrimination artifact
        uses: actions/upload-artifact@v4
        with:
          name: a01-md-001-${{ github.sha }}
          path: |
            artifacts/v061/a01/A01_MD_001.json
            artifacts/v061/a01/A01_MD_001.stdout.json
            artifacts/v061/a01/A01_MD_001.sha256
          if-no-files-found: error
          retention-days: 90
