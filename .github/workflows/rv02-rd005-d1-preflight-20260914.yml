name: RV02 RD005 exact D1 preflight preparation

on:
  push:
    branches:
      - ops/rv02-rd005-d1-preflight-20260914
    paths:
      - .github/workflows/rv02-rd005-d1-preflight-20260914.yml

permissions:
  contents: write

jobs:
  prepare-exact-input:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: c60b7fd8d3889ee969f505d921e7d31c990871e6
      PREFLIGHT_BRANCH: control/rv02-rd005-d1-preflight-c60b7fd8-20260914
      PREFLIGHT_ROOT: artifacts/research/rv02/rd005/preflight-c60b7fd8-20260914

    steps:
      - name: Checkout exact settled RD005 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up prospectively bound Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          cache: pip

      - name: Install package and test tooling
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Verify exact source and bound runtime before preparation
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git status --porcelain --untracked-files=no)" = ""
          python - <<'PY'
          from sparkbrain.research.rv02_rd005_execution_binding import verify_rd005_d1_runtime
          observed = verify_rd005_d1_runtime()
          print(observed)
          PY

      - name: Run complete RD005 fast test surface on the exact source
        run: |
          set -euo pipefail
          python -m pytest tests/test_rv02_rd005_*.py

      - name: Build exact source manifest and exact construction input
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          rm -f /tmp/rd005-source-manifest.json /tmp/rd005-source-manifest.sha256
          rm -f /tmp/rd005-construction-input.json /tmp/rd005-identities.json /tmp/rd005-final-preflight-review.md
          python scripts/build_rv02_rd005_source_manifest.py \
            --repo-root . \
            --output /tmp/rd005-source-manifest.json \
            --digest-output /tmp/rd005-source-manifest.sha256
          python -m sparkbrain.research.rv02_rd005_construction_input \
            --repo-root . \
            --source-manifest /tmp/rd005-source-manifest.json \
            --output /tmp/rd005-construction-input.json \
            > /tmp/rd005-construction-input.sha256

      - name: Re-verify exact package identity and record outcome-blind preflight identities
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from sparkbrain.research.rv02_rd005_bound_construction import verify_package_plan_binding
          from sparkbrain.research.rv02_rd005_construction_input import load_source_manifest
          from sparkbrain.research.rv02_rd005_execution_binding import RD005_D1_EXECUTION_BINDING
          from sparkbrain.research.rv02_rd005_retained_registry import build_authoritative_rd005_collision_registry
          from sparkbrain.research.rv02_rd005_source_binding import verify_rd005_source_checkout

          source_sha = os.environ['SOURCE_SHA']
          manifest_path = Path('/tmp/rd005-source-manifest.json')
          input_path = Path('/tmp/rd005-construction-input.json')
          manifest = load_source_manifest(manifest_path)
          if manifest.source_git_sha != source_sha:
              raise RuntimeError('source manifest does not bind SOURCE_SHA')
          verify_rd005_source_checkout(Path('.'), manifest)
          registry = build_authoritative_rd005_collision_registry(Path('.'))
          raw = input_path.read_bytes()
          package_plan_sha256 = verify_package_plan_binding(raw)
          input_sha256 = hashlib.sha256(raw).hexdigest()
          payload = json.loads(raw)
          expected_output = Path('artifacts/rv02/rd005/development') / f'construction-{input_sha256}'
          if expected_output.exists():
              raise RuntimeError(f'RD005 exact D1 output identity already exists: {expected_output}')

          identities = {
              'source_git_sha': source_sha,
              'source_manifest_sha256': manifest.manifest_sha256,
              'construction_input_sha256': input_sha256,
              'collision_registry_sha256': registry.registry_sha256,
              'package_plan_sha256': package_plan_sha256,
              'execution_binding_sha256': RD005_D1_EXECUTION_BINDING.binding_sha256,
              'expected_output_relpath': expected_output.as_posix(),
              'python_implementation': RD005_D1_EXECUTION_BINDING.python_implementation,
              'python_version': RD005_D1_EXECUTION_BINDING.python_version,
              'command_argv_template': list(RD005_D1_EXECUTION_BINDING.command_argv_template),
              'fresh_seed': 92505,
              'capability_output_opened': False,
              'd1_started': False,
              'human_review': 'HUMAN_REVIEW_WAIVED_BY_USER_2026-09-11',
              'execution_authorization': 'GLOBAL_EXPERIMENT_FORMAL_EXECUTION_PREAUTHORIZATION_2026-09-13',
          }
          Path('/tmp/rd005-identities.json').write_text(
              json.dumps(identities, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          Path('/tmp/rd005-final-preflight-review.md').write_text(
              '# RV02 RD005 exact D1 preflight review\n\n'
              'Date: 2026-09-14  \n'
              'Status: **EXACT PRE-D1 IDENTITIES VERIFIED; D1 NOT STARTED; CAPABILITY UNOPENED**  \n'
              'Human review: `HUMAN_REVIEW_WAIVED_BY_USER_2026-09-11`; no independent human identity is claimed.  \n'
              'Execution authorization: `GLOBAL_EXPERIMENT_FORMAL_EXECUTION_PREAUTHORIZATION_2026-09-13`.\n\n'
              '## Exact identities\n\n'
              f'- source Git SHA: `{source_sha}`\n'
              f'- source manifest SHA-256: `{manifest.manifest_sha256}`\n'
              f'- construction input SHA-256: `{input_sha256}`\n'
              f'- collision registry SHA-256: `{registry.registry_sha256}`\n'
              f'- package plan SHA-256: `{package_plan_sha256}`\n'
              f'- execution binding SHA-256: `{RD005_D1_EXECUTION_BINDING.binding_sha256}`\n'
              f'- expected fresh output: `{expected_output.as_posix()}`\n'
              '- bound runtime: `CPython 3.11.15`\n'
              '- bound command: `python -m sparkbrain.research.rv02_rd005_bound_construction --input {construction_input_path} --repo-root {repo_root}`\n\n'
              '## Review findings\n\n'
              '- exact clean source checkout verification passed before input preparation;\n'
              '- the authoritative retained identity registry reconstructed successfully and excludes prospective seed `92505`;\n'
              '- the exact construction input deterministically binds source manifest, collision registry, canonical package plan, and execution binding;\n'
              '- the complete `tests/test_rv02_rd005_*.py` fast surface passed under the prospectively bound runtime;\n'
              '- the expected construction output identity does not exist and no-clobber semantics remain active;\n'
              '- this preparation does not instantiate D1, create STARTED, open capability output, score any result, or consume the D1 identity.\n\n'
              '## Decision\n\n'
              '**SUITABLE FOR NON-MOVING SOURCE FREEZE AND AN INTEGRITY-GATED EXACTLY-ONCE D1 CONSTRUCTION LAUNCH.**\n'
              'The launch must revalidate these exact identities and must preserve either success or terminal failure without retrying the same input identity.\n',
              encoding='utf-8',
          )
          PY

      - name: Ensure the durable preflight branch does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/preflight-ref.json --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/git/ref/heads/${PREFLIGHT_BRANCH}")"
          if [ "${status}" != '404' ]; then
            cat /tmp/preflight-ref.json
            echo "preflight branch already exists; refusing to overwrite exact preparation evidence" >&2
            exit 1
          fi

      - name: Persist exact preflight artifacts on a separate non-source branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create "${PREFLIGHT_BRANCH}"
          mkdir -p "${PREFLIGHT_ROOT}"
          cp /tmp/rd005-source-manifest.json "${PREFLIGHT_ROOT}/source_manifest.json"
          cp /tmp/rd005-construction-input.json "${PREFLIGHT_ROOT}/construction_input.json"
          cp /tmp/rd005-identities.json "${PREFLIGHT_ROOT}/identities.json"
          cp /tmp/rd005-final-preflight-review.md "${PREFLIGHT_ROOT}/FINAL_PREFLIGHT_REVIEW.md"
          git add "${PREFLIGHT_ROOT}"
          git commit -m 'control(rv02): preserve exact RD005 D1 preflight identities'
          git push origin "HEAD:refs/heads/${PREFLIGHT_BRANCH}"
