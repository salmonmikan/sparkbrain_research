name: A01 MD-001 Ledger Sync

on:
  push:
    branches:
      - "research/v061-a01-md-001-report"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append audited MD-001 disposition without executing capability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/RESULTS_LEDGER.md")
          text = path.read_text(encoding="utf-8")
          marker = "A01-MD-001 independent post-run audit"
          if marker not in text:
              text += '''\n\n## 2026-09-11 — A01-MD-001 independent post-run audit\n\n- Status: fixed development evidence `preserved`; full registered P1-P5 completion `not_established`.\n- Evidence: executed source `e5882c060bf3029415d49c22d9130d59ecbadd00`; raw SHA-256 `361cc46b60ad9f09be7d71e69ecaabd82e9dada828dc64da46772c110e9f18f6`. Historical emitted verdict labels remain immutable.\n- Blocking review findings: P2 did not execute the registered world-relation-only intervention; P3 lacked an independently executed third R-only transplant arm; P4 did not exercise measured continuing merged BoundaryEvent ancestry; P5 omitted the required recurrent N3 comparison and independently measured dynamic/resource equivalence.\n- Retained narrow observations: exact-parent provenance routing in the supplied component harness, contradiction correction of path-local support, no positive support leakage in supplied absence/replay cases, L-local transfer of the support bias, and N1 reproduction of those component outputs.\n- Claim boundary: no Field-emergence claim is supported, but the audit also does not establish that the A01 mechanism is false. Corrective work must use the new A01-MD-002 identity; MD-001 must not be rerun, rescored, tuned, or silently repaired.\n'''
              path.write_text(text, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RESULTS_LEDGER.md
          if git diff --cached --quiet; then
            echo "ledger already synchronized"
            exit 0
          fi
          git commit -m "docs(a01): append audited MD-001 disposition to results ledger"
          git push origin HEAD:research/v061-a01-md-001-report
