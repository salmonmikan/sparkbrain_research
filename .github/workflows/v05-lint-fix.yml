name: fix-v04-lint-for-v05

on:
  push:
    branches: [v05]
    paths:
      - .github/workflows/v05-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v05
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install "ruff>=0.9"

      - name: Apply mechanical lint fixes
        run: |
          python -m ruff check --fix --unsafe-fixes src/sparkbrain/v04 tests/v04
          python -m ruff format src/sparkbrain/v04 tests/v04
          python -m ruff check .

      - name: Commit cleanup
        run: |
          rm -f .github/workflows/v05-lint-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(v04): satisfy current Ruff contract"
          git push origin HEAD:v05
