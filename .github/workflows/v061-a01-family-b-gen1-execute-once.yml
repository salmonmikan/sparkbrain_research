name: V061 A01 Family-B Generation-1 Execute Once

on:
  push:
    branches:
      - "control/a01-family-b-gen1-started-20260916"

concurrency:
  group: v061-a01-family-b-gen1-one-shot
  cancel-in-progress: false

permissions:
  contents: write

env:
  FREEZE_TAG: freeze/a01-family-b-gen1-source-20260916
  CONTROL_REF: control/a01-family-b-gen1-started-20260916
  OWNER_REF: control/a01-family-b-gen1-owner-20260916
  ACQUIRE_REF: control/a01-family-b-gen1-acquire-20260916
  RECOVERY_REF: preserve/a01-family-b-gen1-recovery-20260916
  RAW_TAG: evidence/a01-family-b-gen1-raw-20260916
  SCORED_TAG: evidence/a01-family-b-gen1-scored-20260916
  TERMINAL_TAG: evidence/a01-family-b-gen1-terminal-failure-20260916
  OUTPUT_ROOT: artifacts/v061/a01/family-b-gen1
  RAW_PATH: artifacts/v061/a01/family-b-gen1/raw.json
  SCORE_PATH: artifacts/v061/a01/family-b-gen1/scored.json

jobs:
  execute-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact STARTED source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify immutable source admission boundary and claim owner
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "${GITHUB_REF}" = "refs/heads/${CONTROL_REF}"
          git fetch origin \
            "+refs/tags/${FREEZE_TAG}:refs/tags/${FREEZE_TAG}" \
            "+refs/heads/${CONTROL_REF}:refs/remotes/origin/${CONTROL_REF}"
          frozen_sha="$(git rev-list -n1 "refs/tags/${FREEZE_TAG}")"
          control_sha="$(git rev-parse "refs/remotes/origin/${CONTROL_REF}")"
          test "${GITHUB_SHA}" = "${frozen_sha}"
          test "${GITHUB_SHA}" = "${control_sha}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

          for ref in "${OWNER_REF}" "${ACQUIRE_REF}" "${RECOVERY_REF}"; do
            if git ls-remote --exit-code --heads origin "${ref}" >/dev/null 2>&1; then
              echo "refusing consumed Family-B identity: ${ref}" >&2
              exit 1
            fi
          done
          for tag in "${RAW_TAG}" "${SCORED_TAG}" "${TERMINAL_TAG}"; do
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "refusing consumed Family-B identity: ${tag}" >&2
              exit 1
            fi
          done

          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="github-actions[bot]"
          export GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          claim_commit="$(
            printf '%s\n' \
              "STARTED owner claim: a01-family-b-distributed-field-trace-gen1-v1" \
              "source_sha=${GITHUB_SHA}" \
              "workflow_run_id=${GITHUB_RUN_ID}" \
              "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}" |
              git commit-tree "$(git rev-parse "${GITHUB_SHA}^{tree}")" -p "${GITHUB_SHA}"
          )"
          git push origin "${claim_commit}:refs/heads/${OWNER_REF}"
          printf '%s\n' "${claim_commit}" > "${RUNNER_TEMP}/family-b-owner-claim"

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Verify runtime and install exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(python --version)" = "Python 3.11.16"
          python - <<'PY'
          import json
          from pathlib import Path
          runtime = json.loads(Path("research/v061_a01/family_b_gen1_runtime.json").read_text())
          assert runtime == {
              "candidate_id": "a01-family-b-distributed-field-trace-gen1-v1",
              "development_only": True,
              "execution_admission_required": True,
              "formal_execution_allowed": False,
              "held_out_execution_allowed": False,
              "package_install": "python -m pip install --no-deps -e .",
              "python_version": "3.11.16",
              "runner_label": "ubuntu-24.04",
              "runtime_third_party_dependencies": [],
              "same_identity_rerun_allowed": False,
              "schema": "v061-a01-family-b-gen1-runtime-v1",
          }
          PY
          python -m pip install --no-deps -e .

      - name: Bind exact manifest before acquisition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_ROOT}/_execution_metadata"
          python scripts/run_v061_a01_family_b_gen1.py manifest \
            --source-sha "${GITHUB_SHA}" \
            --output "${OUTPUT_ROOT}/candidate_manifest.json"
          cp research/v061_a01/family_b_gen1_runtime.json "${OUTPUT_ROOT}/runtime_contract.json"
          python --version > "${OUTPUT_ROOT}/_execution_metadata/python_version.txt" 2>&1
          git rev-parse HEAD > "${OUTPUT_ROOT}/_execution_metadata/source_sha.txt"

      - name: Acquire scientific raw evidence exactly once
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_v061_a01_family_b_gen1.py acquire \
            --source-sha "${GITHUB_SHA}" \
            --output "${RAW_PATH}"
          git fetch origin "+refs/heads/${ACQUIRE_REF}:refs/remotes/origin/${ACQUIRE_REF}"
          acquire_claim="$(git rev-parse "refs/remotes/origin/${ACQUIRE_REF}")"
          printf '%s\n' "${acquire_claim}" > "${RUNNER_TEMP}/family-b-acquire-claim"
          cd "${OUTPUT_ROOT}"
          sha256sum raw.json > raw.sha256
          sha256sum -c raw.sha256
          cd "${GITHUB_WORKSPACE}"

      - name: Preserve raw before any scoring read
        shell: bash
        run: |
          set -euo pipefail
          owner_claim="$(cat "${RUNNER_TEMP}/family-b-owner-claim")"
          acquire_claim="$(cat "${RUNNER_TEMP}/family-b-acquire-claim")"
          cat > "${OUTPUT_ROOT}/_execution_metadata/execution_metadata.json" <<EOF
          {
            "candidate_id": "a01-family-b-distributed-field-trace-gen1-v1",
            "stage": "raw-preserved-before-score",
            "frozen_source_git_sha": "${GITHUB_SHA}",
            "freeze_tag": "${FREEZE_TAG}",
            "control_ref": "${CONTROL_REF}",
            "execution_owner_ref": "${OWNER_REF}",
            "execution_owner_claim_commit": "${owner_claim}",
            "acquisition_ref": "${ACQUIRE_REF}",
            "acquisition_claim_commit": "${acquire_claim}",
            "recovery_ref": "${RECOVERY_REF}",
            "raw_evidence_tag": "${RAW_TAG}",
            "scored_evidence_tag": "${SCORED_TAG}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "python_version": "$(python --version 2>&1)",
            "same_identity_rerun_allowed": false
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${OUTPUT_ROOT}"
          git commit -m "Preserve A01 Family-B Gen1 raw evidence ${GITHUB_RUN_ID}"
          raw_commit="$(git rev-parse HEAD)"
          printf '%s\n' "${raw_commit}" > "${RUNNER_TEMP}/family-b-raw-commit"
          git push origin "${raw_commit}:refs/heads/${RECOVERY_REF}"
          git tag -a "${RAW_TAG}" "${raw_commit}" -m "A01 Family-B Gen1 raw evidence run ${GITHUB_RUN_ID}"
          git push origin "refs/tags/${RAW_TAG}"

      - name: Independently verify preserved raw bundle
        shell: bash
        run: |
          set -euo pipefail
          owner_claim="$(cat "${RUNNER_TEMP}/family-b-owner-claim")"
          acquire_claim="$(cat "${RUNNER_TEMP}/family-b-acquire-claim")"
          git fetch origin "+refs/tags/${RAW_TAG}:refs/tags/${RAW_TAG}"
          raw_commit="$(git rev-list -n1 "refs/tags/${RAW_TAG}")"
          test "${raw_commit}" = "$(cat "${RUNNER_TEMP}/family-b-raw-commit")"
          verify_root="${RUNNER_TEMP}/family-b-preserved-raw"
          rm -rf "${verify_root}"
          mkdir -p "${verify_root}"
          git archive "${raw_commit}" "${OUTPUT_ROOT}" | tar -x -C "${verify_root}"
          python scripts/verify_v061_a01_family_b_gen1_artifacts.py \
            --root "${verify_root}/${OUTPUT_ROOT}" \
            --expected-source-sha "${GITHUB_SHA}" \
            --expected-run-id "${GITHUB_RUN_ID}" \
            --expected-owner-claim "${owner_claim}" \
            --expected-acquisition-claim "${acquire_claim}"
          printf '%s\n' "${verify_root}/${RAW_PATH}" > "${RUNNER_TEMP}/family-b-verified-raw-path"

      - name: Score exactly once from independently verified preserved raw evidence
        shell: bash
        run: |
          set -euo pipefail
          verified_raw="$(cat "${RUNNER_TEMP}/family-b-verified-raw-path")"
          test -f "${verified_raw}"
          scored_tmp="${RUNNER_TEMP}/family-b-scored.json"
          python scripts/run_v061_a01_family_b_gen1.py score \
            --source-sha "${GITHUB_SHA}" \
            --raw-input "${verified_raw}" \
            --output "${scored_tmp}"
          sha256sum "${scored_tmp}" > "${RUNNER_TEMP}/family-b-scored.sha256"
          touch "${RUNNER_TEMP}/family-b-score-complete"

      - name: Preserve exact terminal scored artifact without rescoring
        shell: bash
        run: |
          set -euo pipefail
          test -f "${RUNNER_TEMP}/family-b-score-complete"
          raw_commit="$(cat "${RUNNER_TEMP}/family-b-raw-commit")"
          git reset --hard "${raw_commit}"
          mkdir -p "$(dirname "${SCORE_PATH}")"
          cp "${RUNNER_TEMP}/family-b-scored.json" "${SCORE_PATH}"
          cd "${OUTPUT_ROOT}"
          sha256sum scored.json > scored.sha256
          sha256sum -c scored.sha256
          cd "${GITHUB_WORKSPACE}"
          git add -f "${SCORE_PATH}" "${SCORE_PATH%.json}.sha256"
          git commit -m "Preserve A01 Family-B Gen1 scored evidence ${GITHUB_RUN_ID}"
          scored_commit="$(git rev-parse HEAD)"
          git tag -a "${SCORED_TAG}" "${scored_commit}" -m "A01 Family-B Gen1 scored evidence run ${GITHUB_RUN_ID}"
          git push origin "refs/tags/${SCORED_TAG}"

      - name: Preserve auditable terminal failure after STARTED
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "${RUNNER_TEMP}/family-b-owner-claim" ]; then
            echo "STARTED ownership was not acquired; no terminal evidence write"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${SCORED_TAG}" >/dev/null 2>&1; then
            echo "scored terminal result already exists"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TERMINAL_TAG}" >/dev/null 2>&1; then
            echo "terminal failure tag already exists; refusing movement"
            exit 0
          fi

          base="${GITHUB_SHA}"
          if git ls-remote --exit-code --tags origin "refs/tags/${RAW_TAG}" >/dev/null 2>&1; then
            git fetch origin "+refs/tags/${RAW_TAG}:refs/tags/${RAW_TAG}"
            base="$(git rev-list -n1 "refs/tags/${RAW_TAG}")"
          fi
          git reset --hard "${base}"
          mkdir -p "${OUTPUT_ROOT}/_terminal"
          cat > "${OUTPUT_ROOT}/_terminal/POST_START_FAILURE.json" <<EOF
          {
            "schema": "v061-a01-family-b-gen1-post-start-failure-v1",
            "candidate_id": "a01-family-b-distributed-field-trace-gen1-v1",
            "frozen_source_git_sha": "${GITHUB_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "same_identity_rerun_allowed": false
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${OUTPUT_ROOT}/_terminal/POST_START_FAILURE.json"
          git commit -m "Preserve A01 Family-B Gen1 terminal failure ${GITHUB_RUN_ID}"
          terminal_commit="$(git rev-parse HEAD)"
          git tag -a "${TERMINAL_TAG}" "${terminal_commit}" -m "A01 Family-B Gen1 terminal failure run ${GITHUB_RUN_ID}"
          git push origin "refs/tags/${TERMINAL_TAG}"
