name: c19-r2-prestart

on:
  push:
    branches:
      - research/c19-r2-fsa-state-tracker-spec-20260918
  workflow_dispatch:

jobs:
  prestart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
      - name: Install readiness dependencies
        run: python -m pip install -e ".[dev,learned]"
      - name: Lint R2 package
        run: >-
          python -m ruff check
          scripts/check_c19_r2_prestart.py
          scripts/preserve_c19_r2_boundary.py
          scripts/run_c19_r2_official.py
          src/sparkbrain/v03_external_validation/c19_r2_protocol.py
          src/sparkbrain/v03_external_validation/c19_r2_scoring.py
          src/sparkbrain/v03_external_validation/c19_r2_source_map.py
          src/sparkbrain/v03_external_validation/c19_r2_state_tracker.py
          tests/test_c19_r2_state_tracker.py
      - name: Network-blocked production import smoke
        run: |
          python - <<'PY'
          import socket

          class DeniedSocket(socket.socket):
              def connect(self, *args, **kwargs):
                  raise RuntimeError("network use forbidden during R2 pre-START import smoke")

          socket.socket = DeniedSocket
          import sparkbrain.v03_external_validation.c19_r2_protocol  # noqa: F401,E402
          import sparkbrain.v03_external_validation.c19_r2_scoring  # noqa: F401,E402
          import sparkbrain.v03_external_validation.c19_r2_source_map  # noqa: F401,E402
          import sparkbrain.v03_external_validation.c19_r2_state_tracker  # noqa: F401,E402
          import runpy
          runpy.run_path("scripts/run_c19_r2_official.py", run_name="r2_prestart_import")
          PY
      - name: Golden fixtures
        run: python -m pytest -q tests/test_c19_r2_state_tracker.py
      - name: Fail-closed frozen-science and authority contract
        run: python scripts/check_c19_r2_prestart.py
      - name: Authority-bound production execution smoke
        run: |
          python scripts/run_c19_r2_official.py prestart-smoke \
            --analyst-commit 719b9e74063e5e10f6226fd49f1835036ed75e5b \
            --package-commit "$(git rev-parse HEAD)"
      - name: Fresh one-way namespaces
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin 'control/c19-r2-fsa-state-tracker-started-*' >/dev/null 2>&1; then
            echo 'R2 STARTED namespace already exists' >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin 'preserve/c19-r2-fsa-state-tracker-raw-*' >/dev/null 2>&1; then
            echo 'R2 preserve namespace already exists' >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin 'refs/tags/evidence/c19-r2-fsa-state-tracker-*' >/dev/null 2>&1; then
            echo 'R2 evidence namespace already exists' >&2
            exit 1
          fi
