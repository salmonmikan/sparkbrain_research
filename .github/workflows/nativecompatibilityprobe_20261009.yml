name: Prospective ordinary CPython 3.14.8 synthetic probe
on:
  push:
    branches: ['probe/nativecompat-3148-20261009T0949Z']
    paths:
      - 'research/nativecompatibilityprobe_20261009/**'
      - '.github/workflows/nativecompatibilityprobe_20261009.yml'
permissions:
  contents: read
concurrency:
  group: nativecompat-3148-20261009T0949Z
  cancel-in-progress: false
jobs:
  synthetic:
    if: >-
      github.repository == 'salmonmikan/sparkbrain_research' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/probe/nativecompat-3148-20261009T0949Z' &&
      github.event.head_commit.message == 'probe: nativecompat-3148-20261009T0949Z ONE_SHOT SYNTHETIC_ONLY' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: research/nativecompatibilityprobe_20261009
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.8'
          architecture: x64
          check-latest: false
      - name: Bounded synthetic compatibility only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          timeout --signal=KILL 22s python -I -S -B research/nativecompatibilityprobe_20261009/supervise.py
