name: rv01-r01-13-development

on:
  push:
    branches:
      - research/rv01-r01-13-activity-matched-discrimination
    paths:
      - "src/sparkbrain/research/rv01/activity_matched_contract.py"
      - "src/sparkbrain/research/rv01/activity_matched_discrimination.py"
      - "tests/research/rv01/test_activity_matched_discrimination.py"
      - "scripts/run_rv01_r01_13_development.py"
      - "docs/research/RV01_R01_13_ACTIVITY_MATCHED_DISCRIMINATION_PROTOCOL.md"
      - ".github/workflows/rv01-r01-13-development.yml"
  workflow_dispatch:

jobs:
  development-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,learned,spiking]"
      - name: R01-13 targeted tests
        run: python -m pytest -q tests/research/rv01/test_activity_matched_discrimination.py
      - name: R01-13 development execution
        run: >-
          python scripts/run_rv01_r01_13_development.py
          --output artifacts/research/rv01/r01_13/development_result.json
      - name: Assert held-out remains closed
        run: >-
          python -c "import json; p=json.load(open('artifacts/research/rv01/r01_13/development_result.json')); assert p['held_out_capability_executed'] is False"
      - name: Upload R01-13 development result
        uses: actions/upload-artifact@v4
        with:
          name: rv01-r01-13-development-${{ github.sha }}
          path: artifacts/research/rv01/r01_13/development_result.json
          if-no-files-found: error
