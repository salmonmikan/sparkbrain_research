name: v061-d5-d6-autofix

on:
  push:
    branches:
      - v061-candidate-003-failure-diagnostics-work
    paths:
      - ".github/workflows/v061-d5-d6-autofix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v061-candidate-003-failure-diagnostics-work
          fetch-depth: 1
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Normalize D5-D6 sources
        run: |
          python -m pip install "ruff>=0.9"
          python -m ruff check --fix \
            src/sparkbrain/evaluation/v061_failure_locus_diagnostics.py \
            src/sparkbrain/evaluation/v061_comparator_contrast.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/sparkbrain/evaluation/v061_failure_locus_diagnostics.py \
            src/sparkbrain/evaluation/v061_comparator_contrast.py
          git commit -m "style(v061): normalize D5-D6 diagnostic imports [skip ci]"
          git push origin HEAD:v061-candidate-003-failure-diagnostics-work
