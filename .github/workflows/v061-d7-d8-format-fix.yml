name: v061-d7-d8-format-fix

on:
  push:
    branches:
      - v061-candidate-003-failure-diagnostics-work
    paths:
      - .github/workflows/v061-d7-d8-format-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v061-candidate-003-failure-diagnostics-work
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Format and lint D7-D8 files
        run: |
          python -m ruff format \
            src/sparkbrain/evaluation/v061_temporal_functional_decoupling.py \
            src/sparkbrain/evaluation/v061_temporal_functional_discriminators.py \
            tests/v06/test_temporal_functional_decoupling.py \
            tests/v06/test_temporal_functional_discriminators.py \
            scripts/v061_temporal_functional_decoupling_report.py \
            scripts/v061_temporal_functional_discriminator_report.py
          python -m ruff check --fix \
            src/sparkbrain/evaluation/v061_temporal_functional_decoupling.py \
            src/sparkbrain/evaluation/v061_temporal_functional_discriminators.py \
            tests/v06/test_temporal_functional_decoupling.py \
            tests/v06/test_temporal_functional_discriminators.py \
            scripts/v061_temporal_functional_decoupling_report.py \
            scripts/v061_temporal_functional_discriminator_report.py
          python -m ruff check \
            src/sparkbrain/evaluation/v061_temporal_functional_decoupling.py \
            src/sparkbrain/evaluation/v061_temporal_functional_discriminators.py \
            tests/v06/test_temporal_functional_decoupling.py \
            tests/v06/test_temporal_functional_discriminators.py \
            scripts/v061_temporal_functional_decoupling_report.py \
            scripts/v061_temporal_functional_discriminator_report.py

      - name: Verify tests
        run: |
          python -m pytest -q \
            tests/v06/test_temporal_functional_decoupling.py \
            tests/v06/test_temporal_functional_discriminators.py

      - name: Commit normalized sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/sparkbrain/evaluation/v061_temporal_functional_decoupling.py \
            src/sparkbrain/evaluation/v061_temporal_functional_discriminators.py \
            tests/v06/test_temporal_functional_decoupling.py \
            tests/v06/test_temporal_functional_discriminators.py \
            scripts/v061_temporal_functional_decoupling_report.py \
            scripts/v061_temporal_functional_discriminator_report.py
          if git diff --cached --quiet; then
            echo "D7-D8 sources already normalized."
            exit 0
          fi
          git commit -m "style(v061): normalize D7-D8 diagnostics [skip ci]"
          git pull --rebase origin v061-candidate-003-failure-diagnostics-work
          git push origin HEAD:v061-candidate-003-failure-diagnostics-work
