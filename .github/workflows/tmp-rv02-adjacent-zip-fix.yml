name: Temporary RV02 adjacent zip correction

on:
  push:
    branches:
      - "fix/rv02-rd002-ci-20260911"

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rv02-rd002-ci-20260911
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore original adjacent-slice zip semantics explicitly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/sparkbrain/research/rv02_scale.py")
          text = path.read_text(encoding="utf-8")
          old = "zip(route, route[1:], strict=True)"
          new = "zip(route, route[1:], strict=False)"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one target, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -m pip install ruff==0.16.6 pytest
          ruff check src/sparkbrain/research/rv02_scale.py
          python -m pytest -q \
            tests/test_rv02_scale_contract.py \
            tests/test_rv02_recruitment.py
      - name: Commit exact correction
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sparkbrain/research/rv02_scale.py
          git commit -m "fix(rv02): preserve adjacent-route zip semantics"
          git push origin HEAD:fix/rv02-rd002-ci-20260911
