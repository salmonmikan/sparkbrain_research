name: staging-clock-fix-v2

on:
  push:
    branches: ["v06-capability-staging-20260830"]
    paths: [".github/workflows/staging-clock-fix-v2.yml"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v06-capability-staging-20260830
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch nonuniform internal-only clock
        run: >-
          python -c 'from pathlib import Path; p=Path("src/sparkbrain/evaluation/v06_confirmatory_heldout_primary.py"); s=p.read_text(encoding="utf-8"); old="            start_ms=100.0 + episode * parameters.episode_spacings_ms[episode],"; new="            start_ms=100.0\n            + sum(\n                parameters.episode_spacings_ms[\n                    prior % len(parameters.episode_spacings_ms)\n                ]\n                for prior in range(episode)\n            ),"; assert s.count(old) == 1, s.count(old); p.write_text(s.replace(old, new), encoding="utf-8")'
      - name: Format patched source
        run: |
          python -m pip install "ruff>=0.9"
          python -m ruff check --fix src/sparkbrain/evaluation/v06_confirmatory_heldout_primary.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sparkbrain/evaluation/v06_confirmatory_heldout_primary.py
          git commit -m "fix(v06): use cumulative nonuniform episode clocks [skip ci]"
          git push origin HEAD:v06-capability-staging-20260830
