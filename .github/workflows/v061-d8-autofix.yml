name: v061-d8-autofix

on:
  push:
    branches:
      - v061-candidate-003-failure-diagnostics-work
    paths:
      - .github/workflows/v061-d8-autofix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v061-candidate-003-failure-diagnostics-work

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Correct D8 tuple and relation-world construction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "src/sparkbrain/evaluation/v061_field_expression_diagnostics.py"
          )
          source = path.read_text(encoding="utf-8")
          old = '''    transition_conditions = tuple(
              (
          '''
          new = '''    transition_conditions = (
          '''
          if source.count(old) != 1:
              raise SystemExit("unexpected transition tuple opening")
          source = source.replace(old, new)
          old = '''        )
              )[0]
              transition_by_name = {row.condition: row for row in transition_conditions}

              consistency_state = _single_relation_state(world)
              relation_conditions = (
                  _relation_condition(
                      world,
          '''
          new = '''    )
              transition_by_name = {row.condition: row for row in transition_conditions}

              relation_world = next(
                  row
                  for row in lag_factor_worlds()
                  if row.family_id == "diagnostic-lag-narrow-shared"
              )
              consistency_state = _single_relation_state(relation_world)
              relation_conditions = (
                  _relation_condition(
                      relation_world,
          '''
          if source.count(old) != 1:
              raise SystemExit("unexpected transition tuple closing")
          source = source.replace(old, new)
          source = source.replace(
              '''        _relation_condition(
                      world,
                      consistency_state,
                      condition="high-threshold",
                      field_threshold=world.threshold * 1.60,
                  ),
                  _relation_condition(
                      world,
                      consistency_state,
                      condition="refractory-target-primer",
                      field_threshold=world.threshold,
          ''',
              '''        _relation_condition(
                      relation_world,
                      consistency_state,
                      condition="high-threshold",
                      field_threshold=relation_world.threshold * 1.60,
                  ),
                  _relation_condition(
                      relation_world,
                      consistency_state,
                      condition="refractory-target-primer",
                      field_threshold=relation_world.threshold,
          ''',
          )
          source = source.replace(
              '''            relation_by_name["ordinary-field"].endogenous_output_units
                      == (world.old_target,),
          ''',
              '''            relation_by_name["ordinary-field"].endogenous_output_units
                      == (relation_world.old_target,),
          ''',
          )
          source = source.replace(
              '''        "fixed_consistency_state_hash": digest(consistency_state),
              "relation_conditions": [row.state_dict() for row in relation_conditions],
          ''',
              '''        "relation_world": relation_world.state_dict(),
              "fixed_consistency_state_hash": digest(consistency_state),
              "relation_conditions": [row.state_dict() for row in relation_conditions],
          ''',
          )
          path.write_text(source, encoding="utf-8")
          PY

      - name: Apply Ruff
        run: |
          python -m pip install "ruff>=0.9"
          python -m ruff check --fix \
            src/sparkbrain/evaluation/v061_field_expression_diagnostics.py

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sparkbrain/evaluation/v061_field_expression_diagnostics.py
          git commit -m "fix(v061): correct D8 Field-expression construction [skip ci]"
          git push origin HEAD:v061-candidate-003-failure-diagnostics-work
