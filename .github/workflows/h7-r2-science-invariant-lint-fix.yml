name: h7-r2-science-invariant-lint-fix

on:
  push:
    branches:
      - research/main-h7-formal-r2-input-split-r75-cycle8

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install formatter
        run: python -m pip install ruff==0.16.8
      - name: Apply science-invariant lint/format repair
        run: |
          python -m ruff format src/sparkbrain/learned/h7_formal_r2.py src/sparkbrain/learned/h7_formal_r2_runner.py scripts/run_h7_formal_r2.py scripts/build_h7_formal_r2_preidentity_manifests.py
          python -m ruff check --fix src/sparkbrain/learned/h7_formal_r2.py src/sparkbrain/learned/h7_formal_r2_runner.py scripts/run_h7_formal_r2.py scripts/build_h7_formal_r2_preidentity_manifests.py
      - name: Commit only if formatter changed files
        run: |
          if git diff --quiet; then
            echo "No formatter changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sparkbrain/learned/h7_formal_r2.py src/sparkbrain/learned/h7_formal_r2_runner.py scripts/run_h7_formal_r2.py scripts/build_h7_formal_r2_preidentity_manifests.py
          git commit -m "h7 formal r2: science-invariant lint repair"
          git push origin HEAD:research/main-h7-formal-r2-input-split-r75-cycle8
