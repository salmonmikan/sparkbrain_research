name: v061-apply-timing-contract-correction-v2

on:
  push:
    branches:
      - v061-timing-contract-correction-20260831
    paths:
      - .github/workflows/v061-apply-timing-contract-correction-v2.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v061-timing-contract-correction-20260831
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply monotonic boundary timing correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          runtime_path = Path("src/sparkbrain/v06/endogenous_chain.py")
          runtime = runtime_path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"    def advance_silence\(\n.*?(?=    def _arrival_pulse_ids_at\()",
              re.DOTALL,
          )
          replacement = "\n".join(
              (
                  "    def drain_scheduled_events(",
                  "        self,",
                  "        end_ms: float,",
                  "        *,",
                  "        include_endpoint: bool = True,",
                  "    ) -> tuple[EndogenousChainSpark, ...]:",
                  '        """Process scheduled events without forcing time to ``end_ms``.',
                  "",
                  "        An external world may return a consequence before an",
                  "        evaluator observation horizon. The Field clock therefore",
                  "        stops at the last event that actually occurred.",
                  '        """',
                  "",
                  "        if end_ms < self.field.current_time_ms:",
                  '            raise ValueError("end_ms cannot move backwards")',
                  "        before = len(self.generated_sparks)",
                  "        while self.field._queue:  # noqa: SLF001",
                  "            next_time = self.field._queue[0][0]  # noqa: SLF001",
                  "            if next_time > end_ms or (",
                  "                next_time == end_ms and not include_endpoint",
                  "            ):",
                  "                break",
                  "            self._internal_step_count += 1",
                  "            if (",
                  "                self._internal_step_count",
                  "                > self.config.maximum_internal_steps",
                  "            ):",
                  '                raise RuntimeError("maximum_internal_steps exceeded")',
                  "            arrivals = self._arrival_pulse_ids_at(next_time)",
                  "            spikes = self.field.run_until(next_time)",
                  "            self._observe_spikes(spikes, arrivals)",
                  "        self.transition.expire_pending(self.field.current_time_ms)",
                  "        return tuple(self.generated_sparks[before:])",
                  "",
                  "    def advance_silence(",
                  "        self,",
                  "        end_ms: float,",
                  "        *,",
                  "        include_endpoint: bool = True,",
                  "    ) -> tuple[EndogenousChainSpark, ...]:",
                  "        if end_ms < self.field.current_time_ms:",
                  '            raise ValueError("end_ms cannot move backwards")',
                  "        before = len(self.generated_sparks)",
                  "        self.drain_scheduled_events(",
                  "            end_ms,",
                  "            include_endpoint=include_endpoint,",
                  "        )",
                  "        if include_endpoint and self.field.current_time_ms < end_ms:",
                  "            self.field.run_until(end_ms)",
                  "        self.transition.expire_pending(end_ms)",
                  "        return tuple(self.generated_sparks[before:])",
                  "",
                  "",
              )
          )
          runtime, count = pattern.subn(replacement, runtime)
          if count != 1:
              raise SystemExit(f"runtime method boundary matched {count} times")
          runtime_path.write_text(runtime, encoding="utf-8")

          primary_path = Path(
              "src/sparkbrain/evaluation/v06_confirmatory_heldout_primary.py"
          )
          primary = primary_path.read_text(encoding="utf-8")
          signature_old = "    event_id: str,\n) -> _ChainResult:"
          signature_new = (
              "    event_id: str,\n"
              "    settle_to_horizon: bool = True,\n"
              ") -> _ChainResult:"
          )
          if primary.count(signature_old) != 1:
              raise SystemExit("Primary _run_cue signature did not match once")
          primary = primary.replace(signature_old, signature_new)

          advance_old = "    runtime.advance_silence(_horizon(parameters, start_ms))\n"
          advance_new = (
              "    horizon = _horizon(parameters, start_ms)\n"
              "    if settle_to_horizon:\n"
              "        runtime.advance_silence(horizon)\n"
              "    else:\n"
              "        runtime.drain_scheduled_events(horizon)\n"
          )
          if primary.count(advance_old) != 1:
              raise SystemExit("Primary horizon advance did not match once")
          primary = primary.replace(advance_old, advance_new)

          boundary_start = primary.index("def _boundary_episode(")
          boundary_end = primary.index("def _boundary_condition(", boundary_start)
          boundary = primary[boundary_start:boundary_end]
          call_old = "        event_id=event_id,\n    )"
          call_new = (
              "        event_id=event_id,\n"
              "        settle_to_horizon=False,\n"
              "    )"
          )
          if boundary.count(call_old) != 1:
              raise SystemExit("boundary _run_cue call did not match once")
          boundary = boundary.replace(call_old, call_new)
          primary = primary[:boundary_start] + boundary + primary[boundary_end:]
          primary_path.write_text(primary, encoding="utf-8")

          test_path = Path("tests/v06/test_endogenous_chain.py")
          tests = test_path.read_text(encoding="utf-8")
          addition = textwrap.dedent(
              '''

              def test_drain_events_stops_at_last_actual_event() -> None:
                  runtime = build_runtime()
                  runtime.present_external(pulse("drain-cue", 100.0, 0))
                  generated = runtime.drain_scheduled_events(120.0)
                  assert tuple(row.unit_id for row in generated) == (1, 2, 3)
                  assert runtime.field.current_time_ms == 115.0

                  runtime.advance_silence(120.0)
                  assert runtime.field.current_time_ms == 120.0


              def test_external_time_reversal_guard_remains_strict() -> None:
                  import pytest

                  runtime = build_runtime()
                  runtime.present_external(pulse("strict-cue", 100.0, 0))
                  runtime.advance_silence(120.0)
                  with pytest.raises(
                      ValueError,
                      match="cannot move Field time backwards",
                  ):
                      runtime.present_external(pulse("past-cue", 119.0, 0))
              '''
          )
          if "test_drain_events_stops_at_last_actual_event" not in tests:
              test_path.write_text(tests + addition, encoding="utf-8")

          regression_path = Path(
              "tests/v06/test_confirmatory_candidate_002_timing_regression.py"
          )
          regression_path.write_text(
              textwrap.dedent(
                  '''\
                  from __future__ import annotations

                  import math

                  from sparkbrain.evaluation.v06_confirmatory import EvidenceDomain
                  from sparkbrain.evaluation.v06_confirmatory_heldout_primary import (
                      _boundary_condition,
                      run_condition,
                  )
                  from sparkbrain.evaluation.v06_confirmatory_heldout_spec import (
                      WORLD_GENERATION_ID,
                      build_heldout_world_grid,
                      heldout_world_parameters,
                  )


                  def _backward_risk_worlds():
                      return tuple(
                          parameters
                          for parameters in build_heldout_world_grid()
                          if parameters.boundary_lag_ms
                          < max(parameters.evaluation_lags_ms) + 5.0
                      )


                  def test_candidate_002_risk_set_has_22_worlds() -> None:
                      assert WORLD_GENERATION_ID == "v06-confirmatory-candidate-002"
                      risky = _backward_risk_worlds()
                      assert len(risky) == 22
                      assert any(
                          row.family_id == "heldout-sparse-permutation"
                          and row.seed == 1001
                          for row in risky
                      )


                  def test_candidate_002_risk_worlds_finish_monotonically() -> None:
                      for parameters in _backward_risk_worlds():
                          main_count, control_count, external_count, runtime, _ = (
                              _boundary_condition(parameters)
                          )
                          assert main_count in (0, 1)
                          assert control_count in (0, 1)
                          assert external_count in (0, 1)
                          assert math.isfinite(runtime.field.current_time_ms)
                          assert runtime.field.current_time_ms >= 0.0


                  def test_candidate_002_seed_1001_primary_finishes() -> None:
                      parameters = heldout_world_parameters(
                          "heldout-sparse-permutation",
                          1001,
                      )
                      execution = run_condition(parameters)
                      assert len(execution.records) == len(EvidenceDomain) == 9
                      execution.validate()
                  '''
              ),
              encoding="utf-8",
          )
          PY

      - name: Compile patched modules
        run: |
          python -m py_compile \
            src/sparkbrain/v06/endogenous_chain.py \
            src/sparkbrain/evaluation/v06_confirmatory_heldout_primary.py \
            tests/v06/test_endogenous_chain.py \
            tests/v06/test_confirmatory_candidate_002_timing_regression.py

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify focused timing and retired-candidate regressions
        run: |
          python -m ruff check \
            src/sparkbrain/v06/endogenous_chain.py \
            src/sparkbrain/evaluation/v06_confirmatory_heldout_primary.py \
            tests/v06/test_endogenous_chain.py \
            tests/v06/test_confirmatory_candidate_002_timing_regression.py
          python -m pytest -q \
            tests/v06/test_endogenous_chain.py \
            tests/v06/test_confirmatory_candidate_002_timing_regression.py

      - name: Commit verified correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/sparkbrain/v06/endogenous_chain.py \
            src/sparkbrain/evaluation/v06_confirmatory_heldout_primary.py \
            tests/v06/test_endogenous_chain.py \
            tests/v06/test_confirmatory_candidate_002_timing_regression.py
          git commit -m "fix(v061): preserve monotonic time across boundary feedback"
          git push origin HEAD:v061-timing-contract-correction-20260831
