name: v05 bootstrap remaining source
on:
  push:
    branches: [v05]
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, '[v05-bootstrap]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v05
          fetch-depth: 0
      - name: Materialize retained v0.5 source
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, tarfile
          root = Path('.').resolve()
          encoded = ''.join(
              path.read_text(encoding='ascii')
              for path in sorted(Path('.v05-bootstrap').glob('chunk_*.b64'))
          )
          data = base64.b64decode(encoded)
          expected = 'e596fd91a227671b3729e750f51f1d935cc7d0137e3c82226bea65e38a5414c3'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'payload hash mismatch: {actual}')
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              for member in archive.getmembers():
                  target = (root / member.name).resolve()
                  if root not in target.parents and target != root:
                      raise SystemExit(f'unsafe archive member: {member.name}')
              archive.extractall(root)
          PY
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/v04 tests/v05
          python -m compileall -q src tests
      - name: Commit materialized source
        run: |
          rm -rf .v05-bootstrap .github/workflows/v05-bootstrap.yml
          git config user.name "sparkbrain-v05-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(v05): complete functional temporal assembly runtime [skip ci]"
          git push origin HEAD:v05
