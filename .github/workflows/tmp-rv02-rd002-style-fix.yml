name: Temporary RV02 RD002 style fix

on:
  push:
    branches:
      - "fix/rv02-rd002-ci-20260911"

permissions:
  contents: write

jobs:
  style-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rv02-rd002-ci-20260911
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.16.6
      - name: Apply mechanical style fixes only
        shell: bash
        run: |
          files=(
            scripts/audit_rv02_boundary_recruitment.py
            scripts/run_rv02_boundary_recruitment.py
            scripts/run_rv02_development.py
            scripts/run_rv02_recruitment.py
            src/sparkbrain/research/rv02_boundary_recruitment.py
            src/sparkbrain/research/rv02_scale.py
            tests/test_rv02_boundary_raw_audit.py
            tests/test_rv02_boundary_recruitment.py
            tests/test_rv02_bundle_verifier.py
            tests/test_rv02_scale_contract.py
          )
          ruff check --fix --select I,B905 "${files[@]}"
          ruff format "${files[@]}"
          ruff check "${files[@]}"
          git diff --check
      - name: Commit mechanical formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/audit_rv02_boundary_recruitment.py \
            scripts/run_rv02_boundary_recruitment.py \
            scripts/run_rv02_development.py \
            scripts/run_rv02_recruitment.py \
            src/sparkbrain/research/rv02_boundary_recruitment.py \
            src/sparkbrain/research/rv02_scale.py \
            tests/test_rv02_boundary_raw_audit.py \
            tests/test_rv02_boundary_recruitment.py \
            tests/test_rv02_bundle_verifier.py \
            tests/test_rv02_scale_contract.py
          git commit -m "style(rv02): make RD002 diagnostics CI-clean"
          git push origin HEAD:fix/rv02-rd002-ci-20260911
