name: v061-publish-temporal-functional-discriminators

on:
  push:
    branches:
      - v061-candidate-003-failure-diagnostics-work
    paths:
      - .github/workflows/v061-publish-temporal-functional-discriminators.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v061-candidate-003-failure-diagnostics-work
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Normalize observer-only diagnostic source
        run: |
          python -m ruff check --fix \
            src/sparkbrain/evaluation/v061_temporal_functional_decoupling.py \
            src/sparkbrain/evaluation/v061_temporal_functional_discriminators.py \
            tests/v06/test_temporal_functional_decoupling.py \
            tests/v06/test_temporal_functional_discriminators.py \
            scripts/v061_temporal_functional_decoupling_report.py \
            scripts/v061_temporal_functional_discriminator_report.py

      - name: Verify causal discriminators
        run: |
          python -m ruff check \
            src/sparkbrain/evaluation/v061_temporal_functional_decoupling.py \
            src/sparkbrain/evaluation/v061_temporal_functional_discriminators.py \
            tests/v06/test_temporal_functional_decoupling.py \
            tests/v06/test_temporal_functional_discriminators.py \
            scripts/v061_temporal_functional_decoupling_report.py \
            scripts/v061_temporal_functional_discriminator_report.py
          python -m pytest -q \
            tests/v06/test_temporal_functional_decoupling.py \
            tests/v06/test_temporal_functional_discriminators.py

      - name: Materialize D7 and D8 reports
        run: |
          mkdir -p docs/diagnostics
          python scripts/v061_temporal_functional_decoupling_report.py \
            --json docs/diagnostics/V061_D7_TEMPORAL_FUNCTIONAL_DECOUPLING.json \
            --markdown docs/V061_D7_TEMPORAL_FUNCTIONAL_DECOUPLING.md
          python scripts/v061_temporal_functional_discriminator_report.py \
            --json docs/diagnostics/V061_D8_TEMPORAL_FUNCTIONAL_DISCRIMINATORS.json \
            --markdown docs/V061_D8_TEMPORAL_FUNCTIONAL_DISCRIMINATORS.md

      - name: Commit verified reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/sparkbrain/evaluation/v061_temporal_functional_decoupling.py \
            src/sparkbrain/evaluation/v061_temporal_functional_discriminators.py \
            tests/v06/test_temporal_functional_decoupling.py \
            tests/v06/test_temporal_functional_discriminators.py \
            scripts/v061_temporal_functional_decoupling_report.py \
            scripts/v061_temporal_functional_discriminator_report.py \
            docs/V061_D7_TEMPORAL_FUNCTIONAL_DECOUPLING.md \
            docs/V061_D8_TEMPORAL_FUNCTIONAL_DISCRIMINATORS.md \
            docs/diagnostics/V061_D7_TEMPORAL_FUNCTIONAL_DECOUPLING.json \
            docs/diagnostics/V061_D8_TEMPORAL_FUNCTIONAL_DISCRIMINATORS.json
          if git diff --cached --quiet; then
            echo "Verified reports already published."
            exit 0
          fi
          git commit -m "docs(v061): publish temporal-functional causal diagnosis [skip ci]"
          git push origin HEAD:v061-candidate-003-failure-diagnostics-work
