name: staging-external-raw-store

on:
  push:
    branches: ["v06-capability-staging-20260830"]
    paths:
      - ".github/workflows/staging-external-raw-store.yml"
      - "src/sparkbrain/evaluation/v06_confirmatory_external_freeze.py"
      - "src/sparkbrain/evaluation/v06_confirmatory_external_raw_store.py"
      - "tests/v06/test_confirmatory_external_raw_store.py"

permissions:
  contents: read

jobs:
  raw-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint external raw store
        run: >-
          python -m ruff check
          src/sparkbrain/evaluation/v06_confirmatory_external_raw_store.py
          tests/v06/test_confirmatory_external_raw_store.py
      - name: Test two-level atomic raw evidence commit
        run: python -m pytest -q tests/v06/test_confirmatory_external_raw_store.py

# Synthetic payloads only. No candidate world or capability adapter is imported.
