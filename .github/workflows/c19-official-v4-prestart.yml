name: C19 official-v4 pre-START admission

on:
  push:
    branches:
      - "research/c19-official-v4-preservation-qualified-20260917"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
      - name: Install exact official-v4 runtime
        run: |
          set -euo pipefail
          test "$(python -c 'import platform; print(platform.python_version())')" = '3.11.16'
          python -m pip install --upgrade pip
          python -m pip install -e ".[learned]"
      - name: Exact runtime and network-blocked synthetic acquisition smoke
        run: |
          set -euo pipefail
          python scripts/check_c19_official_v4_runtime.py
      - name: Install pre-START-only test tooling
        run: |
          set -euo pipefail
          python -m pip install "pytest>=8.0"
      - name: Prove v4 scientific contract is exact v3 inheritance
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_c19_official_v4_invariance.py
      - name: Re-prove qualified generic preservation boundary locally
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_raw_preservation_boundary.py
      - name: Frozen v2 scorer regression remains green
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_c19_official_v2_scoring.py
