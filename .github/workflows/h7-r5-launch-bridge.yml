name: H7 R5 workflow-dispatch bridge

# Operational, non-scientific bridge. A scheduler/MAIN/Relay updates only the
# request file after a fresh Evidence Analyst generation has revalidated the
# exact controller/science binding and retained GO_ONCE authority.
on:
  push:
    branches:
      - ops/h7-r5-launch-bridge
    paths:
      - ops/h7_launch_request.json

permissions:
  actions: write
  contents: read

concurrency:
  group: h7-r5-workflow-dispatch-bridge
  cancel-in-progress: false

env:
  ANALYST_BRANCH: ops/evidence-analyst-handoff
  TARGET_WORKFLOW: h7-formal-r5-one-way-launch.yml
  TARGET_REF: research/main-h7-r5-launch-plumbing-r111-workflow-dispatch
  CONTROLLER_SHA: bac7402fb01b69353eb926228574cc68c2c2a2d2
  SCIENCE_SHA: 2f30b93f8f3cf226ef55ed5af7e341089d2c3c80

jobs:
  dispatch-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout launch request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Read request gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.schema_version == 1' ops/h7_launch_request.json >/dev/null
          jq -e '.request_kind == "H7_R5_ONE_SHOT_WORKFLOW_DISPATCH_REQUEST"' ops/h7_launch_request.json >/dev/null
          armed="$(jq -r '.armed' ops/h7_launch_request.json)"
          test "$armed" = "true" -o "$armed" = "false"
          echo "armed=$armed" >> "$GITHUB_OUTPUT"
          if [ "$armed" != "true" ]; then
            echo "H7 launch bridge is dormant; no workflow dispatch requested."
          fi

      - name: Verify request and fresh Analyst authority
        if: ${{ steps.gate.outputs.armed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          req=ops/h7_launch_request.json

          jq -e --arg v "$CONTROLLER_SHA" '.controller_sha == $v' "$req" >/dev/null
          jq -e --arg v "$SCIENCE_SHA" '.science_sha == $v' "$req" >/dev/null
          test "$(jq -r '.analyst_generation_id // empty' "$req")" != ""
          test "$(jq -r '.analyst_commit // empty' "$req")" != ""
          test "$(jq -r '.request_nonce // empty' "$req")" != ""

          current_target_sha="$(git ls-remote origin "refs/heads/$TARGET_REF" | cut -f1)"
          test "$current_target_sha" = "$CONTROLLER_SHA"

          analyst_sha="$(git ls-remote origin "refs/heads/$ANALYST_BRANCH" | cut -f1)"
          test -n "$analyst_sha"
          test "$analyst_sha" = "$(jq -r '.analyst_commit' "$req")"
          git fetch --no-tags origin "$analyst_sha"
          git show "$analyst_sha:analysis/orchestrator/state.json" > "$RUNNER_TEMP/analyst-state.json"

          state="$RUNNER_TEMP/analyst-state.json"
          jq -e --arg v "$(jq -r '.analyst_generation_id' "$req")" '.generation_id == $v' "$state" >/dev/null
          jq -e '.H7.stage == "PRE_FORMAL"' "$state" >/dev/null
          jq -e '.H7.claim_ceiling == "MECHANISM"' "$state" >/dev/null
          jq -e '.H7.terminal_state == "ACTIVE"' "$state" >/dev/null
          jq -e '.H7.queue_state == "QUEUED"' "$state" >/dev/null
          jq -e '.H7.preformal_eligible == true' "$state" >/dev/null
          jq -e '.H7.preformal_readiness == "READY"' "$state" >/dev/null
          jq -e '.H7.development_phase == "RESULT_EXPOSED_DEVELOPMENT"' "$state" >/dev/null
          jq -e '.H7.development_revision == "R5_UNCHANGED"' "$state" >/dev/null
          jq -e '.H7.executor_trigger_capable == true' "$state" >/dev/null
          jq -e '.H7.effectively_executable == true' "$state" >/dev/null
          jq -e '.H7.identity_status == "NOT_CREATED_NOT_CONSUMED"' "$state" >/dev/null
          jq -e '.H7.formal_authority | type == "string" and startswith("GO_ONCE")' "$state" >/dev/null
          jq -e --arg v "$CONTROLLER_SHA" '.H7.exact_bound_controller == $v' "$state" >/dev/null
          jq -e --arg v "$SCIENCE_SHA" '.H7.exact_bound_science == $v' "$state" >/dev/null

          jq -e '.hard_floor.identity_consumed == false' "$state" >/dev/null
          jq -e '.hard_floor.result_bearing_workflow_dispatched == false' "$state" >/dev/null
          jq -e '.hard_floor.protected_evaluation_accessed == false' "$state" >/dev/null
          jq -e '.hard_floor.terminal_reopened == false' "$state" >/dev/null
          jq -e '.hard_floor.historical_pass_fail_rewritten == false' "$state" >/dev/null

      - name: Verify no retained duplicate dispatch
        if: ${{ steps.gate.outputs.armed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          nonce="$(jq -r '.request_nonce' ops/h7_launch_request.json)"
          run_name="H7 R5 one-way FORMAL launch $nonce"

          curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs?event=workflow_dispatch&per_page=100" \
            > "$RUNNER_TEMP/h7-formal-runs.json"

          if jq -e --arg run_name "$run_name" '.workflow_runs[] | select(.display_title == $run_name)' "$RUNNER_TEMP/h7-formal-runs.json" >/dev/null; then
            echo "A retained H7 workflow-dispatch run already exists for this nonce." >&2
            exit 1
          fi

      - name: Dispatch exact Analyst-bound H7 controller once
        if: ${{ steps.gate.outputs.armed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          req=ops/h7_launch_request.json
          payload="$(jq -nc \
            --arg ref "$TARGET_REF" \
            --arg controller_sha "$CONTROLLER_SHA" \
            --arg science_sha "$SCIENCE_SHA" \
            --arg analyst_generation_id "$(jq -r '.analyst_generation_id' "$req")" \
            --arg analyst_commit "$(jq -r '.analyst_commit' "$req")" \
            --arg request_nonce "$(jq -r '.request_nonce' "$req")" \
            '{ref:$ref,inputs:{controller_sha:$controller_sha,science_sha:$science_sha,analyst_generation_id:$analyst_generation_id,analyst_commit:$analyst_commit,request_nonce:$request_nonce}}')"

          status="$(curl --silent --show-error --output "$RUNNER_TEMP/dispatch-response.txt" --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/$TARGET_WORKFLOW/dispatches" \
            --data "$payload")"

          if [ "$status" != "204" ]; then
            cat "$RUNNER_TEMP/dispatch-response.txt"
            echo "H7 workflow dispatch failed with HTTP $status; no retry is automatic." >&2
            exit 1
          fi

          {
            echo "### H7 R5 workflow-dispatch bridge"
            echo
            echo "- exact controller: `$CONTROLLER_SHA`"
            echo "- exact science: `$SCIENCE_SHA`"
            echo "- analyst generation: `$(jq -r '.analyst_generation_id' "$req")`"
            echo "- request nonce: `$(jq -r '.request_nonce' "$req")`"
            echo "- workflow_dispatch accepted: HTTP 204"
          } >> "$GITHUB_STEP_SUMMARY"
