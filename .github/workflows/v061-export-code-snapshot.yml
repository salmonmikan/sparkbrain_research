name: v061-export-code-snapshot

on:
  push:
    branches:
      - v061-timing-contract-correction-20260831
    paths:
      - .github/workflows/v061-export-code-snapshot.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v061-timing-contract-correction-20260831
          fetch-depth: 1
          lfs: false

      - name: Build code-only snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar -czf sparkbrain-v061-code.tar.gz \
            .github \
            src \
            tests \
            scripts \
            docs/V061_TIMING_CONTRACT_CORRECTION.md \
            docs/V06_CANDIDATE_002_FORMAL_RUN_REPORT.md \
            pyproject.toml \
            README.md

      - uses: actions/upload-artifact@v4
        with:
          name: v061-code-snapshot-${{ github.run_id }}
          path: sparkbrain-v061-code.tar.gz
          compression-level: 0
          retention-days: 7
