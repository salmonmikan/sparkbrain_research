name: h7-formal-r3-preidentity

on:
  push:
    branches:
      - research/main-h7-formal-r3-unexposed-eval-runtime-r76-cycle9
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  preidentity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          cache: pip
          check-latest: false
      - name: Install package surface
        run: python -m pip install -e ".[dev,learned,spiking]"
      - name: Build non-result R3 integrity closure
        run: |
          python scripts/build_h7_formal_r3_preidentity.py \
            --runtime-binding artifacts/formal_h7_r3/runtime_binding.json \
            --prior-surface-inventory artifacts/formal_h7_r3/prior_surface_inventory.json \
            --output-dir artifacts/formal_h7_r3/preidentity_ci
      - name: Assert no protected evaluation or one-way material exists
        run: |
          test ! -e artifacts/formal_h7_r3/preidentity_ci/evaluation_payload.json
          test ! -e artifacts/formal_h7_r3/preidentity_ci/evaluation_seeds.json
          test ! -e artifacts/formal_h7_r3/preidentity_ci/FORMAL_IDENTITY.json
          test ! -e artifacts/formal_h7_r3/preidentity_ci/STARTED.json
          test ! -e artifacts/formal_h7_r3/preidentity_ci/official_prediction_raw.jsonl
          test ! -e artifacts/formal_h7_r3/preidentity_ci/official_score.json
          ! grep -R -E '8846030|8846285' \
            artifacts/formal_h7_r3/contract_design.json \
            artifacts/formal_h7_r3/runtime_binding.json \
            src/sparkbrain/learned/h7_formal_r3.py \
            src/sparkbrain/learned/h7_formal_r3_integrity.py \
            scripts/build_h7_formal_r3_preidentity.py
      - name: R3 preidentity tests
        run: python -m pytest -q tests/learned/test_h7_formal_r3.py
      - name: R3 lint
        run: |
          python -m ruff check \
            src/sparkbrain/learned/h7_formal_r3.py \
            src/sparkbrain/learned/h7_formal_r3_integrity.py \
            scripts/build_h7_formal_r3_preidentity.py \
            tests/learned/test_h7_formal_r3.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h7-formal-r3-preidentity-${{ github.sha }}
          path: artifacts/formal_h7_r3/preidentity_ci
          if-no-files-found: error
