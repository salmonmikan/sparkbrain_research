name: pd01-formal-contract-prestart

on:
  push:
    branches:
      - research/pd01-fading-memory-preformal-20260918
  pull_request:
    paths:
      - "research/pd01/formal_contract.json"
      - "research/pd01/FORMAL_CONTRACT.md"
      - "src/sparkbrain/external_validation/fading_memory.py"
      - "scripts/check_pd01_formal_contract.py"
      - "tests/test_pd01_formal_contract.py"
      - ".github/workflows/pd01-formal-contract-prestart.yml"

jobs:
  formal-contract-prestart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
      - name: Verify exact runtime
        run: python -c 'import platform; assert platform.python_version() == "3.11.16"'
      - name: Install local dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint formal-contract package
        run: >-
          python -m ruff check
          src/sparkbrain/external_validation/fading_memory.py
          scripts/check_pd01_formal_contract.py
          tests/test_pd01_formal_contract.py
      - name: Verify fail-closed formal contract
        run: python scripts/check_pd01_formal_contract.py
      - name: Run prospective formal-contract tests
        run: python -m pytest -q tests/test_pd01_formal_contract.py
