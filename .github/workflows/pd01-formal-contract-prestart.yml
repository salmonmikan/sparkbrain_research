name: pd01-formal-contract-prestart

on:
  push:
    branches:
      - research/pd01-fading-memory-preformal-20260918
  pull_request:
    paths:
      - "research/pd01/**"
      - "src/sparkbrain/external_validation/fading_memory.py"
      - "scripts/check_pd01_formal_contract.py"
      - "scripts/check_pd01_execution_authority.py"
      - "scripts/run_pd01_official.py"
      - "scripts/preserve_pd01_boundary.py"
      - "tests/test_pd01_formal_contract.py"
      - ".github/workflows/pd01-formal-contract-prestart.yml"
      - ".github/workflows/pd01-formal-one-way.yml"

jobs:
  formal-contract-prestart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
      - name: Verify exact runtime
        run: python -c 'import platform; assert platform.python_version() == "3.11.16"'
      - name: Install local dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint formal execution package
        run: >-
          python -m ruff check
          src/sparkbrain/external_validation/fading_memory.py
          scripts/check_pd01_formal_contract.py
          scripts/check_pd01_execution_authority.py
          scripts/run_pd01_official.py
          scripts/preserve_pd01_boundary.py
          tests/test_pd01_formal_contract.py
      - name: Verify reviewed scientific contract remains exact
        run: python scripts/check_pd01_formal_contract.py
      - name: Verify fresh execution authority envelope
        run: python scripts/check_pd01_execution_authority.py
      - name: Run target-free production smoke
        run: >-
          python scripts/run_pd01_official.py prestart-smoke
          --analyst-commit 91a05bad6d130f89975e776960a1d25d764fba32
      - name: Run prospective formal-contract tests
        run: python -m pytest -q tests/test_pd01_formal_contract.py
