name: cx01-ruff-autofix

on:
  push:
    branches: ["research/cx01-comparator-extension"]
    paths:
      - "src/sparkbrain/comparison/cx01/**"
      - "tests/cx01/**"
      - ".github/workflows/cx01-ruff-autofix.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/cx01-comparator-extension
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.9"
      - name: Apply formatting and safe fixes
        run: |
          python -m ruff format src/sparkbrain/comparison/cx01 tests/cx01
          python -m ruff check --fix src/sparkbrain/comparison/cx01 tests/cx01
          python -m ruff check src/sparkbrain/comparison/cx01 tests/cx01
      - name: Commit mechanical fixes
        run: |
          if git diff --quiet; then
            echo "No Ruff changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sparkbrain/comparison/cx01 tests/cx01
          git commit -m "style(cx01): apply Ruff fixes [skip ci]"
          git push origin HEAD:research/cx01-comparator-extension
