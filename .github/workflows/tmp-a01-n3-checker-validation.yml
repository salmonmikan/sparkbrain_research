name: Temporary A01 N3 checker validation

on:
  push:
    branches:
      - "fix/a01-n3-ci-20260911"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/a01-n3-ci-20260911
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ruff checker only
        run: python -m pip install ruff==0.16.6 && ruff check scripts/check_n3_development_artifacts_independent.py
      - name: Re-audit preserved N3 development artifacts without model execution
        run: python scripts/check_n3_development_artifacts_independent.py artifacts/v061/a01/N3_DEV_001
