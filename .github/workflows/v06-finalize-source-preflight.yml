name: v06-finalize-source-preflight

on:
  push:
    branches: ["v06-capability-staging-20260830"]
    paths:
      - ".github/workflows/v06-finalize-source-preflight.yml"

permissions:
  contents: write
  statuses: write
  pull-requests: write

jobs:
  finalize-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.finalize.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v06-capability-staging-20260830
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Finalize exact source tree
        id: finalize
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin v06-capability-staging-20260830
          rm -f .github/workflows/staging-ruff-diagnostics.yml
          rm -f .github/workflows/staging-ruff-autofix.yml
          rm -f .github/confirmatory/ruff-diagnostics.txt
          rm -f .github/workflows/v06-finalize-source-preflight.yml
          python -m ruff check --fix .
          python -m ruff check .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Finalization produced no source commit." >&2
            exit 1
          fi
          git commit -m "chore(v06): finalize candidate-002 source"
          source_sha="$(git rev-parse HEAD)"
          git push origin HEAD:v06-capability-staging-20260830
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"

  preflight:
    needs: finalize-source
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11.16", "3.13"]
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.finalize-source.outputs.source_sha }}
          fetch-depth: 0
          lfs: false
      - name: Require detached clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.finalize-source.outputs.source_sha }}"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install complete test dependencies
        run: python -m pip install -e ".[dev,learned,spiking]"
      - name: Lint
        run: python -m ruff check .
      - name: Local readiness
        run: python scripts/local_readiness_check.py
      - name: Full test suite
        run: python -m pytest -q
      - name: Exact launch-gate regression on frozen runtime
        if: matrix.python-version == '3.11.16'
        run: |
          python -m pytest -q \
            tests/v06/test_confirmatory_v2_freeze_bindings.py \
            tests/v06/test_confirmatory_external_launch_gate_v2.py \
            tests/v06/test_confirmatory_external_control_package_v2.py \
            tests/v06/test_confirmatory_freeze_bundle_v2.py \
            tests/v06/test_confirmatory_external_control_plane.py \
            tests/v06/test_confirmatory_formal_orchestration_static.py
      - name: Validate repository artifact bundle
        run: python scripts/validate_artifact_bundle.py

  attest:
    needs: [finalize-source, preflight]
    runs-on: ubuntu-24.04
    steps:
      - name: Ensure branch still equals tested source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.finalize-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/v06-capability-staging-20260830 --jq .object.sha)"
          test "${remote_sha}" = "${SOURCE_SHA}"
      - name: Publish final preflight status
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.finalize-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA} \
            -f state=success \
            -f context='v06/final-preflight' \
            -f description='Python 3.11.16/3.13, full tests, launch gate and bundle validation passed'
          gh api --method POST \
            repos/${GITHUB_REPOSITORY}/issues/12/comments \
            -f body="V06 FINAL PREFLIGHT PASS\n\nsource_sha: ${SOURCE_SHA}\n\nNo candidate-002 capability execution was performed by this workflow."
