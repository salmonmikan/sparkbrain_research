name: RV02 RD005 exact D1 construction launch

on:
  push:
    branches:
      - ops/rv02-rd005-d1-launch-20260914
    paths:
      - .github/workflows/rv02-rd005-d1-launch-20260914.yml

permissions:
  contents: write

jobs:
  launch-d1-exactly-once:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: c60b7fd8d3889ee969f505d921e7d31c990871e6
      FREEZE_REF: refs/heads/freeze/rv02-rd005-d1-source-c60b7fd8-20260914
      PREFLIGHT_REF: refs/heads/control/rv02-rd005-d1-preflight-c60b7fd8-20260914
      PREFLIGHT_SHA: 096ddb8c65f342866839a2cb135d45e36ec1aabf
      INPUT_SHA: 96634541dc29b00be9f19b5819d45f541af69348ab6c1b0da6b48e943221700a
      STARTED_BRANCH: control/rv02-rd005-d1-started-96634541-20260914
      PRESERVE_BRANCH: preserve/rv02-rd005-d1-96634541-20260914
      PREFLIGHT_ROOT: artifacts/research/rv02/rd005/preflight-c60b7fd8-20260914
      OUTPUT_REL: artifacts/rv02/rd005/development/construction-96634541dc29b00be9f19b5819d45f541af69348ab6c1b0da6b48e943221700a
      EVIDENCE_ROOT: artifacts/research/rv02/rd005/d1-96634541-20260914

    steps:
      - name: Checkout exact frozen source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up exact bound runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          cache: pip

      - name: Install package
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Revalidate freeze, preflight, one-way absence, and exact input
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test -z "$(git status --porcelain --untracked-files=no)"

          freeze_sha="$(git ls-remote origin "${FREEZE_REF}" | awk '{print $1}')"
          test "${freeze_sha}" = "${SOURCE_SHA}"
          preflight_sha="$(git ls-remote origin "${PREFLIGHT_REF}" | awk '{print $1}')"
          test "${preflight_sha}" = "${PREFLIGHT_SHA}"

          test -z "$(git ls-remote origin "refs/heads/${STARTED_BRANCH}")"
          test -z "$(git ls-remote origin "refs/heads/${PRESERVE_BRANCH}")"
          test ! -e "${OUTPUT_REL}"

          git fetch --no-tags origin "${PREFLIGHT_REF}:refs/remotes/origin/rd005-d1-preflight"
          git show "${PREFLIGHT_SHA}:${PREFLIGHT_ROOT}/construction_input.json" > /tmp/rd005-construction-input.json
          git show "${PREFLIGHT_SHA}:${PREFLIGHT_ROOT}/identities.json" > /tmp/rd005-identities.json
          git show "${PREFLIGHT_SHA}:${PREFLIGHT_ROOT}/source_manifest.json" > /tmp/rd005-source-manifest.json
          git show "${PREFLIGHT_SHA}:${PREFLIGHT_ROOT}/FINAL_PREFLIGHT_REVIEW.md" > /tmp/FINAL_PREFLIGHT_REVIEW.md
          test "$(sha256sum /tmp/rd005-construction-input.json | awk '{print $1}')" = "${INPUT_SHA}"

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from sparkbrain.research.rv02_rd005_bound_construction import verify_package_plan_binding
          from sparkbrain.research.rv02_rd005_construction_input import load_source_manifest
          from sparkbrain.research.rv02_rd005_execution_binding import RD005_D1_EXECUTION_BINDING, verify_rd005_d1_runtime
          from sparkbrain.research.rv02_rd005_retained_registry import build_authoritative_rd005_collision_registry
          from sparkbrain.research.rv02_rd005_source_binding import verify_rd005_source_checkout

          ids = json.loads(Path('/tmp/rd005-identities.json').read_text(encoding='utf-8'))
          required = {
              'source_git_sha': os.environ['SOURCE_SHA'],
              'construction_input_sha256': os.environ['INPUT_SHA'],
              'python_implementation': 'CPython',
              'python_version': '3.11.15',
              'capability_output_opened': False,
              'd1_started': False,
          }
          for key, expected in required.items():
              if ids.get(key) != expected:
                  raise RuntimeError(f'preflight identity mismatch for {key}: {ids.get(key)!r} != {expected!r}')
          manifest = load_source_manifest(Path('/tmp/rd005-source-manifest.json'))
          if manifest.manifest_sha256 != ids['source_manifest_sha256']:
              raise RuntimeError('source manifest digest drifted')
          verify_rd005_source_checkout(Path('.'), manifest)
          registry = build_authoritative_rd005_collision_registry(Path('.'))
          if registry.registry_sha256 != ids['collision_registry_sha256']:
              raise RuntimeError('collision registry digest drifted')
          raw = Path('/tmp/rd005-construction-input.json').read_bytes()
          if verify_package_plan_binding(raw) != ids['package_plan_sha256']:
              raise RuntimeError('package plan digest drifted')
          if RD005_D1_EXECUTION_BINDING.binding_sha256 != ids['execution_binding_sha256']:
              raise RuntimeError('execution binding digest drifted')
          verify_rd005_d1_runtime()
          PY

      - name: Record STARTED on a separate control ref
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf /tmp/rd005-started
          git worktree add -b "${STARTED_BRANCH}" /tmp/rd005-started "${SOURCE_SHA}"
          mkdir -p "/tmp/rd005-started/${EVIDENCE_ROOT}"
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path('/tmp/rd005-started') / os.environ['EVIDENCE_ROOT']
          payload = {
              'status': 'STARTED',
              'started_at_utc': datetime.now(timezone.utc).isoformat(),
              'source_git_sha': os.environ['SOURCE_SHA'],
              'freeze_ref': os.environ['FREEZE_REF'],
              'preflight_ref': os.environ['PREFLIGHT_REF'],
              'preflight_commit_sha': os.environ['PREFLIGHT_SHA'],
              'construction_input_sha256': os.environ['INPUT_SHA'],
              'expected_output_relpath': os.environ['OUTPUT_REL'],
              'retry_same_identity_allowed': False,
              'capability_output_opened': False,
              'human_review': 'HUMAN_REVIEW_WAIVED_BY_USER_2026-09-11',
              'execution_authorization': 'GLOBAL_EXPERIMENT_FORMAL_EXECUTION_PREAUTHORIZATION_2026-09-13',
              'github_run_id': os.environ.get('GITHUB_RUN_ID'),
              'github_run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
          }
          (root / 'STARTED.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          cp /tmp/rd005-identities.json "/tmp/rd005-started/${EVIDENCE_ROOT}/preflight_identities.json"
          cp /tmp/FINAL_PREFLIGHT_REVIEW.md "/tmp/rd005-started/${EVIDENCE_ROOT}/FINAL_PREFLIGHT_REVIEW.md"
          git -C /tmp/rd005-started add "${EVIDENCE_ROOT}"
          git -C /tmp/rd005-started commit -m 'control(rv02): mark RD005 D1 exact identity STARTED'
          git -C /tmp/rd005-started push origin "HEAD:refs/heads/${STARTED_BRANCH}"

      - name: Execute exact D1 construction once under frozen contract
        id: execute
        env:
          PYTHONPATH: src
        run: |
          set +e
          python -m sparkbrain.research.rv02_rd005_bound_construction \
            --input /tmp/rd005-construction-input.json \
            --repo-root . \
            > /tmp/rd005-d1.stdout 2> /tmp/rd005-d1.stderr
          code=$?
          set -e
          printf '%s\n' "${code}" > /tmp/rd005-d1.exitcode
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          # Preservation is mandatory even on terminal failure, so do not exit here.

      - name: Preserve raw D1 success or terminal failure immutably
        run: |
          set -euo pipefail
          code="$(cat /tmp/rd005-d1.exitcode)"
          test -z "$(git ls-remote origin "refs/heads/${PRESERVE_BRANCH}")"
          rm -rf /tmp/rd005-preserve
          git worktree add -b "${PRESERVE_BRANCH}" /tmp/rd005-preserve "${SOURCE_SHA}"
          mkdir -p "/tmp/rd005-preserve/${EVIDENCE_ROOT}"
          cp /tmp/rd005-construction-input.json "/tmp/rd005-preserve/${EVIDENCE_ROOT}/construction_input.json"
          cp /tmp/rd005-identities.json "/tmp/rd005-preserve/${EVIDENCE_ROOT}/preflight_identities.json"
          cp /tmp/rd005-source-manifest.json "/tmp/rd005-preserve/${EVIDENCE_ROOT}/source_manifest.json"
          cp /tmp/FINAL_PREFLIGHT_REVIEW.md "/tmp/rd005-preserve/${EVIDENCE_ROOT}/FINAL_PREFLIGHT_REVIEW.md"
          cp "/tmp/rd005-started/${EVIDENCE_ROOT}/STARTED.json" "/tmp/rd005-preserve/${EVIDENCE_ROOT}/STARTED.json"
          cp /tmp/rd005-d1.stdout "/tmp/rd005-preserve/${EVIDENCE_ROOT}/command.stdout"
          cp /tmp/rd005-d1.stderr "/tmp/rd005-preserve/${EVIDENCE_ROOT}/command.stderr"
          cp /tmp/rd005-d1.exitcode "/tmp/rd005-preserve/${EVIDENCE_ROOT}/command.exitcode"
          if [ -d "${OUTPUT_REL}" ]; then
            mkdir -p "/tmp/rd005-preserve/$(dirname "${OUTPUT_REL}")"
            cp -a "${OUTPUT_REL}" "/tmp/rd005-preserve/${OUTPUT_REL}"
          fi
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          preserve = Path('/tmp/rd005-preserve')
          evidence = preserve / os.environ['EVIDENCE_ROOT']
          output = preserve / os.environ['OUTPUT_REL']
          code = int((evidence / 'command.exitcode').read_text().strip())
          complete = output / 'COMPLETE.json'
          failed = output / 'FAILED.json'
          if code == 0:
              if not complete.is_file() or failed.exists():
                  raise RuntimeError('successful command did not preserve exactly COMPLETE without FAILED')
              status = 'D1_CONSTRUCTION_COMPLETE_CAPABILITY_UNOPENED'
          else:
              status = 'D1_CONSTRUCTION_FAILED_TERMINAL_IDENTITY_CONSUMED'
          hashes = {}
          for path in sorted(p for p in preserve.rglob('*') if p.is_file()):
              rel = path.relative_to(preserve).as_posix()
              if rel.endswith('/PRESERVATION_MANIFEST.json'):
                  continue
              hashes[rel] = hashlib.sha256(path.read_bytes()).hexdigest()
          result = {
              'status': status,
              'preserved_at_utc': datetime.now(timezone.utc).isoformat(),
              'source_git_sha': os.environ['SOURCE_SHA'],
              'freeze_ref': os.environ['FREEZE_REF'],
              'preflight_commit_sha': os.environ['PREFLIGHT_SHA'],
              'construction_input_sha256': os.environ['INPUT_SHA'],
              'command_exit_code': code,
              'capability_output_opened': False,
              'learner_or_probe_executed': False,
              'retry_same_identity_allowed': False,
          }
          (evidence / 'RESULT.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          hashes[(evidence / 'RESULT.json').relative_to(preserve).as_posix()] = hashlib.sha256((evidence / 'RESULT.json').read_bytes()).hexdigest()
          (evidence / 'PRESERVATION_MANIFEST.json').write_text(json.dumps({'files': hashes}, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          git -C /tmp/rd005-preserve add "${EVIDENCE_ROOT}" "${OUTPUT_REL}"
          git -C /tmp/rd005-preserve commit -m 'preserve(rv02): lock RD005 D1 exact raw outcome'
          git -C /tmp/rd005-preserve push origin "HEAD:refs/heads/${PRESERVE_BRANCH}"
          if [ "${code}" -ne 0 ]; then
            echo "RD005 D1 exact identity consumed with terminal failure; preserved without retry" >&2
            exit "${code}"
          fi
