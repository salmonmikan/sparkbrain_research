name: A01 MD-002 P4 Candidate-001 Execute Once

on:
  push:
    branches:
      - "control/a01-md002-p4-candidate-001-started-20260916"

concurrency:
  group: a01-md002-p4-candidate-001-one-shot
  cancel-in-progress: false

permissions:
  contents: write

env:
  FREEZE_REF: freeze/a01-md002-p4-candidate-001-source-20260916
  CONTROL_REF: control/a01-md002-p4-candidate-001-started-20260916
  OWNER_REF: control/a01-md002-p4-candidate-001-owner-20260916
  RECOVERY_PRESERVE_REF: preserve/a01-md002-p4-candidate-001-recovery-20260916
  RAW_PRESERVE_REF: preserve/a01-md002-p4-candidate-001-raw-20260916
  SCORED_PRESERVE_REF: preserve/a01-md002-p4-candidate-001-scored-20260916
  OUTPUT_ROOT: artifacts/v061/a01/md002-p4-candidate-001
  RAW_PATH: artifacts/v061/a01/md002-p4-candidate-001/raw.json
  SCORE_PATH: artifacts/v061/a01/md002-p4-candidate-001/scored.json

jobs:
  execute-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout atomic STARTED source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard exact frozen source and atomically claim STARTED ownership
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "${GITHUB_REF}" = "refs/heads/${CONTROL_REF}"
          git fetch origin \
            "+refs/heads/${FREEZE_REF}:refs/remotes/origin/${FREEZE_REF}" \
            "+refs/heads/${CONTROL_REF}:refs/remotes/origin/${CONTROL_REF}"
          frozen_sha="$(git rev-parse "refs/remotes/origin/${FREEZE_REF}")"
          control_sha="$(git rev-parse "refs/remotes/origin/${CONTROL_REF}")"
          test "${GITHUB_SHA}" = "${frozen_sha}"
          test "${GITHUB_SHA}" = "${control_sha}"
          test "$(git rev-parse HEAD)" = "${frozen_sha}"
          for ref in "${OWNER_REF}" "${RECOVERY_PRESERVE_REF}" "${RAW_PRESERVE_REF}" "${SCORED_PRESERVE_REF}"; do
            if git ls-remote --exit-code --heads origin "${ref}" >/dev/null 2>&1; then
              echo "refusing consumed P4 identity: ${ref}" >&2
              exit 1
            fi
          done

          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="github-actions[bot]"
          export GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          claim_commit="$(
            printf '%s\n' \
              "STARTED owner claim: a01-md002-p4-merged-lineage-selective-resolution-candidate-001-v1" \
              "source_sha=${GITHUB_SHA}" \
              "workflow_run_id=${GITHUB_RUN_ID}" \
              "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}" \
              "authority=A01_MD002_USER_AUTHORIZATION_2026-09-12" |
              git commit-tree "$(git rev-parse "${GITHUB_SHA}^{tree}")" -p "${GITHUB_SHA}"
          )"
          git push origin "${claim_commit}:refs/heads/${OWNER_REF}"
          printf '%s\n' "${claim_commit}" > "${RUNNER_TEMP}/p4-owner-claim-sha"

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Verify runtime contract and install exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(python --version)" = "Python 3.11.16"
          python - <<'PY'
          import json
          from pathlib import Path

          runtime = json.loads(
              Path("research/v061_a01/md002_p4_candidate_001_runtime.json").read_text()
          )
          assert runtime == {
              "schema": "v061-a01-md002-p4-candidate-runtime-v1",
              "candidate_id": "a01-md002-p4-merged-lineage-selective-resolution-candidate-001-v1",
              "python_version": "3.11.16",
              "runner_label": "ubuntu-24.04",
              "package_install": "python -m pip install --no-deps -e .",
              "runtime_third_party_dependencies": [],
              "development_only": True,
              "held_out_execution_allowed": False,
              "formal_execution_allowed": False,
              "same_identity_rerun_allowed": False,
          }
          PY
          python -m pip install --no-deps -e .

      - name: Bind frozen candidate manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_ROOT}/_execution_metadata"
          python scripts/run_v061_a01_md002_p4_candidate_001_v3.py manifest \
            --source-sha "${GITHUB_SHA}" \
            --output "${OUTPUT_ROOT}/candidate_manifest.json"
          cp research/v061_a01/md002_p4_candidate_001_runtime.json \
            "${OUTPUT_ROOT}/runtime_contract.json"
          python --version > "${OUTPUT_ROOT}/_execution_metadata/python_version.txt" 2>&1
          git rev-parse HEAD > "${OUTPUT_ROOT}/_execution_metadata/source_sha.txt"
          cd "${OUTPUT_ROOT}"
          sha256sum \
            candidate_manifest.json \
            runtime_contract.json \
            _execution_metadata/python_version.txt \
            _execution_metadata/source_sha.txt \
            > _execution_metadata/binding.sha256
          cd "${GITHUB_WORKSPACE}"

      - name: Acquire eight-execution raw development evidence exactly once
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_v061_a01_md002_p4_candidate_001_v3.py acquire \
            --source-sha "${GITHUB_SHA}" \
            --output "${RAW_PATH}"
          cd "${OUTPUT_ROOT}"
          sha256sum raw.json > raw.sha256
          cd "${GITHUB_WORKSPACE}"

      - name: Preserve raw evidence before scoring
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "${RUNNER_TEMP}/p4-owner-claim-sha" ]; then
            echo "run did not acquire durable STARTED ownership; refusing preserve writes"
            exit 0
          fi
          claim_commit="$(cat "${RUNNER_TEMP}/p4-owner-claim-sha")"
          git fetch origin "+refs/heads/${OWNER_REF}:refs/remotes/origin/${OWNER_REF}"
          test "$(git rev-parse "refs/remotes/origin/${OWNER_REF}")" = "${claim_commit}"
          test "$(git rev-parse "${claim_commit}^")" = "${GITHUB_SHA}"
          git show -s --format=%B "${claim_commit}" | grep -F "workflow_run_id=${GITHUB_RUN_ID}"
          for ref in "${RECOVERY_PRESERVE_REF}" "${RAW_PRESERVE_REF}"; do
            if git ls-remote --exit-code --heads origin "${ref}" >/dev/null 2>&1; then
              echo "refusing to move existing preserve ref: ${ref}" >&2
              exit 1
            fi
          done
          mkdir -p "${OUTPUT_ROOT}/_execution_metadata"
          cat > "${OUTPUT_ROOT}/_execution_metadata/execution_metadata.json" <<EOF
          {
            "candidate_id": "a01-md002-p4-merged-lineage-selective-resolution-candidate-001-v1",
            "stage": "exposed-development",
            "frozen_source_git_sha": "${GITHUB_SHA}",
            "freeze_ref": "${FREEZE_REF}",
            "control_ref": "${CONTROL_REF}",
            "execution_owner_ref": "${OWNER_REF}",
            "execution_owner_claim_commit": "${claim_commit}",
            "recovery_preserve_ref": "${RECOVERY_PRESERVE_REF}",
            "raw_preserve_ref": "${RAW_PRESERVE_REF}",
            "scored_preserve_ref": "${SCORED_PRESERVE_REF}",
            "execution_authority_type": "USER_EXPLICIT_A01_LINE_SCOPED_EXECUTION_AUTHORIZATION",
            "execution_authorization_date": "2026-09-12",
            "execution_authorization_record": "docs/research/V061_A01_MD002_EXECUTION_AUTHORIZATION_20260912.md",
            "execution_authority_identity": "A01_MD002_USER_AUTHORIZATION_2026-09-12",
            "execution_seal_identity": "${FREEZE_REF}@${GITHUB_SHA}|${CONTROL_REF}@${GITHUB_SHA}|${OWNER_REF}@${claim_commit}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "python_version": "$(python --version 2>&1)",
            "same_identity_rerun_allowed": false,
            "held_out_executed": false,
            "formal_execution_allowed": false
          }
          EOF
          if [ ! -f "${RAW_PATH}" ]; then
            mkdir -p "${OUTPUT_ROOT}/_terminal"
            cat > "${OUTPUT_ROOT}/_terminal/FAILED_BEFORE_RAW.json" <<EOF
          {
            "status": "P4_TERMINAL_FAILURE_AFTER_STARTED_BEFORE_RAW",
            "frozen_source_git_sha": "${GITHUB_SHA}",
            "same_identity_rerun_allowed": false
          }
          EOF
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${OUTPUT_ROOT}"
          git commit -m "Preserve A01 P4 raw evidence ${GITHUB_RUN_ID}"
          raw_commit="$(git rev-parse HEAD)"
          printf '%s\n' "${raw_commit}" > "${RUNNER_TEMP}/p4-raw-commit-sha"
          git push origin "${raw_commit}:refs/heads/${RECOVERY_PRESERVE_REF}"
          touch "${RUNNER_TEMP}/p4-recovery-preserve-owner"
          git push origin "${raw_commit}:refs/heads/${RAW_PRESERVE_REF}"
          touch "${RUNNER_TEMP}/p4-raw-preserve-owner"

      - name: Verify preserved raw bytes before scoring
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            "+refs/heads/${RAW_PRESERVE_REF}:refs/remotes/origin/${RAW_PRESERVE_REF}"
          local_sha="$(sha256sum "${RAW_PATH}" | awk '{print $1}')"
          preserved_sha="$(
            git show "refs/remotes/origin/${RAW_PRESERVE_REF}:${RAW_PATH}" |
              sha256sum | awk '{print $1}'
          )"
          test "${local_sha}" = "${preserved_sha}"
          cd "${OUTPUT_ROOT}"
          sha256sum -c raw.sha256
          sha256sum -c _execution_metadata/binding.sha256
          cd "${GITHUB_WORKSPACE}"
          touch "${RUNNER_TEMP}/p4-raw-verified"

      - name: Score only already-preserved raw evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          touch "${RUNNER_TEMP}/p4-score-started"
          python scripts/run_v061_a01_md002_p4_candidate_001_v3.py score \
            --source-sha "${GITHUB_SHA}" \
            --raw-input "${RAW_PATH}" \
            --output "${SCORE_PATH}"
          cd "${OUTPUT_ROOT}"
          sha256sum scored.json > scored.sha256
          sha256sum -c scored.sha256
          cd "${GITHUB_WORKSPACE}"
          touch "${RUNNER_TEMP}/p4-score-complete"

      - name: Preserve score or accurately staged terminal failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "${RUNNER_TEMP}/p4-owner-claim-sha" ]; then
            echo "run did not acquire durable STARTED ownership; refusing scored preserve write"
            exit 0
          fi
          claim_commit="$(cat "${RUNNER_TEMP}/p4-owner-claim-sha")"
          git fetch origin "+refs/heads/${OWNER_REF}:refs/remotes/origin/${OWNER_REF}"
          test "$(git rev-parse "refs/remotes/origin/${OWNER_REF}")" = "${claim_commit}"
          test "$(git rev-parse "${claim_commit}^")" = "${GITHUB_SHA}"
          git show -s --format=%B "${claim_commit}" | grep -F "workflow_run_id=${GITHUB_RUN_ID}"

          if git ls-remote --exit-code --heads origin "${RECOVERY_PRESERVE_REF}" >/dev/null 2>&1; then
            git fetch origin "+refs/heads/${RECOVERY_PRESERVE_REF}:refs/remotes/origin/${RECOVERY_PRESERVE_REF}"
            raw_commit="$(git rev-parse "refs/remotes/origin/${RECOVERY_PRESERVE_REF}")"
          elif [ -f "${RUNNER_TEMP}/p4-raw-commit-sha" ]; then
            raw_commit="$(cat "${RUNNER_TEMP}/p4-raw-commit-sha")"
            git push origin "${raw_commit}:refs/heads/${RECOVERY_PRESERVE_REF}"
          else
            echo "owner run has no durable or local raw/terminal commit; recovery job will terminalize" >&2
            exit 1
          fi
          test "$(git rev-parse "${raw_commit}^")" = "${GITHUB_SHA}"
          git show -s --format=%B "${raw_commit}" | grep -F "Preserve A01 P4 raw evidence ${GITHUB_RUN_ID}"
          git show "${raw_commit}:${OUTPUT_ROOT}/_execution_metadata/execution_metadata.json" |
            grep -F "\"workflow_run_id\": \"${GITHUB_RUN_ID}\""
          git show "${raw_commit}:${OUTPUT_ROOT}/_execution_metadata/execution_metadata.json" |
            grep -F "\"frozen_source_git_sha\": \"${GITHUB_SHA}\""

          if git ls-remote --exit-code --heads origin "${RAW_PRESERVE_REF}" >/dev/null 2>&1; then
            git fetch origin "+refs/heads/${RAW_PRESERVE_REF}:refs/remotes/origin/${RAW_PRESERVE_REF}"
            test "$(git rev-parse "refs/remotes/origin/${RAW_PRESERVE_REF}")" = "${raw_commit}"
          else
            echo "raw preserve publication did not complete earlier; promoting exact recovery commit"
            git push origin "${raw_commit}:refs/heads/${RAW_PRESERVE_REF}"
          fi

          if git ls-remote --exit-code --heads origin "${SCORED_PRESERVE_REF}" >/dev/null 2>&1; then
            echo "refusing to move existing scored preserve ref" >&2
            exit 1
          fi
          mkdir -p "${OUTPUT_ROOT}/_terminal"
          if [ -f "${OUTPUT_ROOT}/_terminal/FAILED_BEFORE_RAW.json" ]; then
            echo "preserving existing before-raw terminal stage"
          elif [ -f "${RUNNER_TEMP}/p4-score-complete" ]; then
            test -f "${SCORE_PATH}"
            test -f "${OUTPUT_ROOT}/scored.sha256"
          elif [ -f "${RUNNER_TEMP}/p4-score-started" ]; then
            cat > "${OUTPUT_ROOT}/_terminal/FAILED_DURING_SCORE.json" <<EOF
          {
            "status": "P4_TERMINAL_FAILURE_AFTER_STARTED_DURING_SCORE",
            "frozen_source_git_sha": "${GITHUB_SHA}",
            "same_identity_rerun_allowed": false
          }
          EOF
          elif [ ! -f "${RUNNER_TEMP}/p4-raw-verified" ]; then
            cat > "${OUTPUT_ROOT}/_terminal/FAILED_AFTER_RAW_BEFORE_SCORE.json" <<EOF
          {
            "status": "P4_TERMINAL_FAILURE_AFTER_STARTED_AFTER_RAW_BEFORE_SCORE",
            "frozen_source_git_sha": "${GITHUB_SHA}",
            "same_identity_rerun_allowed": false
          }
          EOF
          else
            cat > "${OUTPUT_ROOT}/_terminal/FAILED_BEFORE_SCORE.json" <<EOF
          {
            "status": "P4_TERMINAL_FAILURE_AFTER_STARTED_BEFORE_SCORE",
            "frozen_source_git_sha": "${GITHUB_SHA}",
            "same_identity_rerun_allowed": false
          }
          EOF
          fi
          git add -f "${OUTPUT_ROOT}"
          if ! git diff --cached --quiet; then
            git commit -m "Preserve A01 P4 scored result ${GITHUB_RUN_ID}"
          else
            echo "no new scored-stage bytes; reusing the existing raw-terminal commit"
          fi
          git push origin "HEAD:refs/heads/${SCORED_PRESERVE_REF}"

  recover-terminal:
    needs: execute-once
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact STARTED source for terminal recovery
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Recover owner-bound terminal state without reacquiring
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/${CONTROL_REF}"
          git fetch origin \
            "+refs/heads/${FREEZE_REF}:refs/remotes/origin/${FREEZE_REF}" \
            "+refs/heads/${CONTROL_REF}:refs/remotes/origin/${CONTROL_REF}"
          test "$(git rev-parse "refs/remotes/origin/${FREEZE_REF}")" = "${GITHUB_SHA}"
          test "$(git rev-parse "refs/remotes/origin/${CONTROL_REF}")" = "${GITHUB_SHA}"

          if ! git ls-remote --exit-code --heads origin "${OWNER_REF}" >/dev/null 2>&1; then
            echo "STARTED ownership was never acquired; nothing to recover"
            exit 0
          fi
          git fetch origin "+refs/heads/${OWNER_REF}:refs/remotes/origin/${OWNER_REF}"
          claim_commit="$(git rev-parse "refs/remotes/origin/${OWNER_REF}")"
          test "$(git rev-parse "${claim_commit}^")" = "${GITHUB_SHA}"
          owner_message="$(git show -s --format=%B "${claim_commit}")"
          owner_run_id="$(printf '%s\n' "${owner_message}" | sed -n 's/^workflow_run_id=//p')"
          test -n "${owner_run_id}"
          if [ "${owner_run_id}" != "${GITHUB_RUN_ID}" ]; then
            echo "durable owner belongs to workflow run ${owner_run_id}; this rejected run must not recover it"
            exit 0
          fi
          printf '%s\n' "${owner_message}" | grep -F "source_sha=${GITHUB_SHA}"

          if git ls-remote --exit-code --heads origin "${SCORED_PRESERVE_REF}" >/dev/null 2>&1; then
            echo "final scored/terminal preserve ref already exists"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "${RECOVERY_PRESERVE_REF}" >/dev/null 2>&1; then
            git fetch origin "+refs/heads/${RECOVERY_PRESERVE_REF}:refs/remotes/origin/${RECOVERY_PRESERVE_REF}"
            recovery_sha="$(git rev-parse "refs/remotes/origin/${RECOVERY_PRESERVE_REF}")"
            test "$(git rev-parse "${recovery_sha}^")" = "${GITHUB_SHA}"
            git show -s --format=%B "${recovery_sha}" | grep -F "Preserve A01 P4 raw evidence ${GITHUB_RUN_ID}"
            git show "${recovery_sha}:${OUTPUT_ROOT}/_execution_metadata/execution_metadata.json" |
              grep -F "\"workflow_run_id\": \"${GITHUB_RUN_ID}\""
            git show "${recovery_sha}:${OUTPUT_ROOT}/_execution_metadata/execution_metadata.json" |
              grep -F "\"frozen_source_git_sha\": \"${GITHUB_SHA}\""

            if git ls-remote --exit-code --heads origin "${RAW_PRESERVE_REF}" >/dev/null 2>&1; then
              git fetch origin "+refs/heads/${RAW_PRESERVE_REF}:refs/remotes/origin/${RAW_PRESERVE_REF}"
              test "$(git rev-parse "refs/remotes/origin/${RAW_PRESERVE_REF}")" = "${recovery_sha}"
            else
              git push origin "${recovery_sha}:refs/heads/${RAW_PRESERVE_REF}"
            fi

            if git cat-file -e "${recovery_sha}:${OUTPUT_ROOT}/_terminal/FAILED_BEFORE_RAW.json" 2>/dev/null; then
              git push origin "${recovery_sha}:refs/heads/${SCORED_PRESERVE_REF}"
              exit 0
            fi

            git checkout --detach "${recovery_sha}"
            mkdir -p "${OUTPUT_ROOT}/_terminal"
            cat > "${OUTPUT_ROOT}/_terminal/FAILED_AFTER_RAW_BEFORE_DURABLE_SCORE.json" <<EOF
          {
            "status": "P4_TERMINAL_FAILURE_AFTER_STARTED_RAW_DURABLE_SCORE_NOT_DURABLE",
            "frozen_source_git_sha": "${GITHUB_SHA}",
            "execution_owner_claim_commit": "${claim_commit}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "same_identity_rerun_allowed": false
          }
          EOF
            git add -f "${OUTPUT_ROOT}/_terminal/FAILED_AFTER_RAW_BEFORE_DURABLE_SCORE.json"
            git commit -m "Preserve A01 P4 recovered terminal ${GITHUB_RUN_ID}"
            git push origin "HEAD:refs/heads/${SCORED_PRESERVE_REF}"
            exit 0
          fi

          git checkout --detach "${GITHUB_SHA}"
          mkdir -p "${OUTPUT_ROOT}/_execution_metadata" "${OUTPUT_ROOT}/_terminal"
          cat > "${OUTPUT_ROOT}/_execution_metadata/terminal_recovery.json" <<EOF
          {
            "candidate_id": "a01-md002-p4-merged-lineage-selective-resolution-candidate-001-v1",
            "frozen_source_git_sha": "${GITHUB_SHA}",
            "execution_owner_ref": "${OWNER_REF}",
            "execution_owner_claim_commit": "${claim_commit}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "recovery_reason": "owner durable but no raw recovery commit became durable",
            "same_identity_rerun_allowed": false
          }
          EOF
          cat > "${OUTPUT_ROOT}/_terminal/FAILED_BEFORE_DURABLE_RAW.json" <<EOF
          {
            "status": "P4_TERMINAL_FAILURE_AFTER_STARTED_BEFORE_DURABLE_RAW",
            "frozen_source_git_sha": "${GITHUB_SHA}",
            "execution_owner_claim_commit": "${claim_commit}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "same_identity_rerun_allowed": false
          }
          EOF
          git add -f "${OUTPUT_ROOT}/_execution_metadata/terminal_recovery.json" \
            "${OUTPUT_ROOT}/_terminal/FAILED_BEFORE_DURABLE_RAW.json"
          git commit -m "Preserve A01 P4 no-raw terminal ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/${SCORED_PRESERVE_REF}"
