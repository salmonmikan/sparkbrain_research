name: RV01 R01-16 Review Ledger Append Once

on:
  push:
    branches:
      - "review/rv01-r01-16-delay-interaction-diagnostic-20260915"

permissions:
  contents: write

jobs:
  append-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Append canonical negative-result record once
        shell: bash
        run: |
          set -euo pipefail
          marker="RV01 R01-16 post-hoc delay measurement-validity diagnostic"
          if grep -Fq "${marker}" docs/RESULTS_LEDGER.md; then
            echo "ledger marker already present"
            exit 0
          fi
          cat >> docs/RESULTS_LEDGER.md <<'EOF'

## 2026-09-15 — RV01 R01-16 post-hoc delay measurement-validity diagnostic

- Status: post-hoc exposed-development diagnostic from already-consumed immutable R01-16 capability evidence; no rerun, rescore, new experiment identity, held-out execution, or formal authority.
- Fixed evidence: authoritative source `02b3d80744d0eb10cb0d90fc38d3c55729d7ab99`; capability identity `rv01-r01-16-capability-02b3d80744d0eb10-65ebe33d70af`; preserve ref `preserve/rv01-r01-16-capability-20260915` at `0a25eac227d7ac0e8dbd5532d450ed2d50efa105`; raw artifact SHA-256 `e3b6e8c7ed6db423919c4360a5291ac207544566beb4656954be344cb253f335`; immutable capability suite hash `c5c5e32160b634680ff5cad726365c38ec3d06c266cc453fcf349d604ee48ffc`.
- Historical frozen classifications remain unchanged: Weight `WEIGHT_SUPPORTED` (100/100 support); Delay `DELAY_MIXED` (0 support / 54 negative / 46 discordant); Combined `COMBINED_SUPPORTED` (100/100 support).
- Measurement-validity finding: R01-16 initialized physical delay from the same `world.lag_ms` used as training-pulse spacing, while the learner moves delay toward that observed lag. The intended schedule therefore supplied essentially zero nontrivial delay-learning error, and delay eligibility used exact `post_delay != pre_delay` rather than a meaningful tolerance.
- Preserved raw audit: realized absolute delay movement was only floating-point roundoff scale (maximum about `1.03e-11 ms`, mean about `1.32e-12 ms`, median about `6.95e-13 ms`), while learned weight movement was macroscopic relative to the `0.05` initial weight.
- Interpretation: R01-16 strongly supports the learned-weight contribution at the development endpoint; the delay mechanism is **unresolved** by R01-16. The 46 delay-discordant cells must not be used as evidence for substantive learned-delay expression or weight-gated delay plasticity; they are compatible with microscopic timestamp/tie-order sensitivity or another downstream numerical/event-order effect.
- Boundary: this negative measurement-validity finding does not modify the consumed R01-16 protocol or artifacts. The next valid test must use a distinct prospective identity with initial physical delay meaningfully separated from training lag, tolerance-aware delay eligibility, and an orthogonal timing/trajectory endpoint.
EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RESULTS_LEDGER.md
          git commit -m "docs(rv01): record R01-16 delay measurement validity [ledger-bot]"
          git push origin "HEAD:${GITHUB_REF}"
