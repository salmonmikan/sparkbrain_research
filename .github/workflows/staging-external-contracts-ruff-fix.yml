name: staging-external-contracts-ruff-fix

on:
  push:
    branches: ["v06-capability-staging-20260830"]
    paths: [".github/workflows/staging-external-contracts-ruff-fix.yml"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v06-capability-staging-20260830
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply Ruff fixes
        run: |
          python -m pip install "ruff>=0.9"
          python -m ruff check --fix \
            src/sparkbrain/evaluation/v06_confirmatory_external_freeze.py \
            src/sparkbrain/evaluation/v06_confirmatory_external_launch_gate.py \
            src/sparkbrain/evaluation/v06_confirmatory_external_raw_store.py \
            tests/v06/test_confirmatory_external_control_plane.py \
            tests/v06/test_confirmatory_external_raw_store.py
      - name: Commit fixes when needed
        run: |
          if git diff --quiet; then
            echo "No Ruff changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/sparkbrain/evaluation/v06_confirmatory_external_freeze.py \
            src/sparkbrain/evaluation/v06_confirmatory_external_launch_gate.py \
            src/sparkbrain/evaluation/v06_confirmatory_external_raw_store.py \
            tests/v06/test_confirmatory_external_control_plane.py \
            tests/v06/test_confirmatory_external_raw_store.py
          git commit -m "style(v06): normalize external confirmatory contracts [skip ci]"
          git push origin HEAD:v06-capability-staging-20260830
