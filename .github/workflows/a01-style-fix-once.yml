name: A01 Style Fix Once

on:
  push:
    branches:
      - "research/v061-a01-mechanism-discrimination"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v061-a01-mechanism-discrimination

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install "ruff==0.16.6"

      - name: Apply mechanical style-only corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/sparkbrain/v061_a01/mechanism_discrimination.py")
          content = path.read_text(encoding="utf-8")
          old = (
              '            "classification. It replaces only A01\'s path-attached support record, '
              'as preregistered N1."\n'
          )
          new = (
              '            "classification. It replaces only A01\'s path-attached support record, "\n'
              '            "as preregistered N1."\n'
          )
          if old not in content:
              raise SystemExit("expected long-line source text was not found")
          path.write_text(content.replace(old, new, 1), encoding="utf-8")
          PY
          ruff check --fix \
            src/sparkbrain/v061_a01/mechanism_discrimination.py \
            scripts/run_v061_a01_mechanism_discrimination.py \
            tests/v06/test_a01_mechanism_discrimination.py
          ruff check \
            src/sparkbrain/v061_a01/mechanism_discrimination.py \
            scripts/run_v061_a01_mechanism_discrimination.py \
            tests/v06/test_a01_mechanism_discrimination.py

      - name: Commit style-only correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/sparkbrain/v061_a01/mechanism_discrimination.py \
            scripts/run_v061_a01_mechanism_discrimination.py \
            tests/v06/test_a01_mechanism_discrimination.py
          if git diff --cached --quiet; then
            echo "No correction needed"
            exit 0
          fi
          git commit -m "style(a01): apply mechanical ruff corrections"
          git push origin HEAD:research/v061-a01-mechanism-discrimination
