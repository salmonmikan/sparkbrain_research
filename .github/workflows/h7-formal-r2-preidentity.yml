name: h7-formal-r2-preidentity

on:
  push:
    branches:
      - research/main-h7-formal-r2-input-split-r75-cycle8

jobs:
  preidentity:
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install frozen package surface
        run: python -m pip install -e ".[dev,learned,spiking]"
      - name: Non-result preidentity manifests
        run: python scripts/build_h7_formal_r2_preidentity_manifests.py --output-dir artifacts/formal_h7_r2/preidentity_ci
      - name: Confirm protected result surface remains untouched
        run: |
          test ! -e artifacts/formal_h7_r2/preidentity_ci/raw.jsonl
          test ! -e artifacts/formal_h7_r2/preidentity_ci/score.json
      - uses: actions/upload-artifact@v4
        with:
          name: h7-formal-r2-preidentity-${{ github.sha }}
          path: artifacts/formal_h7_r2/preidentity_ci/
          if-no-files-found: error
          retention-days: 90
