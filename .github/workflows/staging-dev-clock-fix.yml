name: staging-dev-clock-fix

on:
  push:
    branches: ["v06-capability-staging-20260830"]
    paths: [".github/workflows/staging-dev-clock-fix.yml"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v06-capability-staging-20260830
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fix nonuniform episode clock and import audit
        run: |
          python - <<'PY'
          from pathlib import Path

          primary = Path("src/sparkbrain/evaluation/v06_confirmatory_heldout_primary.py")
          text = primary.read_text(encoding="utf-8")
          old = "            start_ms=100.0 + episode * parameters.episode_spacings_ms[episode],"
          new = """            start_ms=100.0
            + sum(
                parameters.episode_spacings_ms[
                    prior % len(parameters.episode_spacings_ms)
                ]
                for prior in range(episode)
            ),"""
          if text.count(old) != 1:
              raise SystemExit("unexpected internal-only clock source shape")
          primary.write_text(text.replace(old, new), encoding="utf-8")

          test = Path("tests/v06/test_capability_staging_development_fixture.py")
          text = test.read_text(encoding="utf-8")
          text = text.replace("import hashlib\n", "import ast\nimport hashlib\n", 1)
          old = '''def test_development_fixture_test_imports_no_candidate_world_builder() -> None:
    source = Path(__file__).read_text(encoding="utf-8")
    assert "v06_confirmatory_heldout_spec" not in source
    assert "heldout_world_parameters" not in source
    assert "build_heldout_world_grid" not in source
    assert "HELDOUT_SEEDS" not in source
    assert "WORLD_GENERATION_ID" not in source
'''
          new = '''def test_development_fixture_test_imports_no_candidate_world_builder() -> None:
    tree = ast.parse(Path(__file__).read_text(encoding="utf-8"))
    imported_modules = {
        node.module or ""
        for node in ast.walk(tree)
        if isinstance(node, ast.ImportFrom)
    }
    imported_names = {
        alias.name
        for node in ast.walk(tree)
        if isinstance(node, ast.ImportFrom)
        for alias in node.names
    }
    assert not any(
        module.endswith("v06_confirmatory_heldout_spec")
        for module in imported_modules
    )
    assert {
        "HELDOUT_SEEDS",
        "WORLD_GENERATION_ID",
        "build_heldout_world_grid",
        "heldout_world_parameters",
    }.isdisjoint(imported_names)
'''
          if text.count(old) != 1:
              raise SystemExit("unexpected candidate-import audit source shape")
          test.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Apply Ruff
        run: |
          python -m pip install "ruff>=0.9"
          python -m ruff check --fix \
            src/sparkbrain/evaluation/v06_confirmatory_heldout_primary.py \
            src/sparkbrain/evaluation/v06_confirmatory_heldout_comparators.py \
            tests/v06/test_capability_staging_development_fixture.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/sparkbrain/evaluation/v06_confirmatory_heldout_primary.py \
            src/sparkbrain/evaluation/v06_confirmatory_heldout_comparators.py \
            tests/v06/test_capability_staging_development_fixture.py
          git commit -m "fix(v06): support nonuniform development capability clocks [skip ci]"
          git push origin HEAD:v06-capability-staging-20260830
