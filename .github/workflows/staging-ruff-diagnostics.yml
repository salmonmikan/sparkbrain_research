name: staging-ruff-diagnostics

on:
  push:
    branches: ["v06-capability-staging-20260830"]
    paths:
      - ".github/workflows/staging-ruff-diagnostics.yml"

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          python -m ruff check . --output-format=concise > /tmp/ruff-diagnostics.txt 2>&1
          status=$?
          set -e
          mkdir -p .github/confirmatory
          if [[ ${status} -eq 0 ]]; then
            printf 'PASS\n' > .github/confirmatory/ruff-diagnostics.txt
          else
            cp /tmp/ruff-diagnostics.txt .github/confirmatory/ruff-diagnostics.txt
          fi
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/confirmatory/ruff-diagnostics.txt
          git commit -m "chore(v06): record ruff diagnostics"
          git push origin HEAD:v06-capability-staging-20260830
