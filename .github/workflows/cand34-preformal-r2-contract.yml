name: cand34-preformal-r2-contract

on:
  push:
    branches:
      - research/main-cand34-assembly-route-preformal-r92-cycle4

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify exact R1 ancestry
        run: git merge-base --is-ancestor 2de73b9d0f21a2e8f07b43ca517b5247e6a7dfd0 HEAD
      - name: Run R2 non-result closure tests
        run: >-
          python -m pytest -q
          tests/test_v05_route_architecture.py
          tests/test_v05_route_architecture_contract.py
          tests/test_v05_route_preformal.py
          tests/test_v05_route_preformal_r2.py
      - name: Materialize R2 closure and one fresh queue entry
        run: python scripts/cand34_preformal_r2_contract.py --output-dir cand34-r2
      - name: Upload R2 non-result contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: cand34-preformal-r2-contract-${{ github.sha }}
          path: cand34-r2
          if-no-files-found: error
