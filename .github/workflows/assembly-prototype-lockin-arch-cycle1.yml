name: Assembly prototype lock-in Architecture cycle 1

on:
  push:
    branches:
      - research/main-assembly-prototype-lockin-arch-study-20260919
    paths:
      - analysis/architecture/assembly_prototype_lockin_cycle1_contract_20260919.json
      - analysis/architecture/assembly_prototype_lockin_cycle1_20260919.py
      - .github/workflows/assembly-prototype-lockin-arch-cycle1.yml

permissions:
  contents: read

concurrency:
  group: assembly-prototype-lockin-arch-cycle1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-head-ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact head and main ancestry
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor ebed6abfa941c83b36d2e3bddd04e7c5fb0dbe9d HEAD
      - name: Install repository CI dependencies
        run: python -m pip install -e '.[dev,learned,spiking]'
      - name: Compile and lint Architecture harness
        run: |
          python -m py_compile analysis/architecture/assembly_prototype_lockin_cycle1_20260919.py
          ruff check analysis/architecture/assembly_prototype_lockin_cycle1_20260919.py
      - name: Run ordinary repository tests
        run: python -m pytest
      - name: Verify prospective binding
        run: |
          python analysis/architecture/assembly_prototype_lockin_cycle1_20260919.py --preflight-only

  architecture-study:
    needs: exact-head-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact head and main ancestry again
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor ebed6abfa941c83b36d2e3bddd04e7c5fb0dbe9d HEAD
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Preflight before outcome-bearing execution
        run: |
          python analysis/architecture/assembly_prototype_lockin_cycle1_20260919.py --preflight-only
      - name: Execute one DEV-only NON_EVIDENTIARY Architecture cycle
        run: |
          python analysis/architecture/assembly_prototype_lockin_cycle1_20260919.py \
            --output-dir run-artifacts/assembly-prototype-lockin-cycle1
      - name: Upload raw-before-summary Architecture artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assembly-prototype-lockin-cycle1-${{ github.sha }}
          path: run-artifacts/assembly-prototype-lockin-cycle1
          if-no-files-found: error
          retention-days: 30
