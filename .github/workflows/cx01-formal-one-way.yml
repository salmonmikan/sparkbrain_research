name: cx01-formal-one-way
run-name: cx01-formal-${{ inputs.candidate_spec_hash }}-${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact frozen source Git SHA"
        required: true
        type: string
      candidate_spec_hash:
        description: "Exact SHA-256 of candidate.json canonical state"
        required: true
        type: string
      control_branch:
        description: "Dedicated branch containing candidate, freeze, seal, and STARTED marker"
        required: true
        type: string
      candidate_path:
        description: "Candidate JSON path on control branch"
        required: true
        default: "cx01-control/candidate.json"
        type: string
      manifest_path:
        description: "Freeze manifest path on control branch"
        required: true
        default: "cx01-control/freeze_manifest.json"
        type: string
      seal_path:
        description: "Execution seal path on control branch"
        required: true
        default: "cx01-control/execution_seal.json"
        type: string
      control_marker_path:
        description: "Precommitted one-way STARTED marker path"
        required: true
        default: "cx01-control/STARTED.json"
        type: string
      artifact_root:
        description: "Exact artifact root frozen into the manifest"
        required: true
        default: "/tmp/cx01-formal"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      CONTROL_DIR: ${{ github.workspace }}/control
      SOURCE_DIR: ${{ github.workspace }}/source
      FORMAL_RUN_NAME: cx01-formal-${{ inputs.candidate_spec_hash }}-${{ inputs.source_sha }}
    steps:
      - name: Checkout preconsumed control branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.control_branch }}
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Require complete precommitted control package
        env:
          CANDIDATE_PATH: ${{ inputs.candidate_path }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          SEAL_PATH: ${{ inputs.seal_path }}
          CONTROL_MARKER_PATH: ${{ inputs.control_marker_path }}
        run: |
          test -f "$CONTROL_DIR/$CANDIDATE_PATH"
          test -f "$CONTROL_DIR/$MANIFEST_PATH"
          test -f "$CONTROL_DIR/$SEAL_PATH"
          test -f "$CONTROL_DIR/$CONTROL_MARKER_PATH"

      - name: Verify candidate hash input before capability
        env:
          CANDIDATE_PATH: ${{ inputs.candidate_path }}
          EXPECTED_CANDIDATE_HASH: ${{ inputs.candidate_spec_hash }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["CONTROL_DIR"]) / os.environ["CANDIDATE_PATH"]
          value = json.loads(path.read_text(encoding="utf-8"))
          encoded = json.dumps(
              value,
              allow_nan=False,
              ensure_ascii=False,
              separators=(",", ":"),
              sort_keys=True,
          ).encode("utf-8")
          observed = hashlib.sha256(encoded).hexdigest()
          expected = os.environ["EXPECTED_CANDIDATE_HASH"].lower()
          if observed != expected:
              raise SystemExit(
                  f"candidate specification hash mismatch: observed={observed} expected={expected}"
              )
          PY

      - name: Reject any prior formal workflow run for this candidate/source key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/cx01-formal-one-way.yml/runs?event=workflow_dispatch&per_page=100" \
            > /tmp/cx01-runs.json
          python - <<'PY'
          import json
          import os

          with open("/tmp/cx01-runs.json", encoding="utf-8") as handle:
              runs = json.load(handle)["workflow_runs"]
          current = int(os.environ["GITHUB_RUN_ID"])
          name = os.environ["FORMAL_RUN_NAME"]
          prior = [
              row
              for row in runs
              if row["id"] != current and row.get("display_title") == name
          ]
          if prior:
              raise SystemExit(
                  f"formal candidate/source key already has a previous workflow run: {prior[0]['id']}"
              )
          PY

      - name: Checkout exact frozen source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source identity and cleanliness
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git -C "$SOURCE_DIR" status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: source/pyproject.toml

      - name: Install exact frozen source
        run: python -m pip install -e "$SOURCE_DIR"

      - name: Execute sealed preconsumed candidate exactly once
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_PATH: ${{ inputs.candidate_path }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          SEAL_PATH: ${{ inputs.seal_path }}
          CONTROL_MARKER_PATH: ${{ inputs.control_marker_path }}
          ARTIFACT_ROOT: ${{ inputs.artifact_root }}
        run: >-
          python -m sparkbrain.comparison.cx01.formal
          --candidate "$CONTROL_DIR/$CANDIDATE_PATH"
          --manifest "$CONTROL_DIR/$MANIFEST_PATH"
          --seal "$CONTROL_DIR/$SEAL_PATH"
          --control-marker "$CONTROL_DIR/$CONTROL_MARKER_PATH"
          --source-sha "$SOURCE_SHA"
          --artifact-root "$ARTIFACT_ROOT"

      - name: Score only after immutable raw completion
        env:
          CANDIDATE_PATH: ${{ inputs.candidate_path }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          ARTIFACT_ROOT: ${{ inputs.artifact_root }}
        run: >-
          python -m sparkbrain.comparison.cx01.formal_scoring
          --candidate "$CONTROL_DIR/$CANDIDATE_PATH"
          --manifest "$CONTROL_DIR/$MANIFEST_PATH"
          --artifact-root "$ARTIFACT_ROOT"

      - name: Upload formal evidence, raw partials, or failure markers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cx01-formal-${{ inputs.source_sha }}-${{ github.run_id }}
          path: ${{ inputs.artifact_root }}
          if-no-files-found: warn

# This workflow has read-only repository permissions. It can execute only after
# a persistent STARTED marker has already been committed to a dedicated control
# branch by a separate pre-execution operation. The run identity is bound to the
# candidate specification hash and frozen source SHA, so copying the same
# candidate to another control branch does not create a new execution identity.
