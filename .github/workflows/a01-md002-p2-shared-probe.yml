name: A01 MD-002 P2 Shared Probe

on:
  push:
    branches:
      - "control/a01-md002-p2-shared-probe-started-20260915"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Guard exact one-way source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "${GITHUB_REF_NAME}" = "control/a01-md002-p2-shared-probe-started-20260915"
          frozen=$(git ls-remote origin refs/heads/freeze/a01-md002-p2-shared-probe-source-20260915 | awk '{print $1}')
          test -n "$frozen"
          test "$frozen" = "${GITHUB_SHA}"

      - name: Install
        run: python -m pip install -e ".[dev,learned,spiking]"

      - name: Validate prospective probe package
        run: |
          ruff check src/sparkbrain/v061_a01/md002_p2_shared_probe.py scripts/run_v061_a01_md002_p2_shared_probe.py tests/test_v061_a01_md002_p2_shared_probe.py
          pytest -q tests/test_v061_a01_md002_p2_shared_probe.py

      - name: Execute development-only shared-root probe exactly once
        run: |
          mkdir -p artifacts/v061/a01/md002-p2
          python scripts/run_v061_a01_md002_p2_shared_probe.py \
            --source-sha "${GITHUB_SHA}" \
            --output artifacts/v061/a01/md002-p2/shared_probe.json \
            | tee artifacts/v061/a01/md002-p2/shared_probe.stdout.json
          sha256sum artifacts/v061/a01/md002-p2/shared_probe.json \
            | tee artifacts/v061/a01/md002-p2/shared_probe.sha256

      - name: Upload immutable raw development evidence
        uses: actions/upload-artifact@v4
        with:
          name: a01-md002-p2-shared-probe-${{ github.sha }}
          path: artifacts/v061/a01/md002-p2/
          if-no-files-found: error
          retention-days: 90
