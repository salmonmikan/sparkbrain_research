name: v061-verify-anonymous-credit-protocol

on:
  push:
    branches:
      - v061-candidate-003-failure-diagnostics-work
    paths:
      - .github/workflows/v061-verify-anonymous-credit-protocol.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v061-candidate-003-failure-diagnostics-work
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Normalize and verify protocol source
        run: |
          python -m ruff format \
            src/sparkbrain/evaluation/v061_anonymous_credit_diagnostic_protocol.py \
            tests/v06/test_anonymous_credit_diagnostic_protocol.py
          python -m ruff check --fix \
            src/sparkbrain/evaluation/v061_anonymous_credit_diagnostic_protocol.py \
            tests/v06/test_anonymous_credit_diagnostic_protocol.py
          python -m ruff check \
            src/sparkbrain/evaluation/v061_anonymous_credit_diagnostic_protocol.py \
            tests/v06/test_anonymous_credit_diagnostic_protocol.py
          python -m pytest -q tests/v06/test_anonymous_credit_diagnostic_protocol.py

      - name: Commit normalized protocol if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/sparkbrain/evaluation/v061_anonymous_credit_diagnostic_protocol.py \
            tests/v06/test_anonymous_credit_diagnostic_protocol.py
          if git diff --cached --quiet; then
            echo "Protocol source already normalized."
            exit 0
          fi
          git commit -m "style(v061): normalize causal-credit protocol [skip ci]"
          git pull --rebase origin v061-candidate-003-failure-diagnostics-work
          git push origin HEAD:v061-candidate-003-failure-diagnostics-work
