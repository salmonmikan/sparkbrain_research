name: C19-R1 successor-v2 pre-START readiness

on:
  push:
    branches:
      - "research/c19-r1-revision-authority-runtime-closed-v2-20260918"
    paths:
      - "configs/external_validation/c19_r1_execution_authority.json"
      - "scripts/run_c19_r1_official_v2.py"
      - ".github/workflows/c19-r1-prestart.yml"
      - ".github/workflows/c19-r1-one-way.yml"

permissions:
  contents: read

jobs:
  prestart:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install exact successor-v2 runtime
        run: |
          set -euo pipefail
          test "$(python -c 'import platform; print(platform.python_version())')" = '3.11.16'
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,learned]"
          python - <<'PY'
          import numpy
          import torch
          assert numpy.__version__ == '2.4.6', numpy.__version__
          assert torch.__version__ == '2.13.0+cu130', torch.__version__
          print('numpy', numpy.__version__)
          print('torch', torch.__version__)
          PY

      - name: Lint successor admission wrapper
        run: |
          python -m ruff check scripts/run_c19_r1_official_v2.py

      - name: Re-run frozen R1 unit and synthetic contract checks
        run: |
          python -m pytest -q tests/test_c19_r1_revision_authority.py
          python scripts/check_c19_r1_prestart.py | tee "${RUNNER_TEMP}/r1-prestart.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          value = json.loads(Path(os.environ['RUNNER_TEMP'], 'r1-prestart.json').read_text())
          assert value['official_data_accessed'] is False
          assert value['official_execution_allowed'] is False
          assert value['status'] == 'R1_PRE_START_READY_FOR_ANALYST_REVIEW'
          assert value['synthetic_atomic_idx_source_map_sha256'] == '1eb547f6505dc5e86bcdbac7efe72c5c80e22b6614dc6a08af7089bb942da2a9'
          assert value['synthetic_raw_sha256'] == '23a8389d7304568c2ff50e868e34e69256ab60f122bc37c826e915b576a55406'
          assert value['synthetic_records'] == 8720
          PY

      - name: Validate frozen science and successor-v2 execution authority
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          basis = '7197ab0f9683616858859446ae9eed7b75707f25'
          analyst = '966018058f296098805982a8d206102741c3842c'
          authority = json.loads(
              Path('configs/external_validation/c19_r1_execution_authority.json').read_text()
          )
          assert authority['state'] == 'EXECUTION_AUTHORIZED'
          assert authority['execution_allowed'] is True
          assert authority['execution_limit'] == 1
          assert authority['no_retry_after_started'] is True
          assert authority['evidence_analyst_commit'] == analyst
          assert authority['consumed_v1_package_commit'] == basis
          assert authority['scientific_protocol_id'] == 'c19-r1-revision-authority-protocol-v1'
          assert authority['execution_protocol_id'] == 'c19-r1-revision-authority-protocol-v2'
          assert authority['run_identity'] == 'c19-r1-revision-authority-official-v2'
          assert authority['atomic_idx_source_map_sha256'] == (
              'cb3ca63703bdab4107e896884908817680dd4fe4b5eebc32b6219075f0187bbb'
          )

          manifest_payload = json.dumps(
              authority['runtime_manifest'], sort_keys=True, separators=(',', ':')
          ).encode()
          assert hashlib.sha256(manifest_payload).hexdigest() == authority['runtime_manifest_sha256']
          assert authority['runtime_manifest_sha256'] == (
              'cdb7a2a075f76d4b65b51fc7d0b46f7ecda98646e33902420b2a7e5b7d604fc5'
          )

          def git(*args: str) -> str:
              return subprocess.run(
                  ['git', *args], check=True, capture_output=True, text=True
              ).stdout.strip()

          assert git(
              'rev-parse', 'HEAD:configs/external_validation/c19_r1_revision_authority.json'
          ) == authority['scientific_contract']['blob_sha']
          assert git(
              'rev-parse', 'HEAD:src/sparkbrain/v03_external_validation/c19_r1_protocol.py'
          ) == authority['scientific_protocol_source']['blob_sha']
          assert git(
              'rev-parse', 'HEAD:docs/research/c19_r1_revision_authority_preregistration.md'
          ) == authority['preregistration']['blob_sha']

          changed = set(git('diff', '--name-only', f'{basis}..HEAD').splitlines())
          assert changed == set(authority['allowed_successor_paths']), changed

          readiness = authority['runtime_readiness']
          assert readiness['status'] == 'PASS'
          assert readiness['readiness_commit'] == 'f5f0f7abd02372954aa8edcf10b6c15f9644c122'
          assert readiness['dedicated_workflow_run_id'] == 35254816937
          assert readiness['ordinary_ci_run_id'] == 35254816864

          v4 = authority['v4_read_only_binding']
          for key in ('package_commit', 'preserve_commit', 'evidence_commit'):
              git('cat-file', '-e', f"{v4[key]}^{{commit}}")
          print('successor-v2 authority is operational-only; frozen science blobs unchanged')
          PY

      - name: Network-blocked successor production import smoke
        run: |
          set -euo pipefail
          python - <<'PY'
          import runpy
          import socket
          from unittest.mock import patch

          def blocked(*args, **kwargs):
              raise RuntimeError('network disabled by C19-R1 successor-v2 pre-START smoke')

          with patch.object(socket, 'create_connection', blocked), patch.object(
              socket.socket, 'connect', blocked
          ):
              namespace = runpy.run_path(
                  'scripts/run_c19_r1_official_v2.py',
                  run_name='c19_r1_v2_runtime_import_probe',
              )
          assert 'acquire_raw' in namespace
          assert 'score_preserved' in namespace
          assert namespace['EXECUTION_PROTOCOL_ID'] == 'c19-r1-revision-authority-protocol-v2'
          assert namespace['RUN_IDENTITY'] == 'c19-r1-revision-authority-official-v2'
          print('network-blocked successor-v2 production import succeeded')
          PY

      - name: Assert exact successor-v2 namespaces remain fresh
        run: |
          set -euo pipefail
          STARTED_REF='control/c19-r1-revision-authority-started-v2-20260918'
          PRESERVE_REF='preserve/c19-r1-revision-authority-raw-c19-r1-revision-authority-official-v2'
          EVIDENCE_TAG='evidence/c19-r1-revision-authority-c19-r1-revision-authority-official-v2'
          if git ls-remote --exit-code --heads origin "${STARTED_REF}" >/dev/null 2>&1; then
            echo 'successor-v2 STARTED collision' >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "${PRESERVE_REF}" >/dev/null 2>&1; then
            echo 'successor-v2 preserve collision' >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${EVIDENCE_TAG}" >/dev/null 2>&1; then
            echo 'successor-v2 evidence collision' >&2
            exit 1
          fi
          echo 'successor-v2 namespaces fresh'
