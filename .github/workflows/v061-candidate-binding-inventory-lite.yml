name: v061-candidate-binding-inventory-lite

on:
  push:
    branches:
      - v061-timing-contract-correction-20260831
    paths:
      - .github/workflows/v061-candidate-binding-inventory-lite.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v061-timing-contract-correction-20260831
          fetch-depth: 1
          lfs: false

      - name: Inventory candidate and held-out bindings
        shell: bash
        run: |
          set -euo pipefail
          git grep -n -E \
            'candidate-002|WORLD_GENERATION_ID|HELDOUT_SEEDS|build_heldout_world_grid|heldout_world_parameters' \
            -- '*.py' '*.yml' '*.yaml' '*.md' \
            | tee candidate-binding-inventory.txt

      - uses: actions/upload-artifact@v4
        with:
          name: v061-candidate-binding-inventory-lite-${{ github.run_id }}
          path: candidate-binding-inventory.txt
          compression-level: 0
          retention-days: 7
