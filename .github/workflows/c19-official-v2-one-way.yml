name: C19 official-v2 one-way
run-name: c19-official-v2-${{ github.ref_name }}

on:
  push:
    branches:
      - "control/c19-official-v2-started-*"
    paths:
      - "artifacts/v03/c19_external_validation/v2/official_v2/STARTED.json"

permissions:
  contents: write

jobs:
  one-way:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout STARTED control ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Validate one-way STARTED marker and collision state
        id: started
        env:
          STARTED_PATH: artifacts/v03/c19_external_validation/v2/official_v2/STARTED.json
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = '1'
          case "${GITHUB_REF_NAME}" in
            control/c19-official-v2-started-*) ;;
            *) echo 'unexpected STARTED ref namespace' >&2; exit 1 ;;
          esac
          python - <<'PY' > /tmp/started.env
          import json
          import os
          import re
          from pathlib import Path

          path = Path(os.environ['STARTED_PATH'])
          value = json.loads(path.read_text(encoding='utf-8'))
          required = {
              'state': 'STARTED',
              'protocol_id': 'c19-external-v2-official-protocol-v2',
              'run_identity': 'c19-external-v2-official-v2',
              'no_retry': True,
          }
          for key, expected in required.items():
              if value.get(key) != expected:
                  raise SystemExit(f'STARTED marker mismatch: {key}')
          for key in ('evidence_analyst_commit', 'exact_package_commit'):
              raw = str(value.get(key, ''))
              if re.fullmatch(r'[0-9a-f]{40}', raw) is None:
                  raise SystemExit(f'invalid STARTED {key}')
              print(f'{key.upper()}={raw}')
          PY
          cat /tmp/started.env >> "${GITHUB_ENV}"
          PACKAGE_COMMIT="$(grep '^EXACT_PACKAGE_COMMIT=' /tmp/started.env | cut -d= -f2)"
          git cat-file -e "${PACKAGE_COMMIT}^{commit}"
          git merge-base --is-ancestor "${PACKAGE_COMMIT}" "${GITHUB_SHA}"
          changed="$(git diff --name-only "${PACKAGE_COMMIT}..${GITHUB_SHA}")"
          test "${changed}" = "${STARTED_PATH}"
          PRESERVE_BRANCH='preserve/c19-official-v2-raw-c19-external-v2-official-v2'
          EVIDENCE_TAG='evidence/c19-official-v2-c19-external-v2-official-v2'
          if git ls-remote --exit-code --heads origin "${PRESERVE_BRANCH}" >/dev/null 2>&1; then
            echo 'raw preservation branch collision after STARTED' >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${EVIDENCE_TAG}" >/dev/null 2>&1; then
            echo 'terminal evidence tag collision after STARTED' >&2
            exit 1
          fi
          echo "PRESERVE_BRANCH=${PRESERVE_BRANCH}" >> "${GITHUB_ENV}"
          echo "EVIDENCE_TAG=${EVIDENCE_TAG}" >> "${GITHUB_ENV}"
          echo "STARTED_REF=${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"

      - name: Checkout exact package commit
        run: |
          set -euo pipefail
          git checkout --detach "${EXACT_PACKAGE_COMMIT}"
          test "$(git rev-parse HEAD)" = "${EXACT_PACKAGE_COMMIT}"

      - name: Set up exact official Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install exact package
        run: |
          set -euo pipefail
          python --version
          test "$(python -c 'import platform; print(platform.python_version())')" = '3.11.16'
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Acquire and verify pinned Belief-R after STARTED
        run: |
          set -euo pipefail
          python scripts/manage_belief_r.py \
            --acquire \
            --cache "${RUNNER_TEMP}/belief_r-test.csv" \
            > "${RUNNER_TEMP}/belief-r-verification.json"

      - name: Execute target-blind acquisition with network blocked
        run: |
          set -euo pipefail
          python scripts/run_c19_official_v2.py acquire-raw \
            --cache "${RUNNER_TEMP}/belief_r-test.csv" \
            --raw "${RUNNER_TEMP}/raw_predictions.jsonl" \
            --manifest "${RUNNER_TEMP}/raw_manifest.json" \
            --analyst-commit "${EVIDENCE_ANALYST_COMMIT}" \
            --package-commit "${EXACT_PACKAGE_COMMIT}" \
            --started-ref "${STARTED_REF}"

      - name: Preserve target-blind raw as exact immutable Git commit
        id: preserve
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create "${PRESERVE_BRANCH}" "${EXACT_PACKAGE_COMMIT}"
          DEST='artifacts/v03/c19_external_validation/v2/official_v2'
          cp "${RUNNER_TEMP}/raw_predictions.jsonl" "${DEST}/raw_predictions.jsonl"
          cp "${RUNNER_TEMP}/raw_manifest.json" "${DEST}/raw_manifest.json"
          git add "${DEST}/raw_predictions.jsonl" "${DEST}/raw_manifest.json"
          git commit -m 'preserve(c19): retain official-v2 target-blind raw'
          PRESERVATION_COMMIT="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${PRESERVE_BRANCH}"
          echo "PRESERVATION_COMMIT=${PRESERVATION_COMMIT}" >> "${GITHUB_ENV}"
          echo "preservation_commit=${PRESERVATION_COMMIT}" >> "${GITHUB_OUTPUT}"

      - name: Re-fetch exact preserved raw before evaluator materialization
        run: |
          set -euo pipefail
          git checkout --detach "${EXACT_PACKAGE_COMMIT}"
          git show "${PRESERVATION_COMMIT}:artifacts/v03/c19_external_validation/v2/official_v2/raw_predictions.jsonl" \
            > "${RUNNER_TEMP}/preserved_raw_predictions.jsonl"
          git show "${PRESERVATION_COMMIT}:artifacts/v03/c19_external_validation/v2/official_v2/raw_manifest.json" \
            > "${RUNNER_TEMP}/preserved_raw_manifest.json"

      - name: Materialize evaluator targets and score only preserved raw
        run: |
          set -euo pipefail
          python scripts/run_c19_official_v2.py score-preserved \
            --cache "${RUNNER_TEMP}/belief_r-test.csv" \
            --raw "${RUNNER_TEMP}/preserved_raw_predictions.jsonl" \
            --manifest "${RUNNER_TEMP}/preserved_raw_manifest.json" \
            --output "${RUNNER_TEMP}/terminal_evidence" \
            --analyst-commit "${EVIDENCE_ANALYST_COMMIT}" \
            --package-commit "${EXACT_PACKAGE_COMMIT}" \
            --preservation-commit "${PRESERVATION_COMMIT}"

      - name: Create terminal evidence commit and annotated authority tag
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create c19-official-v2-terminal-evidence "${EXACT_PACKAGE_COMMIT}"
          DEST='artifacts/v03/c19_external_validation/v2/official_v2/evidence'
          mkdir -p "${DEST}"
          cp "${RUNNER_TEMP}/terminal_evidence/"*.json "${DEST}/"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          dest = Path('artifacts/v03/c19_external_validation/v2/official_v2/evidence')
          value = {
              'schema_version': '1',
              'state': 'TERMINAL_EVIDENCE',
              'protocol_id': 'c19-external-v2-official-protocol-v2',
              'run_identity': 'c19-external-v2-official-v2',
              'evidence_analyst_commit': os.environ['EVIDENCE_ANALYST_COMMIT'],
              'exact_package_commit': os.environ['EXACT_PACKAGE_COMMIT'],
              'started_ref': os.environ['STARTED_REF'],
              'raw_preservation_commit': os.environ['PRESERVATION_COMMIT'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
          }
          (dest / 'evidence_manifest.json').write_text(
              json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          git add "${DEST}"
          git commit -m 'evidence(c19): finalize official-v2 terminal evidence'
          EVIDENCE_COMMIT="$(git rev-parse HEAD)"
          git tag -a "${EVIDENCE_TAG}" "${EVIDENCE_COMMIT}" \
            -m "C19 official-v2 terminal evidence; identity c19-external-v2-official-v2"
          git push origin "refs/tags/${EVIDENCE_TAG}"
          echo "EVIDENCE_COMMIT=${EVIDENCE_COMMIT}" >> "${GITHUB_ENV}"

      - name: Upload non-text diagnostics for post-START audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c19-official-v2-run-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 90
          path: |
            ${{ runner.temp }}/belief-r-verification.json
            ${{ runner.temp }}/raw_manifest.json
            ${{ runner.temp }}/preserved_raw_manifest.json
            ${{ runner.temp }}/terminal_evidence/*.json
