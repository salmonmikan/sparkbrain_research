name: ci

on:
  push:
    paths-ignore:
      - ".github/confirmatory/**"
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,learned,spiking]"
      - name: Lint
        run: python -m ruff check .
      - name: Local readiness
        run: python scripts/local_readiness_check.py
      - name: Test
        run: python -m pytest -q
      - name: Validate bundle
        run: python scripts/validate_bundle.py
      - name: R01-12E held-out freeze preflight
        if: >-
          github.ref == 'refs/heads/research/rv01-endogenous-transition' &&
          matrix.python-version == '3.11'
        run: >-
          python scripts/run_rv01_r01_12e_preflight.py
          --output artifacts/research/rv01/r01_12e/heldout_freeze_preflight.json
          --source-git-sha "$GITHUB_SHA"
      - name: Upload R01-12E held-out freeze preflight
        if: >-
          github.ref == 'refs/heads/research/rv01-endogenous-transition' &&
          matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: rv01-r01-12e-preflight-${{ github.sha }}
          path: artifacts/research/rv01/r01_12e/heldout_freeze_preflight.json
          if-no-files-found: error
