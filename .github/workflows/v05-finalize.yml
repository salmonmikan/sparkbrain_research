name: finalize-v05

on:
  push:
    branches: [v05]
    paths:
      - .github/workflows/v05-finalize.yml

permissions:
  contents: write

concurrency:
  group: finalize-v05
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v05
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Remove transfer-only staging files
        run: |
          rm -rf .v05_payload .v05_final_payload

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Compile and lint v0.5
        run: |
          python -m compileall -q src/sparkbrain/v05 tests/v05
          python -m ruff check src/sparkbrain/v05 tests/v05 scripts/run_v05_experiments.py examples/v05_assembly_demo.py

      - name: Focused regression tests
        run: python -m pytest -q tests/v04 tests/v05

      - name: Local readiness
        run: python scripts/local_readiness_check.py

      - name: Run frozen v0.5 confirmatory experiment
        env:
          PYTHONHASHSEED: "0"
        run: |
          python scripts/run_v05_experiments.py \
            --seeds 5501,5502,5503,5504 \
            --output artifacts/v05/reference_results.json \
            --report artifacts/v05/reference_report.md \
            --html artifacts/v05/assembly_visualizer.html

      - name: Write source binding, status, and checksums
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          source_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          result_path = Path("artifacts/v05/reference_results.json")
          payload = json.loads(result_path.read_text(encoding="utf-8"))
          gates = payload.get("gates", {})
          completion = payload.get("completion", "unknown")

          def gate(name: str) -> str:
              value = gates.get(name, {})
              if isinstance(value, dict):
                  return "PASS" if value.get("passed") else "FAIL"
              return "PASS" if value else "FAIL"

          status = f"""# SparkBrain v0.5 status

          Source commit evaluated: `{source_sha}`  
          Completion: **{completion}**

          ## Scientific gates

          | Gate | Result |
          |---|---|
          | A — stable local runtime | {gate('A')} |
          | B — selective temporal Assembly | {gate('B')} |
          | C — held-out reuse | {gate('C')} |
          | D — prediction/action utility | {gate('D')} |
          | E — causal contribution | {gate('E')} |

          ## Interpretation boundary

          This is a controlled, synthetic, pre-semantic local experiment. A passed gate does not establish semantic concepts, organs, consciousness, AGI, biological equivalence, external-task superiority, or physical energy efficiency.

          Failed gates and negative sub-results are retained as first-class results. In particular, omission completion and the necessity of low-level weight/delay plasticity must not be inferred unless the recorded controls support them.
          """
          Path("docs/V05_STATUS.md").write_text(status.replace("          ", "") + "\n", encoding="utf-8")

          binding = f"""# SparkBrain v0.5 source binding

          The checked-in v0.5 reference artifacts were generated from source commit `{source_sha}` on GitHub Actions using Python 3.11 and seeds `5501, 5502, 5503, 5504`.

          Command:

          ```bash
          python scripts/run_v05_experiments.py --seeds 5501,5502,5503,5504
          ```

          The artifact commit is a documentation/result child of that source commit; it does not alter the evaluated runtime before generation.
          """
          Path("docs/V05_SOURCE_BINDING.md").write_text(binding.replace("          ", "") + "\n", encoding="utf-8")

          report = f"""# SparkBrain v0.5 completion report

          ## Outcome

          Completion status: **{completion}**

          v0.5 tested whether repeated unlabeled temporal structure could form reusable and functionally relevant Spark Assemblies. The exact gate outcomes are recorded in `artifacts/v05/reference_results.json` and summarized in `docs/V05_STATUS.md`.

          ## What may be claimed

          Only the gates marked PASS may be described as supported, and only inside the frozen controlled synthetic protocol. Engineering implementation and scientific support remain distinct.

          ## What may not be claimed

          - semantic understanding or grounding;
          - human-like concept formation;
          - organ formation;
          - consciousness or AGI;
          - biological equivalence;
          - external benchmark superiority;
          - physical energy efficiency.

          ## Reproduction

          The experiment is CPU-runnable and local/offline after dependencies are installed. Raw aggregate evidence, report, static visualization, source binding, seeds, and SHA-256 checksums are retained in the repository.
          """
          Path("docs/V05_COMPLETION_REPORT.md").write_text(report.replace("          ", "") + "\n", encoding="utf-8")

          artifact_files = [
              Path("artifacts/v05/reference_results.json"),
              Path("artifacts/v05/reference_report.md"),
              Path("artifacts/v05/assembly_visualizer.html"),
          ]
          checksum_lines = []
          for path in artifact_files:
              checksum_lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          Path("artifacts/v05/SHA256SUMS.txt").write_text("\n".join(checksum_lines) + "\n", encoding="utf-8")
          PY

      - name: Remove obsolete transfer/shard helpers
        run: |
          rm -f scripts/run_v05_shard.py scripts/aggregate_v05_shards.py
          rm -f tests/v05/test_v05_shard_runner.py
          rm -rf artifacts/v05/development_seeds artifacts/v05/retained_seeds artifacts/v05/plasticity_ablations
          rm -f docs/V05_DECISION_ADDENDUM.md docs/V05_RESULTS.md docs/V05_RESULTS_LEDGER_ADDENDUM.md
          rm -f .github/workflows/v05-finalize.yml

      - name: Commit finalized v0.5 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(v05): finalize functional temporal assembly milestone"
          git push origin HEAD:v05
