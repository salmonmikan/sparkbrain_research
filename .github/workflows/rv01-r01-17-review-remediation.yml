name: RV01 R01-17 Review Remediation

on:
  push:
    branches:
      - "research/rv01-r01-17-real-delay-development-20260915"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout remediation trigger
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify reviewed source is an ancestor
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7746e8a57f2d5ed7280888581ad4300e6bd4b482 HEAD

      - name: Apply exact review remediation
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/rv01_r01_17_review_remediation.py
          python .github/scripts/rv01_r01_17_lint_fix.py

      - name: Remove one-shot remediation helpers
        shell: bash
        run: |
          rm .github/workflows/rv01-r01-17-review-remediation.yml
          rm .github/scripts/rv01_r01_17_review_remediation.py
          rm .github/scripts/rv01_r01_17_lint_fix.py

      - name: Install local validation dependencies
        run: python -m pip install -e ".[dev]"

      - name: Format, lint, and run focused tests without real acquisition
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format \
            src/sparkbrain/research/rv01_r01_17_real_delay.py \
            scripts/run_rv01_r01_17_real_delay.py \
            tests/test_rv01_r01_17_real_delay.py
          python -m ruff check --fix \
            src/sparkbrain/research/rv01_r01_17_real_delay.py \
            scripts/run_rv01_r01_17_real_delay.py \
            tests/test_rv01_r01_17_real_delay.py
          python -m ruff check \
            src/sparkbrain/research/rv01_r01_17_real_delay.py \
            scripts/run_rv01_r01_17_real_delay.py \
            tests/test_rv01_r01_17_real_delay.py
          python -m pytest -q tests/test_rv01_r01_17_real_delay.py

      - name: Commit remediation without retaining helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(rv01): close R01-17 freeze-readiness review gaps"
          git push origin HEAD:research/rv01-r01-17-real-delay-development-20260915
