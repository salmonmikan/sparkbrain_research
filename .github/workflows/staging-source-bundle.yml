name: staging-source-bundle

on:
  push:
    branches: ["v06-capability-staging-20260830"]
    paths: [".github/workflows/staging-source-bundle.yml"]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source bundle
        run: |
          tar --exclude=.git --exclude=.pytest_cache -czf /tmp/sparkbrain-staging-source.tar.gz .
      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: sparkbrain-staging-source
          path: /tmp/sparkbrain-staging-source.tar.gz
          if-no-files-found: error
