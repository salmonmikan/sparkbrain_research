name: v061-causal-lineage-audit-correction

on:
  push:
    branches:
      - v061-candidate-003-failure-diagnostics-work
    paths:
      - .github/workflows/v061-causal-lineage-audit-correction.yml

permissions:
  contents: write

jobs:
  correct-and-verify:
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v061-candidate-003-failure-diagnostics-work
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Correct historical return-address semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "src/sparkbrain/evaluation/"
              "v061_causal_lineage_information_audit.py"
          )
          source = path.read_text(encoding="utf-8")
          old = '''    recovers_return_address = bool(reentry_return_addresses)
              information_loss = (
                  boundary_has_lineage
                  and not retains_return_address
                  and not consumes_return_address
                  and not recovers_return_address
              )
          '''
          new = '''    # Re-entry may reference lineage on the *current* boundary event. That
              # does not recover the historical lineage whose externally confirmed relation
              # was compressed into consistency state. Historical recovery is possible only
              # if the consistency carrier retained a return address in the first place.
              references_current_return_address = bool(reentry_return_addresses)
              recovers_return_address = (
                  retains_return_address and references_current_return_address
              )
              information_loss = (
                  boundary_has_lineage
                  and not retains_return_address
                  and not consumes_return_address
              )
          '''
          if source.count(old) != 1:
              raise SystemExit(
                  f"unexpected lineage recovery block count: {source.count(old)}"
              )
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Format and verify corrected source
        run: |
          python -m ruff format \
            src/sparkbrain/evaluation/v061_causal_lineage_information_audit.py
          python -m ruff check --fix \
            src/sparkbrain/evaluation/v061_causal_lineage_information_audit.py
          python -m ruff check \
            src/sparkbrain/evaluation/v061_causal_lineage_information_audit.py
          python -m py_compile \
            src/sparkbrain/evaluation/v061_causal_lineage_information_audit.py

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/sparkbrain/evaluation/v061_causal_lineage_information_audit.py
          if git diff --cached --quiet; then
            echo "Causal-lineage audit already corrected."
            exit 0
          fi
          git commit -m "fix(v061): distinguish current from historical lineage recovery [skip ci]"
          git pull --rebase origin v061-candidate-003-failure-diagnostics-work
          git push origin HEAD:v061-candidate-003-failure-diagnostics-work
