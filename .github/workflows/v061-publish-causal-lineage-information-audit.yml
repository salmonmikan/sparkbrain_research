name: v061-publish-causal-lineage-information-audit

on:
  push:
    branches:
      - v061-candidate-003-failure-diagnostics-work
    paths:
      - .github/workflows/v061-publish-causal-lineage-information-audit.yml

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v061-candidate-003-failure-diagnostics-work
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Normalize and lint D10 audit
        run: |
          python -m ruff format \
            src/sparkbrain/evaluation/v061_causal_lineage_information_audit.py \
            tests/v06/test_causal_lineage_information_audit.py \
            scripts/v061_causal_lineage_information_audit_report.py
          python -m ruff check --fix \
            src/sparkbrain/evaluation/v061_causal_lineage_information_audit.py \
            tests/v06/test_causal_lineage_information_audit.py \
            scripts/v061_causal_lineage_information_audit_report.py
          python -m ruff check \
            src/sparkbrain/evaluation/v061_causal_lineage_information_audit.py \
            tests/v06/test_causal_lineage_information_audit.py \
            scripts/v061_causal_lineage_information_audit_report.py

      - name: Verify information-loss diagnosis
        run: python -m pytest -q tests/v06/test_causal_lineage_information_audit.py

      - name: Materialize D10 report
        run: |
          mkdir -p docs/diagnostics
          python scripts/v061_causal_lineage_information_audit_report.py \
            --root . \
            --json docs/diagnostics/V061_D10_CAUSAL_LINEAGE_INFORMATION_LOSS.json \
            --markdown docs/V061_D10_CAUSAL_LINEAGE_INFORMATION_LOSS.md
          sed -i 's/````/```/g' \
            docs/V061_D10_CAUSAL_LINEAGE_INFORMATION_LOSS.md

      - name: Commit verified D10 diagnosis
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/sparkbrain/evaluation/v061_causal_lineage_information_audit.py \
            tests/v06/test_causal_lineage_information_audit.py \
            scripts/v061_causal_lineage_information_audit_report.py \
            docs/V061_D10_CAUSAL_LINEAGE_INFORMATION_LOSS.md \
            docs/diagnostics/V061_D10_CAUSAL_LINEAGE_INFORMATION_LOSS.json
          if git diff --cached --quiet; then
            echo "D10 audit already published."
            exit 0
          fi
          git commit -m "docs(v061): publish causal lineage information-loss audit [skip ci]"
          git pull --rebase origin v061-candidate-003-failure-diagnostics-work
          git push origin HEAD:v061-candidate-003-failure-diagnostics-work
