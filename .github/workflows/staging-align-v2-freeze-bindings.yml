name: staging-align-v2-freeze-bindings

on:
  push:
    branches: ["v06-capability-staging-20260830"]
    paths:
      - ".github/workflows/staging-align-v2-freeze-bindings.yml"

permissions:
  contents: write

jobs:
  patch-bindings:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Align freeze bundle with v2 execution contracts
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import re
          from pathlib import Path

          path = Path("src/sparkbrain/evaluation/v06_confirmatory_freeze_bundle_v2.py")
          source = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected one literal target, got {count}: {old[:80]!r}")
              source = source.replace(old, new)

          def sub_once(pattern: str, replacement: str) -> None:
              global source
              source, count = re.subn(pattern, replacement, source, flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise SystemExit(f"expected one regex target, got {count}: {pattern[:80]!r}")

          replace_once(
              "from .v06_confirmatory_environment_lock_v2 import ExecutionEnvironmentLockV2\n",
              "from .v06_confirmatory_adapter_registry_v2 import (\n"
              "    ADAPTER_PATHS_V2,\n"
              "    validate_adapter_registry_v2,\n"
              ")\n"
              "from .v06_confirmatory_environment_lock_v2 import ExecutionEnvironmentLockV2\n",
          )
          replace_once(
              "from .v06_confirmatory_resources import ConditionResourceRecord\n"
              "from .v06_confirmatory_training_schedule import build_balanced_training_schedule\n",
              "from .v06_confirmatory_normalized_resource_v2 import (\n"
              "    NormalizedResourceRecordV2,\n"
              "    ResourceDecisionPolicyV2,\n"
              "    normalized_resource_schema_hash_v2,\n"
              ")\n"
              "from .v06_confirmatory_resources import ConditionResourceRecord\n"
              "from .v06_confirmatory_schedule_contract import training_schedule_grid_hash\n",
          )
          replace_once(
              '"src/sparkbrain/evaluation/v06_confirmatory_adapter_registry.py",',
              '"src/sparkbrain/evaluation/v06_confirmatory_adapter_registry_v2.py",',
          )

          contract_paths = """_CONTRACT_SOURCE_PATHS = (
              "src/sparkbrain/evaluation/v06_confirmatory.py",
              "src/sparkbrain/evaluation/v06_confirmatory_current_manifest.py",
              "src/sparkbrain/evaluation/v06_confirmatory_candidate_manifest.py",
              "src/sparkbrain/evaluation/v06_confirmatory_heldout_spec.py",
              "src/sparkbrain/evaluation/v06_confirmatory_resources.py",
              "src/sparkbrain/evaluation/v06_confirmatory_training_schedule.py",
              "src/sparkbrain/evaluation/v06_confirmatory_schedule_contract.py",
              "src/sparkbrain/evaluation/v06_confirmatory_normalized_resource_v2.py",
              "src/sparkbrain/evaluation/v06_confirmatory_environment_lock_v2.py",
              "src/sparkbrain/evaluation/v06_confirmatory_external_freeze.py",
              "src/sparkbrain/evaluation/v06_confirmatory_freeze_bundle_v2.py",
              "src/sparkbrain/evaluation/v06_confirmatory_external_verification_v2.py",
              "src/sparkbrain/evaluation/v06_confirmatory_external_control_package_v2.py",
              "src/sparkbrain/evaluation/v06_confirmatory_external_launch_gate_v2.py",
              "src/sparkbrain/evaluation/v06_confirmatory_execute_external_v2.py",
              "src/sparkbrain/evaluation/v06_confirmatory_external_raw_store.py",
              "src/sparkbrain/evaluation/v06_confirmatory_verify_external_raw_v2.py",
              "src/sparkbrain/evaluation/v06_confirmatory_scoring.py",
              "src/sparkbrain/evaluation/v06_confirmatory_locked_scoring.py",
              "src/sparkbrain/evaluation/v06_confirmatory_score_external_v2.py",
          )
          """
          sub_once(
              r"_CONTRACT_SOURCE_PATHS = \(\n(?:    \"[^\n]+\",\n)+\)\n",
              contract_paths,
          )
          sub_once(
              r"def _combined_schedule_state\(\) -> tuple\[dict\[str, Any\], \.\.\.\]:\n.*?"
              r"def combined_training_schedule_hash\(\) -> str:\n"
              r"    return _digest\(list\(_combined_schedule_state\(\)\)\)\n",
              "def combined_training_schedule_hash() -> str:\n"
              "    return training_schedule_grid_hash()\n",
          )

          old_validation = (
              "        if self.adapter_inventory_hash != _digest(list(self.adapter_inventory)):\n"
              "            raise ValueError(\"adapter inventory hash mismatch\")\n"
          )
          new_validation = old_validation + (
              "        registered_paths = {\n"
              "            condition.value: adapter_path\n"
              "            for condition, adapter_path in ADAPTER_PATHS_V2.items()\n"
              "        }\n"
              "        inventory_paths = {\n"
              "            str(row[\"condition\"]): str(row[\"adapter_path\"])\n"
              "            for row in self.adapter_inventory\n"
              "        }\n"
              "        if inventory_paths != registered_paths:\n"
              "            raise ValueError(\n"
              "                \"frozen adapter paths differ from v2 execution registry\"\n"
              "            )\n"
          )
          replace_once(old_validation, new_validation)

          old_build = (
              "    readiness = assess_confirmatory_readiness(manifest)\n"
              "    adapter_sources = _source_inventory(source, _ADAPTER_SOURCE_PATHS)\n"
          )
          new_build = (
              "    readiness = assess_confirmatory_readiness(manifest)\n"
              "    validate_adapter_registry_v2()\n"
              "    registered_paths = {\n"
              "        row.condition: row.adapter_path for row in manifest.conditions\n"
              "    }\n"
              "    if registered_paths != ADAPTER_PATHS_V2:\n"
              "        raise ValueError(\n"
              "            \"manifest adapter paths differ from v2 execution registry\"\n"
              "        )\n"
              "    adapter_sources = _source_inventory(source, _ADAPTER_SOURCE_PATHS)\n"
          )
          replace_once(old_build, new_build)

          resource_contract = """    resource_policy = ResourceDecisionPolicyV2()
              resource_policy.validate()
              resource_contract_hash = _digest(
                  {
                      "decision_use": "descriptive-only",
                      "normalized_resource_fields": [
                          row.name for row in fields(NormalizedResourceRecordV2)
                      ],
                      "normalized_resource_schema_hash": (
                          normalized_resource_schema_hash_v2()
                      ),
                      "normalized_resource_source": contract_sources[
                          "src/sparkbrain/evaluation/"
                          "v06_confirmatory_normalized_resource_v2.py"
                      ],
                      "policy": resource_policy.state_dict(),
                      "policy_hash": resource_policy.policy_hash(),
                  }
              )
          """
          sub_once(
              r"    resource_contract_hash = _digest\(\n.*?\n    \)\n(?=    layout = ExternalArtifactLayout)",
              resource_contract,
          )

          ast.parse(source)
          path.write_text(source, encoding="utf-8")
          PY
      - name: Validate patched module
        run: |
          python -m compileall -q src/sparkbrain/evaluation/v06_confirmatory_freeze_bundle_v2.py
          python -m ruff check src/sparkbrain/evaluation/v06_confirmatory_freeze_bundle_v2.py
      - name: Commit exact binding repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sparkbrain/evaluation/v06_confirmatory_freeze_bundle_v2.py
          git diff --cached --check
          git commit -m "fix(v06): freeze the exact v2 execution contracts"
          git push origin HEAD:v06-capability-staging-20260830
