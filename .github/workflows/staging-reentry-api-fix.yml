name: staging-reentry-api-fix

on:
  push:
    branches: ["v06-capability-staging-20260830"]
    paths: [".github/workflows/staging-reentry-api-fix.yml"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v06-capability-staging-20260830
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Align RelationReentryConfig argument
        run: >-
          python -c 'from pathlib import Path; p=Path("src/sparkbrain/evaluation/v06_confirmatory_heldout_primary.py"); s=p.read_text(encoding="utf-8"); old="maximum_candidates=8"; new="maximum_links_per_boundary=8"; assert s.count(old) == 1, s.count(old); p.write_text(s.replace(old, new), encoding="utf-8")'
      - name: Verify source
        run: |
          python -m pip install "ruff>=0.9"
          python -m ruff check --fix src/sparkbrain/evaluation/v06_confirmatory_heldout_primary.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sparkbrain/evaluation/v06_confirmatory_heldout_primary.py
          git commit -m "fix(v06): align staging relation reentry config [skip ci]"
          git push origin HEAD:v06-capability-staging-20260830
