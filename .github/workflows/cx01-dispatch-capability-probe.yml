name: CX01 dispatch capability bridge probe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cx01-dispatch-capability-probe.yml
      - .github/workflows/cx01-dispatch-probe-target.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch harmless probe target
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          payload='{"ref":"main"}'
          status="$(curl --silent --show-error --output response.txt --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/cx01-dispatch-probe-target.yml/dispatches" \
            --data "${payload}")"
          if [ "${status}" != '204' ]; then
            cat response.txt
            echo "dispatch probe failed with HTTP ${status}" >&2
            exit 1
          fi
          echo 'dispatch probe accepted with HTTP 204'
