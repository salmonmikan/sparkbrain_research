name: staging-contract-fix

on:
  push:
    branches: ["v06-capability-staging-20260830"]
    paths: [".github/workflows/staging-contract-fix.yml"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v06-capability-staging-20260830
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Align resource field contract
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = (
              Path("src/sparkbrain/evaluation/v06_confirmatory_heldout_primary.py"),
              Path("src/sparkbrain/evaluation/v06_confirmatory_heldout_controls.py"),
              Path("src/sparkbrain/evaluation/v06_confirmatory_heldout_comparators.py"),
          )
          old = "ordinary_field_threshold_crossings"
          new = "normal_field_threshold_crossings"
          changed = 0
          for path in paths:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              path.write_text(text.replace(old, new), encoding="utf-8")
              changed += count
              print(f"{path}: {count} replacement(s)")
          if changed == 0:
              raise SystemExit("resource-contract mismatch was not found")
          PY
      - name: Verify formatting
        run: |
          python -m pip install "ruff>=0.9"
          python -m ruff check --fix \
            src/sparkbrain/evaluation/v06_confirmatory_heldout_primary.py \
            src/sparkbrain/evaluation/v06_confirmatory_heldout_controls.py \
            src/sparkbrain/evaluation/v06_confirmatory_heldout_comparators.py
      - name: Commit contract fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/sparkbrain/evaluation/v06_confirmatory_heldout_primary.py \
            src/sparkbrain/evaluation/v06_confirmatory_heldout_controls.py \
            src/sparkbrain/evaluation/v06_confirmatory_heldout_comparators.py
          git commit -m "fix(v06): align staging resource threshold field [skip ci]"
          git push origin HEAD:v06-capability-staging-20260830
