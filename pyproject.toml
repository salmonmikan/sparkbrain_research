[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkbrain-research"
version = "0.3.1"
description = "Local-first inspectable event-driven cognitive dynamics research prototype"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "SparkBrain research project"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.9",
  "jsonschema>=4.20",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
]
lab = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
learned = [
  "numpy>=2.0",
  "torch==2.13.0",
]
spiking = [
  "torch>=2.2",
  "snntorch==1.0.0",
]
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sparkbrain.lab" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider --assert=plain -m 'not (scientific or reproduction or external)'"
markers = [
  "slow: noticeably slower test that is not part of the fast developer loop",
  "scientific: controlled-science implementation or result-contract test",
  "reproduction: clean-room, release, or generated-artifact reproduction test",
  "external: external-validation boundary or adapter test",
  "integration: multi-component local API or service regression test",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/sparkbrain/benchmark.py" = ["E501"]
"src/sparkbrain/visualizer.py" = ["E501"]
